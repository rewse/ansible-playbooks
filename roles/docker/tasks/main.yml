---
- name: "docker : Install packages"
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose-v2
      - python3-docker
      - skopeo
  tags:
    - docker
    - install
    - docker_docker
    - docker_docker_install

- name: "docker : Add admin user to docker group"
  ansible.builtin.user:
    name: "{{ admin }}"
    groups: docker
    append: true
  tags:
    - docker
    - config
    - docker_docker
    - docker_docker_config

- name: "docker : Configure the daemon"
  # Caps the json-file driver, which is unbounded by default. The limit applies to
  # containers created after it, so a running container keeps its own until it is
  # recreated.
  ansible.builtin.copy:
    src: daemon.json
    dest: /etc/docker/daemon.json
    mode: '0644'
  notify: "docker: Reload"
  tags:
    - docker
    - config
    - docker_docker
    - docker_docker_config

- name: "docker : Create compose directory"
  ansible.builtin.file:
    path: /etc/compose
    state: directory
    mode: "0755"
  tags:
    - docker
    - docker_docker

- name: "docker : Remove shared compose file"
  # Every service runs in its own project under /etc/compose.
  ansible.builtin.file:
    path: /etc/compose.yml
    state: absent
  tags:
    - docker
    - docker_docker
