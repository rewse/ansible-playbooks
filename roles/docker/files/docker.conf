# Whether a container's bind mount reaches the volume it names or the directory of
# the same path on the root filesystem. Docker creates a missing bind source rather
# than failing, so a container that starts ahead of the mount gets an empty
# directory and goes on reporting itself healthy while writing or serving nothing.
# The parameters are the container, the path inside it, and the path on the host.
UserParameter=docker.bind_ok[*],test "$(docker exec "$1" stat -c %d "$2" 2>/dev/null)" = "$(stat -c %d "$3" 2>/dev/null)" && echo 1 || echo 0

UserParameter=docker.healthy[*],docker inspect -f "{{if .State.Health}}{{.State.Health.Status}}{{end}}" "$1" 2>/dev/null | grep -qx healthy && echo 1 || echo 0
UserParameter=docker.running[*],docker inspect -f "{{.State.Running}}" "$1" 2>/dev/null | grep -qx true && echo 1 || echo 0
