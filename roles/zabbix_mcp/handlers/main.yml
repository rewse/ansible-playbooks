---
- name: Reload Apache
  ansible.builtin.systemd:
    name: apache2
    state: reloaded

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted

- name: Restart zabbix-mcp-server
  ansible.builtin.systemd:
    name: zabbix-mcp-server
    state: restarted
  when: not ansible_check_mode
