---
# Bay 2 of the enclosure on nas_host. That host writes to the directory, the
# others mount it over NFS from there.
#
# nas_sources names the volumes on nas_host that --one-file-system will not
# reach from /. Only homes belongs in the repository: the archive has its own
# copy on Bay 3 and in S3, the Frigate recordings expire on their own, and the
# staging directories are temporary copies of data that is backed up elsewhere.
# Naming what to keep rather than what to skip is what keeps 2.7 TB of staging
# out of a 1.9 TB volume.
restic_nas_host: fox
# 128 MiB is restic's ceiling. Adopted when the repository was reached over
# NFS, where each small file cost a round trip; still worthwhile for the host
# that now reaches it locally, which gains fewer files and less metadata.
restic_pack_size: 128
restic_nas_sources:
  - /srv/nas/data/homes
restic_repo_root: /srv/nas/backup
# After the local backup at 04:00, so the day's local snapshot exists before the
# uplink is busy, and clear of the volume repositories on the NAS host at 05:00
# and 06:00. Reached through a drop-in, the template carrying no schedule.
restic_s3_backup_schedule: '*-*-* 07:00:00'
# Sunday, clear of the backups that run from 04:00 to 07:00 and of the volume
# checks at 09:00 on the NAS host.
restic_s3_check_schedule: 'Sun *-*-* 10:00:00'
