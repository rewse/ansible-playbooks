---
- name: "litellm : Create configuration directory"
  ansible.builtin.file:
    path: /srv/litellm
    state: directory
    owner: root
    group: root
    mode: '0755'
  tags:
    - litellm
    - config
    - litellm_litellm
    - litellm_litellm_init

- name: "litellm : Copy configuration file"
  ansible.builtin.copy:
    src: config.yml
    dest: /srv/litellm
    mode: '0644'
  notify: "litellm: Restart"
  tags:
    - litellm
    - config
    - litellm_litellm
    - litellm_litellm_config

- name: "docker : Resolve aged image"
  ansible.builtin.set_fact:
    # Upstream publishes no -stable tags; rc, dev and nightly must stay out.
    __litellm_image: >-
      {{ lookup('aged_release', 'oci:ghcr.io/berriai/litellm', pattern='^v\d+\.\d+\.\d+$',
                platform='linux/' ~ ('arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64')) }}
  tags:
    - litellm
    - update
    - docker
    - litellm_docker

- name: "docker : Create compose directory"
  ansible.builtin.file:
    path: /etc/compose/litellm
    state: directory
    mode: "0755"
  tags:
    - litellm
    - update
    - docker
    - litellm_docker

- name: "docker : Deploy compose file"
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: /etc/compose/litellm/compose.yaml
    mode: "0640"
  # Carries credentials in the environment, so no diff.
  diff: false
  register: __litellm_compose
  tags:
    - litellm
    - update
    - docker
    - litellm_docker

# The container kept its name when it moved out of the shared /etc project, so
# the old one has to go before the new project can create it. These run before
# the start, against the usual order, and can be deleted once every host has
# converged.
- name: "docker : Read legacy container litellm"
  community.docker.docker_container_info:
    name: litellm
  register: __litellm_legacy_litellm
  tags:
    - litellm
    - update
    - docker
    - litellm_docker

- name: "docker : Remove legacy container litellm"
  community.docker.docker_container:
    name: litellm
    state: absent
  when:
    - __litellm_legacy_litellm.exists
    - __litellm_legacy_litellm.container.Config.Labels['com.docker.compose.project'] | default('') == 'etc'
  tags:
    - litellm
    - update
    - docker
    - litellm_docker

- name: "docker : Remove legacy compose block litellm"
  ansible.builtin.blockinfile:
    path: /etc/compose.yml
    marker: "# {mark} ANSIBLE MANAGED BLOCK litellm"
    state: absent
  tags:
    - litellm
    - update
    - docker
    - litellm_docker

- name: "docker : Report skipped start in check mode"
  ansible.builtin.debug:
    msg: Start skipped because the compose file is not written in check mode
    verbosity: 0
  when: ansible_check_mode and __litellm_compose is changed
  tags:
    - litellm
    - update
    - docker
    - litellm_docker

- name: "docker : Start containers"
  community.docker.docker_compose_v2:
    project_src: /etc/compose/litellm
    state: present
    pull: missing
  when: not (ansible_check_mode and __litellm_compose is changed)
  tags:
    - litellm
    - update
    - docker
    - litellm_docker
