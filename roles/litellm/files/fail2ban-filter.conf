# Reads the Apache log for the reason the couchdb filter gives: the container log
# path changes whenever the container is recreated.
#
# Format is vhost_combined, so the virtual host comes first and <HOST> is the
# second field. The host is pinned because the file carries every name Apache
# serves.
#
# Only a failed UI sign-in counts. The UI requests /v1/models, /mcp and /health
# without credentials on every page load, so a 401 there is normal use. A wrong
# API key gets 400 "No connected db" because the proxy runs without a database,
# the same status as a malformed request, so it cannot be told apart here.
[Definition]
failregex = ^litellm\.rewse\.jp:\d+ <HOST> \S+ \S+ \[\] "POST /(?:v2/)?login(?:\?\S*)? HTTP/[\d.]+" 401 \d+
ignoreregex =
