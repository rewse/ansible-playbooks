---
- name: container | Resolve aged image
  ansible.builtin.set_fact:
    __nvr_image: >-
      {{ lookup('aged_release', 'oci:ghcr.io/blakeblackshear/frigate', pattern='^\d+\.\d+\.\d+$',
                platform='linux/' ~ ('arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64')) }}

- name: container | Create configuration directory
  ansible.builtin.file:
    path: /srv/nvr
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: container | Deploy configuration file
  # Part of the container component because its version key follows the image.
  ansible.builtin.template:
    src: config.yml.j2
    dest: /srv/nvr/config.yml
    mode: "0644"
  notify: Restart nvr

- name: container | Create compose directory
  ansible.builtin.file:
    path: /etc/compose/nvr
    state: directory
    mode: "0755"

- name: container | Deploy compose file
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: /etc/compose/nvr/compose.yaml
    mode: "0640"
  # Carries credentials in the environment, so no diff.
  diff: false
  register: __nvr_compose

- name: container | Report skipped start in check mode
  ansible.builtin.debug:
    msg: Start skipped because the compose file is not written in check mode
    verbosity: 0
  when: ansible_check_mode and __nvr_compose is changed

- name: container | Start containers
  community.docker.docker_compose_v2:
    project_src: /etc/compose/nvr
    state: present
    pull: missing
  when: not (ansible_check_mode and __nvr_compose is changed)
