---
- name: storage | Fail when the recording volume is not mounted
  # Frigate would otherwise write recordings onto the root filesystem under an
  # empty mount point, filling the NVMe and losing them once Bay 1 is mounted.
  # ansible.posix.mount would mount it rather than report its state.
  ansible.builtin.command:
    cmd: mountpoint -q {{ nvr_media_parent }}
  changed_when: false
  check_mode: false

- name: storage | Create recording directory
  ansible.builtin.file:
    path: "{{ nvr_media_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
