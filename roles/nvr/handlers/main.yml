---
- name: Reload Apache
  ansible.builtin.systemd:
    name: apache2
    state: reloaded

- name: Restart fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted

- name: Restart nvr
  community.docker.docker_compose_v2:
    project_src: /etc/compose/nvr
    state: restarted
  # The project directory may not exist yet in check mode.
  when: not ansible_check_mode

- name: Restart zabbix-agent
  ansible.builtin.systemd:
    name: zabbix-agent
    state: restarted
