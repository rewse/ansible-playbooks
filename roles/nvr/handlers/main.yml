---
- name: "apache: Reload"
  ansible.builtin.systemd:
    name: apache2
    state: reloaded

- name: "nvr: Restart"
  community.docker.docker_compose_v2:
    project_src: /etc
    services: frigate
    state: restarted
    pull: always
    recreate: always

- name: "nvr : Restart zabbix-agent"
  ansible.builtin.systemd:
    name: zabbix-agent
    state: restarted
