---
- name: "apache: Reload"
  ansible.builtin.systemd:
    name: apache2
    state: reloaded

- name: "nvr: Restart"
  community.docker.docker_compose_v2:
    project_src: /etc/compose/nvr
    state: restarted
  # The project directory may not exist yet in check mode.
  when: not ansible_check_mode

- name: "nvr : Restart zabbix-agent"
  ansible.builtin.systemd:
    name: zabbix-agent
    state: restarted
