---
# Bay 1 (SSD). Recordings go here rather than to Bay 3 (HDD) to avoid the noise
# of a spindle writing around the clock.
nvr_media_parent: /srv/nas/data
nvr_media_dir: "{{ nvr_media_parent }}/nvr"

# 265 kbps per camera measured from the SDP (134 kbps H.264 + 131 kbps AAC)
# works out to 2.8 GB per camera-day, so 30 days of all four fits in 340 GB.
nvr_retain_days: 30

# Frigate asks for 162 MB with four cameras and warns every ten seconds below it,
# so this clears its own figure rather than the 73 MB actually used. The gap is
# headroom for frames in flight: the buffers are 49 per camera at the detect
# resolution of 640 * 360 * 1.5, which is 17 MB each, and they are allocated per
# configured camera rather than per connected one. A camera powered off therefore
# costs the same as one streaming, which is why usage held constant for an hour.
nvr_shm_size: 192m
# 951 MiB peak with four cameras, reached while the hourly preview compilation
# runs. The headroom is not about freeing RAM, fox having 7.8 GB: it walls Frigate
# off from taking Home Assistant down with it, and 1g risked an OOM kill.
nvr_mem_limit: 2g

# Staging for recording segments and for the preview frames, which accumulate
# until they are compiled into one file an hour. That compilation is what empties
# this, so the peak arrives just before the hour: 74 MB with four cameras, growing
# 1.2 MB a minute. 256 MiB covers a compilation cycle being missed.
nvr_cache_size: 268435456

nvr_cameras:
  - name: eufy-dad
    host: eufy-dad.rewse.jp
  - name: eufy-ent
    host: eufy-ent.rewse.jp
  - name: eufy-liv
    host: eufy-liv.rewse.jp
  - name: eufy-mom
    host: eufy-mom.rewse.jp

nvr_rtsp_username: "{{ lookup('pipe', 'op read \"op://ansible/Eufy - RTSP/username\"') }}"
nvr_rtsp_password: "{{ lookup('pipe', 'op read \"op://ansible/Eufy - RTSP/password\"') }}"

# The Home Assistant integration needs MQTT: switches, sensors and the review
# entities are published over it, and without a broker the integration only
# exposes cameras. mosquitto runs on the host under systemd, reachable at the
# gateway of the compose network this container joins. pub_client is used because
# Frigate both publishes state and subscribes to command topics, and the two
# accounts differ only in name (there is no ACL).
nvr_mqtt_host: 172.18.0.1
nvr_mqtt_username: pub_client
nvr_mqtt_password: "{{ lookup('pipe', 'op read op://ansible/Mosquitto/credential') }}"
