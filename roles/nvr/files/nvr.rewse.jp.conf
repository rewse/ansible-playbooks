<VirtualHost *:443>
    ServerAdmin hostmaster@rewse.jp
    ServerName nvr.rewse.jp

    ProxyPreserveHost on
    ProxyRequests off

    # Frigate serves 8971 over HTTPS with a self-signed certificate, so the
    # upstream scheme is https and its certificate cannot be verified.
    SSLProxyEngine on
    SSLProxyVerify none
    SSLProxyCheckPeerCN off
    SSLProxyCheckPeerName off

    # Frigate's bundled nginx trusts the proxy authentication headers on its
    # login and logout locations, which need no session, and writes
    # X-Ingress-Path into the page unescaped. No proxy in front of Frigate sets
    # any of them, so whatever a client sends is dropped. The unset runs in
    # fixups, before mod_proxy builds the backend request, as on nas.rewse.jp.
    RequestHeader unset Remote-Email
    RequestHeader unset Remote-Groups
    RequestHeader unset Remote-Name
    RequestHeader unset Remote-Role
    RequestHeader unset Remote-User
    RequestHeader unset X-Forwarded-User
    RequestHeader unset X-Ingress-Path
    RequestHeader unset X-Proxy-Secret

    # Frigate's nginx reports its cache state on every response.
    Header unset X-Cache-Status

    # Frigate frames its own WebRTC player, and nothing else embeds this name.
    Header always set Content-Security-Policy "frame-ancestors 'self'"
    Header always set Cross-Origin-Opener-Policy "same-origin"
    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"

    # Frigate sets Secure on its session cookie only when auth.cookie_secure is
    # on, and its config here leaves that to the default, off. The backend's
    # Set-Cookie is in the onsuccess table, so this edit has no always, and the
    # lookahead skips a cookie that already carries Secure.
    Header edit Set-Cookie "^(frigate_token=(?!.*;\s*(?i:secure)\s*(?:;|$)).*)$" "$1; Secure"

    ProxyPass / https://localhost:8971/
    ProxyPassReverse / https://localhost:8971/

    RewriteEngine on
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*) wss://localhost:8971/$1 [P,L]
    RewriteCond %{HTTP:Upgrade} !=websocket [NC]
    RewriteRule /(.*) https://localhost:8971/$1 [P,L]

    # Video segments and exports can take a while to stream.
    ProxyTimeout 600

    SSLCertificateFile /etc/letsencrypt/live/rewse.jp/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/rewse.jp/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
