<VirtualHost *:443>
    ServerAdmin hostmaster@rewse.jp
    ServerName nvr.rewse.jp

    ProxyPreserveHost on
    ProxyRequests off

    # Frigate serves 8971 over HTTPS with a self-signed certificate, so the
    # upstream scheme is https and its certificate cannot be verified.
    SSLProxyEngine on
    SSLProxyVerify none
    SSLProxyCheckPeerCN off
    SSLProxyCheckPeerName off

    ProxyPass / https://localhost:8971/
    ProxyPassReverse / https://localhost:8971/

    RewriteEngine on
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*) wss://localhost:8971/$1 [P,L]
    RewriteCond %{HTTP:Upgrade} !=websocket [NC]
    RewriteRule /(.*) https://localhost:8971/$1 [P,L]

    # Video segments and exports can take a while to stream.
    ProxyTimeout 600

    SSLCertificateFile /etc/letsencrypt/live/rewse.jp/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/rewse.jp/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
