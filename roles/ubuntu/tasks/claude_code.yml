---
- name: claude_code | Remove Claude Code
  # Claude Code runs only on the business Mac. Delete this task once every host
  # has converged.
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /home/{{ admin }}/.claude
    - /home/{{ admin }}/.claude.json
    - /root/.claude
    - /root/.claude.json
    - /root/.local/bin/claude
    - /root/.local/share/claude
    - /usr/local/bin/claude
