---
# zinit itself is installed globally so root and the admin user share one copy.
# Each user's plugins stay in their own ~/.local/share/zinit. The vendor
# installer clones the default branch head and edits .zshrc, which chezmoi
# owns, so the checkout is managed directly at an aged release instead.
- name: zinit | Create home
  ansible.builtin.file:
    path: /usr/local/share/zinit
    state: directory
    mode: "0755"

- name: zinit | Resolve aged release
  ansible.builtin.set_fact:
    __ubuntu_zinit: "{{ lookup('aged_release', 'github-tag:zdharma-continuum/zinit', branch='main') }}"

- name: zinit | Check out zinit
  # The URL matches the origin the vendor installer sets, so an installer
  # checkout is moved to the pinned commit in place.
  ansible.builtin.git:
    repo: https://github.com/zdharma-continuum/zinit
    dest: /usr/local/share/zinit/zinit.git
    version: "{{ __ubuntu_zinit.commit }}"
