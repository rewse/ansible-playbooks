---
# kiro-cli is installed globally so root and the admin user share one copy. A
# per-user install under /root cannot be shared through links because /root is
# not readable by other users.
- name: kiro_cli | Download installer
  ansible.builtin.get_url:
    url: https://cli.kiro.dev/install
    dest: /usr/local/src/kiro-cli-install.sh
    mode: "0755"

- name: kiro_cli | Install
  # The vendor installer has no module. Q_INSTALL_GLOBAL selects /usr/local/bin.
  ansible.builtin.command: bash /usr/local/src/kiro-cli-install.sh --no-modify-path
  args:
    creates: /usr/local/bin/kiro-cli
  environment:
    Q_INSTALL_GLOBAL: "1"

- name: kiro_cli | Update
  # kiro-cli updates itself; no module manages it.
  ansible.builtin.command: /usr/local/bin/kiro-cli update --non-interactive
  register: __ubuntu_kiro_cli_update
  changed_when: "'You are on the current version' not in __ubuntu_kiro_cli_update.stdout"
