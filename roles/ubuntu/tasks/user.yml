---
- name: user | Create admin group
  ansible.builtin.group:
    name: "{{ admin_user }}"
    gid: 2000

- name: user | Create admin user
  ansible.builtin.user:
    name: "{{ admin_user }}"
    uid: 2000
    group: "{{ admin_user }}"
    groups: "adm,sudo"
    # Append so the docker role's docker group survives this task.
    append: true
    shell: /usr/bin/zsh
    skeleton: /etc/skel

- name: user | Allow passwordless sudo for admin
  ansible.builtin.lineinfile:
    dest: /etc/sudoers.d/00-{{ admin_user }}
    regexp: "^{{ admin_user }}"
    line: "{{ admin_user }} ALL=(ALL) NOPASSWD: ALL"
    create: true
    mode: "0440"
    validate: "visudo -cf %s"

- name: user | Create .ssh directory for admin
  ansible.builtin.file:
    path: /home/{{ admin_user }}/.ssh
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    state: directory
    mode: "0700"

- name: user | Copy authorized_keys for admin
  ansible.builtin.copy:
    src: /home/ubuntu/.ssh/authorized_keys
    dest: /home/{{ admin_user }}/.ssh/authorized_keys
    remote_src: true
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0600"
