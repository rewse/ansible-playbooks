---
- name: user | Create admin group
  ansible.builtin.group:
    name: "{{ admin_user }}"
    gid: 2000

- name: user | Create admin user
  ansible.builtin.user:
    name: "{{ admin_user }}"
    uid: 2000
    group: "{{ admin_user }}"
    groups: "adm,sudo"
    # Append so the docker role's docker group survives this task.
    append: true
    shell: /usr/bin/zsh
    skeleton: /etc/skel

- name: user | Allow passwordless sudo for admin
  ansible.builtin.lineinfile:
    dest: /etc/sudoers.d/00-{{ admin_user }}
    regexp: "^{{ admin_user }}"
    line: "{{ admin_user }} ALL=(ALL) NOPASSWD: ALL"
    create: true
    mode: "0440"
    validate: "visudo -cf %s"

- name: user | Create .ssh directory for admin
  ansible.builtin.file:
    path: /home/{{ admin_user }}/.ssh
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    state: directory
    mode: "0700"

- name: user | Read authorized_keys of ubuntu
  ansible.builtin.slurp:
    src: /home/ubuntu/.ssh/authorized_keys
  register: __ubuntu_authorized_keys

# The admin gets ubuntu's keys followed by ubuntu_admin_extra_authorized_keys.
# Without extra keys the file is a byte-for-byte copy of ubuntu's.
- name: user | Write authorized_keys for admin
  ansible.builtin.copy:
    content: "{{ __ubuntu_base_keys ~ ((('' if __ubuntu_base_keys[-1:] == '\n' else '\n') ~ (ubuntu_admin_extra_authorized_keys | join('\n')) ~ '\n') if ubuntu_admin_extra_authorized_keys | default([]) else '') }}"
    dest: /home/{{ admin_user }}/.ssh/authorized_keys
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0600"
  vars:
    __ubuntu_base_keys: "{{ __ubuntu_authorized_keys.content | b64decode }}"
