---
- name: uv | Download installer
  ansible.builtin.get_url:
    url: https://astral.sh/uv/install.sh
    dest: /usr/local/src/uv-install.sh
    mode: "0755"

- name: uv | Install
  # The vendor installer has no module.
  ansible.builtin.command: sh /usr/local/src/uv-install.sh
  args:
    creates: /usr/local/bin/uv
  environment:
    UV_INSTALL_DIR: /usr/local/bin

- name: uv | Update
  # uv updates itself; no module manages it.
  ansible.builtin.command: /usr/local/bin/uv self update
  changed_when: false

# Web search through a Bedrock AgentCore Gateway, signed with local AWS
# credentials. Published only as a sample repository without tags, so it installs
# from an aged commit rather than PyPI. Needs the gateway from the repo's
# CloudFormation template and AGENTCORE_GATEWAY_URL, which .zshenv exports.
- name: uv | Resolve aged agentcore-websearch commit
  ansible.builtin.set_fact:
    __ubuntu_agentcore_websearch: "{{ lookup('aged_release', 'github-commit:aws-samples/sample-agentcore-websearch-agent-skill') }}"

- name: uv | Install agentcore-websearch
  # uv has no Ansible module. uv reinstalls the tool when the commit changes and
  # otherwise reports it as already installed.
  ansible.builtin.command: uv tool install git+https://github.com/aws-samples/sample-agentcore-websearch-agent-skill@{{ __ubuntu_agentcore_websearch.commit }}
  environment: "{{ supply_chain_cooldown_environment }}"
  register: __ubuntu_agentcore_websearch_install
  changed_when: "'is already installed' not in __ubuntu_agentcore_websearch_install.stderr"

- name: uv | Install tools
  # uv has no Ansible module.
  ansible.builtin.command: uv tool install {{ item }}
  environment: "{{ supply_chain_cooldown_environment }}"
  changed_when: false
  loop:
    - pdfplumber
    - tavily-cli

- name: uv | Upgrade tools
  # uv has no Ansible module.
  ansible.builtin.command: uv tool upgrade --all
  environment: "{{ supply_chain_cooldown_environment }}"
  changed_when: false
