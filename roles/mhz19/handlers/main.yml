---
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart mhz192mqtt timer
  ansible.builtin.systemd:
    name: mhz192mqtt.timer
    state: restarted
    daemon_reload: true

- name: Report a pending reboot for the UART
  ansible.builtin.debug:
    msg: "Reboot to release ttyAMA0 from the kernel console"
    verbosity: 0
