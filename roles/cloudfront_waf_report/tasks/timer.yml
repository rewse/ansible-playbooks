---
- name: timer | Install systemd service
  ansible.builtin.template:
    src: cloudfront-waf-report.service.j2
    dest: /etc/systemd/system/cloudfront-waf-report.service
    mode: "0644"
  notify: Reload systemd

- name: timer | Install systemd timer
  ansible.builtin.copy:
    src: cloudfront-waf-report.timer
    dest: /etc/systemd/system/cloudfront-waf-report.timer
    mode: "0644"
  notify: Restart cloudfront-waf-report timer

- name: timer | Enable and start timer
  ansible.builtin.systemd:
    name: cloudfront-waf-report.timer
    enabled: true
    state: started
    daemon_reload: true
