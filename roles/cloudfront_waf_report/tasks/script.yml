---
- name: script | Install script
  ansible.builtin.copy:
    src: cloudfront-waf-report
    dest: /usr/local/bin/cloudfront-waf-report
    mode: "0755"

- name: script | Create config directory
  ansible.builtin.file:
    path: /etc/cloudfront-waf-report
    state: directory
    mode: "0755"

- name: script | Install config
  ansible.builtin.template:
    src: config.json.j2
    dest: /etc/cloudfront-waf-report/config.json
    mode: "0644"
