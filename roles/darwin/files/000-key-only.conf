# Managed by Ansible (roles/darwin, sshd component).
#
# Accept only public keys. macOS runs sshd with UsePAM yes, so turning off
# PasswordAuthentication alone still lets PAM ask for the password through
# keyboard-interactive authentication. sshd keeps the first value it reads for
# each option, so this file sorts before the 100-macos.conf that macOS ships.
PasswordAuthentication no
KbdInteractiveAuthentication no
