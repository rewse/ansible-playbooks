---
- name: security | Resolve aged Aikido Safe Chain release
  ansible.builtin.set_fact:
    __darwin_safe_chain: "{{ lookup('aged_release', 'github-release:AikidoSec/safe-chain', asset='install-safe-chain.sh') }}"

- name: security | Download Aikido Safe Chain installer
  # The installer attached to a release pins that version and the checksums of
  # its binaries; the one on the default branch installs whatever is newest.
  ansible.builtin.get_url:
    url: "{{ __darwin_safe_chain.url }}"
    dest: "{{ ansible_facts['env']['HOME'] }}/Library/Caches/install-safe-chain-{{ __darwin_safe_chain.version }}.sh"
    mode: "0755"
    checksum: "{{ __darwin_safe_chain.checksum | default(omit, true) }}"

- name: security | Install Aikido Safe Chain
  # The vendor's install method. It skips a version already installed, but finds
  # the installed one only through PATH, and each reinstall also appends to the
  # shell startup files.
  ansible.builtin.command: sh {{ ansible_facts['env']['HOME'] }}/Library/Caches/install-safe-chain-{{ __darwin_safe_chain.version }}.sh
  register: __darwin_safe_chain_install
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.safe-chain/bin:{{ ansible_facts['env']['PATH'] }}"
  changed_when: "'is already installed' not in __darwin_safe_chain_install.stdout"
  # A dry run does not download the installer.
  when: not ansible_check_mode

- name: security | Report installation deferred in check mode
  ansible.builtin.debug:
    msg: The installer is not downloaded in check mode, so it is not run.
    verbosity: 0
  when: ansible_check_mode
