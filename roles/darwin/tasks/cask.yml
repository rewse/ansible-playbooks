---
# A loop rather than a list: with a list the module stops at the first failing
# cask, which is common when an app already exists at the target path.
- name: cask | Install casks
  community.general.homebrew_cask:
    name: "{{ item }}"
    update_homebrew: false
  loop: "{{ darwin_casks + darwin_extra_casks }}"
  failed_when: false
