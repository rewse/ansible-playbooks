---
- name: container | Resolve aged image
  ansible.builtin.set_fact:
    # Only the stable line. The project ships beta and preview tags from the same
    # repository, and the suffix is part of the tag rather than a variant, so it
    # has to be matched rather than stripped.
    __filebrowser_image: >-
      {{ lookup('aged_release', 'oci:ghcr.io/gtsteffaniak/filebrowser',
                pattern='^\d+\.\d+\.\d+-stable$',
                platform='linux/' ~ ('arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64')) }}

- name: container | Create compose directory
  ansible.builtin.file:
    path: /etc/compose/filebrowser
    state: directory
    mode: "0755"

- name: container | Deploy compose file
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: /etc/compose/filebrowser/compose.yaml
    mode: "0644"
  register: __filebrowser_compose

- name: container | Report skipped start in check mode
  ansible.builtin.debug:
    msg: Start skipped because the compose file is not written in check mode
    verbosity: 0
  when: ansible_check_mode and __filebrowser_compose is changed

- name: container | Start container
  community.docker.docker_compose_v2:
    project_src: /etc/compose/filebrowser
    state: present
    pull: missing
    # v2 initializes its database before it starts the HTTP server, so waiting
    # for healthy keeps a restart from a handler later in the play from
    # interrupting that. Every run waits, so a failure here means the service
    # is unhealthy, not that the wait is in the way.
    wait: true
    wait_timeout: 300
  when: not (ansible_check_mode and __filebrowser_compose is changed)
