---
# The container reads its config and writes its database and thumbnail cache
# here. On the NVMe rather than under /srv/nas, so a USB disconnect of the
# enclosure cannot take the database with it.
filebrowser_data_dir: /srv/filebrowser

# Published on the loopback address only, so nothing off the host reaches it
# except through the Apache vhost, which is where the rate limiting and the
# fail2ban jail live.
filebrowser_port: 8080

# The image bakes in uid 1000 and has no PUID/PGID support, so the runtime user
# is overridden instead. It has to be tats: the archive is 0700 tats:tats and so
# is the home directory below it, and nothing else can read them.
filebrowser_uid: 2000
filebrowser_gid: 2000

filebrowser_hostname: nas.rewse.jp

# Measured 802 MiB for Frigate taught the lesson: a limit with no headroom is an
# OOM kill waiting to happen. The index holds around 18,000 items and lives in
# SQLite rather than on the heap, so this is a wall against a runaway rather than
# a sizing estimate. Measured 99.8 MiB steady state.
filebrowser_mem_limit: 1g

# What gets published. Only the home directory: everything else on the enclosure
# is outside it, so the Time Machine sparsebundles and the restic repositories on
# Bay 2 are excluded by not being reachable rather than by a rule that could be
# written wrong. The archive is not published either -- it is cold storage that
# nothing browses from a phone, and leaving it out keeps 271,000 items out of the
# index.
#
# readOnly because the purpose is search and browsing from a phone, and Macs
# write over SMB. It also means a stolen session cannot delete anything, and that
# an index built while the enclosure was absent cannot write into the empty mount
# point.
#
# The path is written out rather than taken from the nas role, whose vars are
# scoped to it.
filebrowser_sources:
  - name: Home
    path: "/srv/nas/data/homes/{{ admin }}"
    rules: []

filebrowser_admin_password: "{{ lookup('pipe', 'op read \"op://ansible/FileBrowser Quantum/password\"') }}"
# Supplied rather than generated so that rebuilding the container or losing the
# database leaves sessions and share signatures valid. Without it the key is
# random at first start and only the database remembers it.
filebrowser_jwt_secret: "{{ lookup('pipe', 'op read \"op://ansible/FileBrowser Quantum/jwt token secret\"') }}"
