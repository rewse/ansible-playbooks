---
# The container reads its config and writes its database and thumbnail cache
# here. On the NVMe rather than under /srv/nas, so a USB disconnect of the
# enclosure cannot take the database with it.
filebrowser_data_dir: /srv/filebrowser

# Published on the loopback address only, so nothing off the host reaches it
# except through the Apache vhost, which terminates TLS and logs the requests.
filebrowser_port: 8080

# The image bakes in uid 1000 and has no PUID/PGID support, so the runtime user is
# overridden instead. It has to own the published directory, which is 0700.
filebrowser_uid: 2000
filebrowser_gid: 2000

filebrowser_hostname: nas.rewse.jp

# A wall against a runaway rather than a sizing estimate: the index holds around
# 18,000 items and lives in SQLite rather than on the heap, and steady state
# measures 99.8 MiB. The headroom is deliberate, since a limit met exactly is an
# OOM kill waiting to happen.
filebrowser_mem_limit: 1g

# How long a web UI session lasts. Upstream defaults to 2 hours, which expires
# between visits from the phone, and every re-entry costs a password and a passkey
# prompt. The exposure is that a leaked token stays usable for this long; it is
# accepted because the published source is read-only.
filebrowser_token_expiration_hours: 720

# What gets published. The home directory and nothing else, so the Time Machine
# sparsebundles and the restic repositories on Bay 2 are kept out by not being
# reachable rather than by an exclusion rule that could be written wrong. The
# archive stays out for the same reason: it is cold storage that nothing browses
# from a phone, and its 271,000 items would dominate the index.
#
# readOnly because the purpose is search and browsing from a phone, and Macs
# write over SMB. It also means a stolen session cannot delete anything, and that
# an index built while the enclosure was absent cannot write into the empty mount
# point.
#
# The path is written out rather than taken from the nas role, whose vars are
# scoped to it.
filebrowser_sources:
  - name: Home
    path: "/srv/nas/data/homes/{{ admin }}"
    rules: []

filebrowser_admin_password: "{{ lookup('pipe', 'op read \"op://ansible/FileBrowser Quantum/password\"') }}"
# Supplied rather than generated so that rebuilding the container or losing the
# database leaves sessions and share signatures valid. Without it the key is
# random at first start and only the database remembers it.
filebrowser_jwt_secret: "{{ lookup('pipe', 'op read \"op://ansible/FileBrowser Quantum/jwt token secret\"') }}"
