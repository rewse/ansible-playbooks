---
- name: "mysql : Add apt repository"
  ansible.builtin.apt:
    # The unversioned name always serves the newest release; apt then keeps the
    # repository's packages current.
    deb: https://repo.mysql.com/mysql-apt-config.deb
  tags:
    - database-client
    - install
    - mysql
    - database-client_mysql
    - database-client_mysql_config

- name: "database-client : Install packages"
  ansible.builtin.apt:
    name:
      - mysql-client
      - postgresql-client
      - libpostgresql-jdbc-java
      - alien
      - rlwrap
  tags:
    - database-client
    - install
    - database-client_database-client
    - database-client_database-client_install

- name: "mysql : Install connector-j"
  ansible.builtin.apt:
    name: mysql-connector-j
    state: present
  tags:
    - database-client
    - install
    - mysql
    - database-client_mysql
    - database-client_mysql_install

# Oracle serves the newest release under an unversioned name, so every run
# downloads it and extracts only when the archive changed.
- name: "oracle : Download instantclient archives"
  ansible.builtin.get_url:
    url: "https://download.oracle.com/otn_software/linux/instantclient/instantclient-{{ item }}-{{ ('linux-arm64' if ansible_facts['architecture'] == 'aarch64' else 'linuxx64') }}.zip"
    dest: "/usr/local/src/instantclient-{{ item }}.zip"
    mode: "0644"
    force: true
  loop:
    - basic
    - sqlplus
    - tools
  register: __database_client_instantclient_download
  tags:
    - database-client
    - install
    - oracle
    - database-client_oracle
    - database-client_oracle_install

- name: "oracle : Extract instantclient archives"
  ansible.builtin.unarchive:
    src: "{{ item.dest }}"
    dest: /srv
    remote_src: true
  loop: "{{ __database_client_instantclient_download.results }}"
  loop_control:
    label: "{{ item.item }}"
  # A dry run does not download the archive to extract.
  when: item is changed and not ansible_check_mode
  tags:
    - database-client
    - install
    - oracle
    - database-client_oracle
    - database-client_oracle_install

- name: "oracle : Find instantclient directories"
  ansible.builtin.find:
    paths: /srv
    patterns: "instantclient_*"
    file_type: directory
  register: __database_client_instantclient_dirs
  tags:
    - database-client
    - install
    - oracle
    - database-client_oracle
    - database-client_oracle_install

- name: "oracle : Select newest instantclient directory"
  ansible.builtin.set_fact:
    __database_client_instantclient_dir: >-
      {{ __database_client_instantclient_dirs.files | map(attribute='path')
         | community.general.version_sort | last }}
  tags:
    - database-client
    - install
    - oracle
    - database-client_oracle
    - database-client_oracle_install

- name: "oracle : Add instantclient to PATH"
  ansible.builtin.template:
    src: oracle-instantclient.sh.j2
    dest: /etc/profile.d/oracle-instantclient.sh
    mode: '0644'
  tags:
    - database-client
    - config
    - oracle
    - database-client_oracle
    - database-client_oracle_config

- name: "oracle : Add instantclient to ld.so.conf"
  ansible.builtin.template:
    src: oracle-instantclient.conf.j2
    dest: /etc/ld.so.conf.d/oracle-instantclient.conf
    mode: '0644'
  tags:
    - database-client
    - config
    - oracle
    - database-client_oracle
    - database-client_oracle_config

- name: "oracle : Create symlink for ojdbc.jar"
  ansible.builtin.file:
    src: "{{ __database_client_instantclient_dir }}/ojdbc8.jar"
    dest: /usr/share/java/ojdbc11.jar
    state: link
  tags:
    - database-client
    - config
    - oracle
    - database-client_oracle
    - database-client_oracle_init

- name: "oracle : Add safe directory for git"
  community.general.git_config:
    name: safe.directory
    scope: global
    value: /srv/git/orascript
  tags:
    - database-client
    - config
    - oracle
    - database-client_oracle
    - database-client_oracle_config

- name: "oracle : Clone orascript repository"
  ansible.builtin.git:
    repo: git@github.com:rewse/orascript.git
    dest: /srv/git/orascript
    accept_hostkey: true
    key_file: /home/{{ admin }}/.ssh/id_rsa
    version: master
  tags:
    - database-client
    - install
    - oracle
    - database-client_oracle
    - database-client_oracle_config

- name: "oracle : Set ownership of orascript"
  ansible.builtin.file:
    path: /srv/git/orascript
    owner: "{{ admin }}"
    group: "{{ admin }}"
    recurse: true
  tags:
    - database-client
    - config
    - oracle
    - database-client_oracle
    - database-client_oracle_config

- name: "oracle : Copy orarc to admin home"
  become: true
  become_user: "{{ admin }}"
  ansible.builtin.copy:
    src: /srv/git/orascript/orarc
    dest: /home/{{ admin }}/.orarc
    remote_src: true
    mode: '0644'
  tags:
    - database-client
    - config
    - oracle
    - database-client_oracle
    - database-client_oracle_config

- name: "oracle : Create symlink for orascript/common"
  become: true
  become_user: "{{ admin }}"
  ansible.builtin.file:
    src: /srv/git/orascript/common
    dest: /home/{{ admin }}/oracle
    state: link
  tags:
    - database-client
    - config
    - oracle
    - database-client_oracle
    - database-client_oracle_init

- name: "redshift : Resolve aged release"
  ansible.builtin.set_fact:
    # Releases on GitHub carry no jar; the jar lives on S3 under the same version.
    __database_client_redshift_version: "{{ lookup('aged_release', 'github-release:aws/amazon-redshift-jdbc-driver').version | regex_replace('^v', '') }}"
  tags:
    - database-client
    - install
    - redshift
    - database-client_redshift
    - database-client_redshift_download

- name: "redshift : Download JDBC driver"
  ansible.builtin.get_url:
    url: https://s3.amazonaws.com/redshift-downloads/drivers/jdbc/{{ __database_client_redshift_version }}/redshift-jdbc42-{{ __database_client_redshift_version }}.jar
    dest: /usr/share/java
    mode: '0644'
  register: __database_client_redshift_download
  tags:
    - database-client
    - install
    - redshift
    - database-client_redshift
    - database-client_redshift_download

- name: "redshift : Create symlinks for JDBC driver"
  ansible.builtin.file:
    src: redshift-jdbc42-{{ __database_client_redshift_version }}.jar
    dest: /usr/share/java/{{ item }}
    state: link
  loop:
    - redshift-jdbc42.jar
    - redshift-jdbc.jar
  # A dry run does not download a new version for the links to point at.
  when: not (ansible_check_mode and __database_client_redshift_download is changed)
  tags:
    - database-client
    - config
    - redshift
    - database-client_redshift
    - database-client_redshift_init
