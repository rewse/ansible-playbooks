---
# Meta Muse signs in with this key over SSH. The account has no sudo and no
# supplementary groups, so this key reaches only what the muse user can read.
muse_ssh_public_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIO1bAJl1D6WKx0PBV47KkLSGS1ClX9JE4Qn3OXDKYT2H hatch

# Muse may connect to these ports on the host it runs on: TCP fallback of the
# local DNS resolver, and Apache, which serves the *.rewse.jp sites Muse uses.
muse_firewall_local_tcp_ports:
  - 53
  - 443
# MQTT and MQTT over TLS, refused on every host.
muse_firewall_mqtt_ports:
  - 1883
  - 8883
muse_firewall_zabbix_ports:
  - 10050
  - 10051

# The same on every host so files copied between hosts keep their owner. 2000
# is the admin user, and uid 2001 and gid 2001-2002 are taken on fox.
muse_gid: 2003
muse_uid: 2002

# Read-only PostgreSQL roles named muse. libpq reads the file named by
# PGPASSFILE, which the pgpass component points at the XDG config directory.
muse_pgpass_entries:
  - host: rewse-pg.rewse.jp
    password: "{{ lookup('pipe', 'op read \"op://ansible/wi3josvnu5dujxoosdh74igisq/password\"') }}"
    port: 5432
    username: "{{ lookup('pipe', 'op read \"op://ansible/wi3josvnu5dujxoosdh74igisq/username\"') }}"
muse_pgpass_file: /home/muse/.config/pg/pgpass
