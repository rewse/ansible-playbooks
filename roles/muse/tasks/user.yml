---
- name: user | Create group
  ansible.builtin.group:
    name: muse
    gid: "{{ muse_gid }}"

- name: user | Create user
  ansible.builtin.user:
    name: muse
    uid: "{{ muse_uid }}"
    group: muse
    shell: /bin/bash
    # Muse signs in with its key, and admins switch with sudo, so no password
    # is needed. sshd still accepts the key for a locked account with UsePAM.
    password_lock: true
    skeleton: /etc/skel

- name: user | Install authorized key
  ansible.posix.authorized_key:
    user: muse
    key: "{{ muse_ssh_public_key }}"
    exclusive: true
