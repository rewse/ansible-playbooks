---
- name: container | Resolve aged image
  ansible.builtin.set_fact:
    # Release tags only. The image is also published as latest and sha-<commit>,
    # which move with every push to the default branch.
    __mailboxd_image: >-
      {{ lookup('aged_release', 'oci:psyb0t/mailbox',
                pattern='^v\d+\.\d+\.\d+$',
                platform='linux/' ~ ('arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64')) }}

- name: container | Create compose directory
  ansible.builtin.file:
    path: /etc/compose/mailboxd
    state: directory
    mode: "0755"

- name: container | Create data directory
  # Created here rather than left to Docker, which would make a missing bind
  # source owned by root and leave the container user unable to write its state.
  ansible.builtin.file:
    path: "{{ mailboxd_data_dir }}"
    state: directory
    owner: "{{ mailboxd_uid }}"
    group: "{{ mailboxd_uid }}"
    mode: "0750"

- name: container | Deploy compose file
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: /etc/compose/mailboxd/compose.yaml
    mode: "0644"
  register: __mailboxd_compose
  notify: Recreate mailboxd

- name: container | Report skipped start in check mode
  ansible.builtin.debug:
    msg: Start skipped because the compose file is not written in check mode
    verbosity: 0
  when: ansible_check_mode and __mailboxd_compose is changed

- name: container | Start container
  community.docker.docker_compose_v2:
    project_src: /etc/compose/mailboxd
    state: present
    pull: missing
    # The health check reads /health, so waiting for healthy confirms that the
    # configuration loaded and the server answers.
    wait: true
    wait_timeout: 120
  when: not (ansible_check_mode and __mailboxd_compose is changed)
