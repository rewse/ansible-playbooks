---
# mailboxd replaces calendar_mcp, which served the same Sakura mailboxes to
# Muse. Delete this file and its import once every host has converged.
- name: legacy | Check calendar-mcp compose file
  ansible.builtin.stat:
    path: /etc/compose/calendar_mcp/compose.yaml
  register: __mailboxd_calendar_mcp_compose

- name: legacy | Stop calendar-mcp
  community.docker.docker_compose_v2:
    project_src: /etc/compose/calendar_mcp
    state: absent
    remove_images: all
  when: __mailboxd_calendar_mcp_compose.stat.exists

- name: legacy | Remove .NET base images
  community.docker.docker_image_remove:
    name: "{{ item }}"
  loop:
    - mcr.microsoft.com/dotnet/aspnet:10.0
    - mcr.microsoft.com/dotnet/sdk:10.0

- name: legacy | Remove calendar-mcp vhost
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apache2/sites-enabled/calendar-mcp.rewse.jp.conf
    - /etc/apache2/sites-available/calendar-mcp.rewse.jp.conf
  notify: Reload Apache

- name: legacy | Remove calendar-mcp fail2ban jail
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/fail2ban/filter.d/calendar_mcp.conf
    - /etc/fail2ban/jail.d/calendar_mcp.conf
  notify: Restart fail2ban

- name: legacy | Remove calendar-mcp files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/compose/calendar_mcp
    - /srv/calendar_mcp
    - /usr/local/src/calendar-mcp

- name: legacy | Remove calendar-mcp user
  ansible.builtin.user:
    name: calendar-mcp
    state: absent

- name: legacy | Remove calendar-mcp group
  ansible.builtin.group:
    name: calendar-mcp
    state: absent
