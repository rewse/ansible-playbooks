---
- name: apache | Enable proxy modules
  community.general.apache2_module:
    name: "{{ item }}"
  loop:
    - proxy
    - proxy_http
  notify: Restart Apache

- name: apache | Copy vhost config
  ansible.builtin.copy:
    src: lmstudio.rewse.jp.conf
    dest: /etc/apache2/sites-available
    mode: "0644"
  notify: Reload Apache

- name: apache | Enable site
  # No module enables an Apache site; a2ensite reports whether it changed.
  ansible.builtin.command: a2ensite lmstudio.rewse.jp
  register: __lmstudio_a2ensite
  changed_when: "'already enabled' not in __lmstudio_a2ensite.stdout"
  notify: Reload Apache
