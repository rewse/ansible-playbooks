---
- name: apache | Enable proxy modules
  community.general.apache2_module:
    name: "{{ item }}"
  loop:
    - proxy
    - proxy_http
    - proxy_wstunnel
  notify: Restart Apache

- name: apache | Deploy vhost config
  ansible.builtin.template:
    src: matter.rewse.jp.conf.j2
    dest: /etc/apache2/sites-available/{{ matterjs_server_hostname }}.conf
    mode: "0644"
  notify: Reload Apache

- name: apache | Enable site
  # No module manages Apache site symlinks the way a2ensite does.
  ansible.builtin.command: a2ensite {{ matterjs_server_hostname }}
  register: __matterjs_server_a2ensite
  changed_when: "'already enabled' not in __matterjs_server_a2ensite.stdout"
  notify: Reload Apache
