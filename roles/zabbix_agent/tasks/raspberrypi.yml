---
- name: raspberrypi | Copy Raspberry Pi config
  ansible.builtin.copy:
    src: raspberrypi.conf
    dest: /etc/zabbix/zabbix_agentd.d
    mode: "0644"
  notify: Restart zabbix-agent

- name: raspberrypi | Copy Bluetooth devices config
  ansible.builtin.copy:
    src: bluetooth-devices.conf
    dest: /etc/zabbix/zabbix_agentd.d
    mode: "0644"
  notify: Restart zabbix-agent

- name: raspberrypi | Enable AllowRoot
  # The Raspberry Pi items read hardware that only root can open.
  ansible.builtin.lineinfile:
    path: /etc/zabbix/zabbix_agentd.conf
    insertafter: "^# AllowRoot="
    regexp: "^AllowRoot="
    line: AllowRoot=1
  notify: Restart zabbix-agent

- name: raspberrypi | Create unit drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/zabbix-agent.service.d
    state: directory
    mode: "0755"

- name: raspberrypi | Run the agent as root
  ansible.builtin.template:
    src: root.conf.j2
    dest: /etc/systemd/system/zabbix-agent.service.d/root.conf
    mode: "0644"
  notify:
    - Reload systemd
    - Restart zabbix-agent

- name: raspberrypi | Remove copied unit file
  # A full copy hid package updates to the unit; the drop-in replaces it.
  ansible.builtin.file:
    path: /etc/systemd/system/zabbix-agent.service
    state: absent
  notify:
    - Reload systemd
    - Restart zabbix-agent
