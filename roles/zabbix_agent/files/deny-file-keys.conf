# The agent runs as root on Raspberry Pi, so these keys would return the
# contents or listing of any file to whoever can query the agent. No item reads
# files this way; the metadata keys the OS templates use (vfs.file.cksum,
# vfs.file.exists, vfs.file.size, vfs.file.time) stay allowed.
DenyKey=vfs.dir.get[*]
DenyKey=vfs.file.contents[*]
DenyKey=vfs.file.get[*]
DenyKey=vfs.file.regexp[*]
DenyKey=vfs.file.regmatch[*]
