# These keys return the contents, matching lines, or listing of any file the
# agent's account can open (every file on Raspberry Pi, where the agent runs as
# root, and the adm-readable logs elsewhere) to whoever can query the agent or
# pose as its active-check server. The log items the templates use are allowed
# by their exact keys. The agent applies the first rule a key matches, so the
# AllowKey lines come before the DenyKey lines. The metadata keys the OS
# templates use (vfs.file.cksum, vfs.file.exists, vfs.file.size, vfs.file.time)
# stay allowed.
AllowKey=log.count[/var/log/syslog,"nvme.*(controller is down|Unable to change power state)",UTF-8,,skip]
AllowKey=log[/var/log/remote.log,,UTF-8]
AllowKey=log[/var/log/syslog,,UTF-8]
DenyKey=log.count[*]
DenyKey=log[*]
DenyKey=logrt.count[*]
DenyKey=logrt[*]
DenyKey=vfs.dir.get[*]
DenyKey=vfs.file.contents[*]
DenyKey=vfs.file.get[*]
DenyKey=vfs.file.regexp[*]
DenyKey=vfs.file.regmatch[*]
