UserParameter=heat,echo "scale=3; $(cat /sys/class/thermal/thermal_zone0/temp) / 1000" | bc
# The age of the marker a restic unit writes on success, the parameter being the
# unit instance: restic-local-backup-fox, restic-s3-check-archive and so on. A
# missing marker reads as an age since the epoch, which is above every threshold
# on purpose, a unit that has never succeeded being a state to report rather than
# to hide.
UserParameter=restic.success_age[*],echo $(($(date +%s) - $(stat -c %Y /var/lib/$1.success 2>/dev/null || echo 0)))
# The NVMe SMART log as JSON, split into fields by dependent items on the
# server. The agent runs as root, so nvme-cli opens the device without sudo.
# stderr is discarded so an unreadable device, such as one that dropped off the
# PCIe link, yields no output and the item turns unsupported.
UserParameter=nvme.smart_log,nvme smart-log /dev/nvme0 -o json 2>/dev/null
