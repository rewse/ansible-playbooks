UserParameter=bluetooth.devices,bluetoothctl devices | grep '^Device ' | wc -l
# The Zabbix script "Restart bluetooth" runs this command on the agent, as
# system.run[<command>] when run by hand and system.run[<command>,nowait] from
# an action. The agent runs as root on Raspberry Pi, so no other system.run
# command may run.
AllowKey=system.run[sudo systemctl daemon-reload; sudo systemctl restart bluetooth]
AllowKey=system.run[sudo systemctl daemon-reload; sudo systemctl restart bluetooth,*]
DenyKey=system.run[*]
