UserParameter=bluetooth.devices,bluetoothctl devices | grep '^Device ' | wc -l
# The Zabbix script "Restart bluetooth" runs this command on the agent; the
# trailing * admits the ",nowait" parameter that remote commands add. The agent
# runs as root on Raspberry Pi, so no other system.run command may run.
AllowKey=system.run[sudo systemctl daemon-reload; sudo systemctl restart bluetooth*]
DenyKey=system.run[*]
