# Redefine the formats fail2ban reads to stamp each entry with the time the
# response finished rather than the time the request arrived.
#
# Apache writes an entry only when the response ends, so %t on a long poll or a
# WebSocket dates the line minutes or hours in the past. fail2ban then warns of a
# latency problem and treats the entry as if it just happened. The end time keeps
# the timestamps in the order the lines are written.
#
# The formats otherwise match the ones apache2.conf defines. A CustomLog looks up
# its nickname only after the whole configuration is read, so these win wherever
# they are included.
#
# Each format logs %a, the client address mod_remoteip restores from
# X-Forwarded-For behind CloudFront, so fail2ban bans the client. %h stays the
# connection address, which behind CloudFront is the edge server.
#
# Each format then logs %I, the bytes received including headers and body, so
# oversized request bodies can be found in the logs after the fact.
#
# Each format ends with %U, the URL path Apache routes and proxies by: decoded,
# with repeated slashes merged, and without the query string. %r keeps the
# request line as the client sent it, so a filter that must recognise one path
# however it is spelled anchors on this last field instead; Apache escapes the
# quotes in every field, so no other field can imitate it at the end of the
# line. Both go last because the other fail2ban filters match from the start of
# the line and leave the tail unanchored.
LogFormat "%v:%p %a %l %u %{end:[%d/%b/%Y:%H:%M:%S %z]}t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\" %I \"%U\"" vhost_combined
LogFormat "%a %l %u %{end:[%d/%b/%Y:%H:%M:%S %z]}t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" %I \"%U\"" combined
