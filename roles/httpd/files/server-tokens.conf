# Identify the server as "Apache" alone, without its version, OS, or modules,
# in the Server header and in no footer on generated pages.
#
# Ubuntu's security.conf sets ServerTokens OS and ServerSignature On. Apache
# applies the last value it reads and includes conf-enabled/*.conf in sorted
# order, so this file must keep a name that sorts after security.conf.
ServerTokens Prod
ServerSignature Off
