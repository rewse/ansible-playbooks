# Refuse with 400 a request whose decoded path holds a control character.
#
# Apache routes, proxies and logs (%U) the path after decoding its percent
# escapes, so %0a in the request line reaches a backend as a newline. Some
# backends route a path with a trailing newline to the same endpoint as the
# path without it, because a Python regular expression's $ also matches before
# a final newline, so the logged path would no longer name the endpoint that
# answered. No site here serves a path with a control character, so none is
# passed on. Apache itself already refuses %00.
#
# Apache merges If sections into every virtual host and location, proxied
# requests included. Redirect with a status outside 3xx and no URL answers with
# that status; mod_alias applies it in the fixups phase, before mod_proxy
# forwards the request. The condition tests REQUEST_URI, the decoded path
# without the query string.
<If "%{REQUEST_URI} =~ /[\x00-\x1f\x7f]/">
    Redirect 400
</If>
