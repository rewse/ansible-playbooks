---
- name: security_agent | Copy fail2ban ignore script
  ansible.builtin.copy:
    src: fail2ban-ignore-security-agent
    dest: /usr/local/sbin/fail2ban-ignore-security-agent
    mode: "0755"

- name: security_agent | Copy pentest header config
  ansible.builtin.template:
    src: security-agent-pentest.conf.j2
    dest: /etc/apache2/conf-available/security-agent-pentest.conf
    mode: "0640"
  # The file holds the header secret, which --diff would print.
  diff: false
  notify: Reload Apache

- name: security_agent | Enable pentest header config
  # No module enables an Apache site or conf; the command reports whether it changed.
  ansible.builtin.command: a2enconf security-agent-pentest
  register: __httpd_a2enconf_security_agent
  changed_when: "'already enabled' not in __httpd_a2enconf_security_agent.stdout"
  notify: Reload Apache

- name: security_agent | Deploy fail2ban default
  ansible.builtin.template:
    src: fail2ban-security-agent.conf.j2
    dest: /etc/fail2ban/jail.d/00-security-agent.conf
    mode: "0644"
  notify: Restart fail2ban
