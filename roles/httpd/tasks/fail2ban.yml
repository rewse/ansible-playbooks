---
- name: fail2ban | Create ban directory
  ansible.builtin.file:
    path: "{{ httpd_fail2ban_state_dir }}"
    state: directory
    mode: "0755"

- name: fail2ban | Copy ban script
  ansible.builtin.copy:
    src: fail2ban-apache-deny
    dest: /usr/local/sbin/fail2ban-apache-deny
    mode: "0755"

- name: fail2ban | Deploy ban action
  ansible.builtin.template:
    src: fail2ban-action-apache-deny.conf.j2
    dest: /etc/fail2ban/action.d/apache-deny.conf
    mode: "0644"
  notify: Restart fail2ban

- name: fail2ban | Copy Apache ban config
  ansible.builtin.template:
    src: fail2ban-apache-deny.conf.j2
    dest: /etc/apache2/conf-available/fail2ban-apache-deny.conf
    mode: "0644"
  notify: Reload Apache

- name: fail2ban | Enable Apache ban config
  # No module enables an Apache site or conf; the command reports whether it changed.
  ansible.builtin.command: a2enconf fail2ban-apache-deny
  register: __httpd_a2enconf_fail2ban
  changed_when: "'already enabled' not in __httpd_a2enconf_fail2ban.stdout"
  notify: Reload Apache
