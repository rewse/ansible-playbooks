---
- name: remoteip_drift | Create agentscripts directory
  ansible.builtin.file:
    path: /usr/lib/zabbix/agentscripts
    state: directory
    mode: "0755"

- name: remoteip_drift | Copy drift check script
  ansible.builtin.copy:
    src: remoteip-drift
    dest: /usr/lib/zabbix/agentscripts/remoteip-drift
    mode: "0755"

- name: remoteip_drift | Copy agent config
  ansible.builtin.template:
    src: remoteip-drift.conf.j2
    dest: /etc/zabbix/zabbix_agentd.d/remoteip-drift.conf
    mode: "0644"
  notify: Restart zabbix-agent
