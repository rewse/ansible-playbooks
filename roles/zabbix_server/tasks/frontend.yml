---
- name: frontend | Enable Apache config
  # No module enables an Apache conf; a2enconf reports whether it changed.
  ansible.builtin.command: a2enconf zabbix
  register: __zabbix_server_a2enconf
  changed_when: "'already enabled' not in __zabbix_server_a2enconf.stdout"
  notify: Reload Apache

- name: frontend | Copy API access config
  ansible.builtin.template:
    src: zabbix-api.conf.j2
    dest: /etc/apache2/conf-available/zabbix-api.conf
    mode: "0644"
  notify: Reload Apache

- name: frontend | Enable API access config
  # No module enables an Apache conf; a2enconf reports whether it changed.
  ansible.builtin.command: a2enconf zabbix-api
  register: __zabbix_server_a2enconf_api
  changed_when: "'already enabled' not in __zabbix_server_a2enconf_api.stdout"
  notify: Reload Apache

- name: frontend | Copy PHP config
  ansible.builtin.template:
    src: zabbix.conf.php.j2
    dest: /etc/zabbix/web/zabbix.conf.php
    owner: www-data
    group: www-data
    mode: "0600"

- name: frontend | Set Japanese font for graphs
  ansible.builtin.file:
    src: /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
    dest: /etc/alternatives/zabbix-frontend-font
    state: link
