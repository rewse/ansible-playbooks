---
- name: service | Copy script
  ansible.builtin.template:
    src: network-failover.j2
    dest: /usr/local/sbin/network-failover
    mode: "0755"

- name: service | Hook the dispatcher
  ansible.builtin.file:
    src: /usr/local/sbin/network-failover
    dest: "/etc/networkd-dispatcher/{{ item }}/network-failover"
    state: link
  loop:
    - no-carrier.d
    - routable.d

- name: service | Copy service
  ansible.builtin.copy:
    src: network-failover.service
    dest: /etc/systemd/system
    mode: "0644"
  notify: Reload systemd

- name: service | Copy timer
  ansible.builtin.copy:
    src: network-failover.timer
    dest: /etc/systemd/system
    mode: "0644"
  notify: Restart network-failover timer

- name: service | Enable and start timer
  ansible.builtin.systemd:
    name: network-failover.timer
    state: started
    enabled: true
    daemon_reload: true
