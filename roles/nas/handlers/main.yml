---
- name: "nas : Reload exports"
  ansible.builtin.command: exportfs -ra
  changed_when: true

- name: "nas : Reload systemd"
  ansible.builtin.systemd:
    daemon_reload: true

- name: "nas : Restart zabbix-agent"
  ansible.builtin.systemd:
    name: zabbix-agent
    state: restarted

- name: "nas : Restart smbd"
  ansible.builtin.systemd:
    name: smbd
    state: restarted
