# Whether a volume is mounted. vfs.fs.size cannot answer this: the mount point is
# a directory on the root filesystem, so an unmounted volume reports the root
# filesystem's numbers and reads as healthy.
UserParameter=nas.mounted[*],mountpoint -q "$1" && echo 1 || echo 0

# SMART through the enclosure needs -d sat, the USB bridge hiding it otherwise. The
# parameter is a by-id path rather than sda: the bridge reports one serial number
# for all three bays, so the model in that path is what tells them apart, and it
# follows a disk across a re-enumeration where a kernel name does not.
#
# A disk that cannot be queried at all returns nothing, which Zabbix reads as
# unsupported. Returning 0 there would be indistinguishable from a disk that
# answered and failed, and the enclosure is detachable, so the unreachable case is
# routine rather than exceptional.
UserParameter=nas.smart.health[*],if smartctl -d sat -H "$1" 2>/dev/null | grep -q "test result: PASSED"; then echo 1; elif smartctl -d sat -i "$1" >/dev/null 2>&1; then echo 0; fi

# A raw SMART attribute by name, the row being stripped of its leading spaces so
# the raw value is always the tenth field. UDMA_CRC_Error_Count has to be read as
# an increment rather than an absolute: Bay 1 carries 183 of them from the Synology
# backplane it came off, and a count like that never falls.
UserParameter=nas.smart.attr[*],smartctl -d sat -A "$1" | sed 's/^ *//' | grep "^[0-9]* $2 " | tr -s ' ' | cut -d ' ' -f 10

# Seconds since a Mac last completed a Time Machine backup, the parameter being the
# share's Mac name. Nothing else here reports this: Samba serves the share whether
# or not a Mac is using it, and a destination that has stopped mounting is silent
# on this side.
#
# SnapshotHistory.plist is the marker because it is written when a backup finishes.
# The band files and Info.plist are not: macOS leaves the disk image mounted and
# keeps touching them, so they look fresh while backups fail. Results.plist is
# written for a failure too.
#
# A share never backed up has no marker, and the age then counts from the epoch
# rather than reading as healthy.
#
# The mount check comes first because that epoch age is only meaningful once the
# volume is there to look at. An unmounted volume makes every share look decades
# overdue at once, so nothing is returned and Zabbix reads the item as unsupported.
UserParameter=nas.timemachine.success_age[*],mountpoint -q /srv/nas/backup && echo $(($(date +%s) - $(stat -c %Y "/srv/nas/backup/timemachine/$1/$1.sparsebundle/com.apple.TimeMachine.SnapshotHistory.plist" 2>/dev/null || echo 0)))
