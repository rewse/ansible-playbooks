---
- name: "nas : Create key directory"
  ansible.builtin.file:
    path: "{{ nas_keyfile | dirname }}"
    state: directory
    owner: root
    group: root
    mode: '0700'
  tags:
    - nas
    - config
    - luks
    - nas_luks
    - nas_luks_config

- name: "nas : Deploy LUKS key file"
  # The key lives on the NVMe so the volumes open without a passphrase after a
  # power cut. This trades away protection against theft of the whole host,
  # which the Synology it replaces did not offer either; the point of LUKS here
  # is that discarding the key wipes a disk that cannot be securely erased.
  ansible.builtin.copy:
    content: "{{ nas_keyfile_content }}"
    dest: "{{ nas_keyfile }}"
    owner: root
    group: root
    mode: '0400'
  no_log: true
  tags:
    - nas
    - config
    - luks
    - nas_luks
    - nas_luks_config

- name: "nas : Create mount points"
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop: "{{ nas_volumes }}"
  loop_control:
    label: "{{ item.path }}"
  tags:
    - nas
    - config
    - storage
    - nas_storage
    - nas_storage_config

- name: "nas : Configure crypttab"
  community.general.crypttab:
    name: "{{ item.name }}"
    backing_device: "UUID={{ item.luks_uuid }}"
    password: "{{ nas_keyfile }}"
    # nofail keeps a boot going when the enclosure is off or unplugged. argon2id
    # asks for 386 MB per volume, so opening all three peaks around 1.2 GB.
    #
    # discard lets the weekly fstrim reach the SSDs through dm-crypt, which
    # otherwise blocks it and leaves the drive unable to reclaim free blocks.
    # Bay 1 ran out of SLC cache during the migration for want of it. The cost is
    # that the pattern of used blocks stops being hidden, which does not weaken
    # the goal here: making a disk unreadable when its key is discarded.
    opts: "luks,nofail{{ ',discard' if item.discard | default(false) else '' }}"
    state: present
  loop: "{{ nas_volumes }}"
  loop_control:
    label: "{{ item.name }}"
  tags:
    - nas
    - config
    - storage
    - nas_storage
    - nas_storage_config

- name: "nas : Configure fstab"
  # state=present writes the entry without mounting: these volumes are already
  # mounted, and a converge run must never remount one while restic, Samba or
  # Frigate hold files open on it. Mounting is left to boot.
  #
  # nofail alone still stalls a boot for the 90 second default device timeout when
  # the enclosure is absent, so the timeout is shortened. It has to outlast the
  # LUKS open: the mapper device the mount waits for does not exist until then,
  # and argon2id spends several seconds per volume deriving the key.
  ansible.posix.mount:
    src: "/dev/mapper/{{ item.name }}"
    path: "{{ item.path }}"
    fstype: ext4
    opts: "defaults,nofail,x-systemd.device-timeout={{ nas_device_timeout }}"
    state: present
  loop: "{{ nas_volumes }}"
  loop_control:
    label: "{{ item.path }}"
  tags:
    - nas
    - config
    - storage
    - nas_storage
    - nas_storage_config

- name: "nas : Install NFS server"
  ansible.builtin.apt:
    name: nfs-kernel-server
    state: present
  tags:
    - nas
    - install
    - nfs
    - nas_nfs
    - nas_nfs_install

- name: "nas : Install Samba"
  ansible.builtin.apt:
    name: samba
    state: present
  tags:
    - nas
    - install
    - samba
    - nas_samba
    - nas_samba_install

- name: "nas : Create export directories"
  ansible.builtin.file:
    path: "{{ nas_backup_path }}/{{ item.name }}"
    state: directory
    owner: root
    group: root
    mode: '0700'
  loop: "{{ nas_nfs_clients }}"
  loop_control:
    label: "{{ item.name }}"
  tags:
    - nas
    - config
    - nfs
    - nas_nfs
    - nas_nfs_config

- name: "nas : Configure exports"
  ansible.builtin.template:
    src: exports.j2
    dest: /etc/exports
    mode: '0644'
  notify: "nas : Reload exports"
  tags:
    - nas
    - config
    - nfs
    - nas_nfs
    - nas_nfs_config

- name: "nas : Enable and start NFS server"
  ansible.builtin.systemd:
    name: nfs-server
    enabled: true
    state: started
  tags:
    - nas
    - config
    - nfs
    - nas_nfs
    - nas_nfs_config

- name: "nas : Create service users"
  ansible.builtin.user:
    name: "{{ item.name }}"
    uid: "{{ item.uid }}"
    shell: /usr/sbin/nologin
    password: '!'
    create_home: false
  loop: "{{ nas_service_users }}"
  loop_control:
    label: "{{ item.name }}"
  tags:
    - nas
    - config
    - samba
    - nas_samba
    - nas_samba_config

- name: "nas : Create home directories"
  ansible.builtin.file:
    path: "{{ nas_data_path }}/homes/{{ item }}"
    state: directory
    owner: "{{ item }}"
    group: "{{ item }}"
    mode: '0700'
  loop: "{{ nas_samba_users }}"
  tags:
    - nas
    - config
    - samba
    - nas_samba
    - nas_samba_config

- name: "nas : Create Time Machine parent directory"
  # Created explicitly so it does not inherit the owner of whichever share came
  # first in the loop below. Both users have to traverse it to reach their own
  # directory, so it stays root owned and traversable.
  ansible.builtin.file:
    path: "{{ nas_backup_path }}/timemachine"
    state: directory
    owner: root
    group: root
    mode: '0755'
  tags:
    - nas
    - config
    - samba
    - nas_samba
    - nas_samba_config

- name: "nas : Create Time Machine directories"
  ansible.builtin.file:
    path: "{{ nas_backup_path }}/timemachine/{{ item.name | replace('timemachine-', '') }}"
    state: directory
    owner: "{{ item.user }}"
    group: "{{ item.user }}"
    mode: '0700'
  loop: "{{ nas_timemachine_shares }}"
  loop_control:
    label: "{{ item.name }}"
  tags:
    - nas
    - config
    - samba
    - nas_samba
    - nas_samba_config

- name: "nas : Configure Samba"
  ansible.builtin.template:
    src: smb.conf.j2
    dest: /etc/samba/smb.conf
    mode: '0644'
    validate: testparm -s %s
  notify: "nas : Restart smbd"
  tags:
    - nas
    - config
    - samba
    - nas_samba
    - nas_samba_config

- name: "nas : Read Samba database"
  ansible.builtin.command: pdbedit --list
  register: nas_pdbedit
  changed_when: false
  tags:
    - nas
    - config
    - samba
    - nas_samba
    - nas_samba_config

- name: "nas : Create Samba users"
  ansible.builtin.command:
    cmd: "smbpasswd -a -s {{ item }}"
    # Passed on stdin rather than the command line so it stays out of the
    # process list.
    stdin: "{{ nas_samba_password }}\n{{ nas_samba_password }}\n"
  vars:
    nas_samba_password: "{{ lookup('pipe', 'op read \"op://ansible/Samba - ' ~ item ~ '/password\"') }}"
  loop: "{{ nas_samba_users }}"
  when: item not in nas_pdbedit.stdout
  no_log: true
  tags:
    - nas
    - config
    - samba
    - nas_samba
    - nas_samba_config

- name: "nas : Enable and start Samba"
  ansible.builtin.systemd:
    name: smbd
    enabled: true
    state: started
  tags:
    - nas
    - config
    - samba
    - nas_samba
    - nas_samba_config

- name: "nas : Copy S3 backup script"
  ansible.builtin.template:
    src: nas-backup-s3.j2
    dest: /usr/local/sbin/nas-backup-s3
    mode: '0755'
  tags:
    - nas
    - config
    - s3
    - nas_s3
    - nas_s3_config

- name: "nas : Copy S3 backup service"
  ansible.builtin.template:
    src: nas-backup-s3@.service.j2
    dest: /etc/systemd/system/nas-backup-s3@.service
    mode: '0644'
  tags:
    - nas
    - config
    - s3
    - nas_s3
    - nas_s3_config

- name: "nas : Copy S3 backup timer"
  ansible.builtin.template:
    src: nas-backup-s3@.timer.j2
    dest: /etc/systemd/system/nas-backup-s3@.timer
    mode: '0644'
  tags:
    - nas
    - config
    - s3
    - nas_s3
    - nas_s3_config

- name: "nas : Create S3 backup schedule overrides"
  # A drop-in rather than a unit file per instance: enabling a template instance
  # links to the template, and a concrete file of the same name would leave that
  # link pointing at the wrong place.
  ansible.builtin.file:
    path: "/etc/systemd/system/nas-backup-s3@{{ item.name }}.timer.d"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop: "{{ nas_s3_repositories }}"
  loop_control:
    label: "{{ item.name }}"
  tags:
    - nas
    - config
    - s3
    - nas_s3
    - nas_s3_config

- name: "nas : Configure S3 backup schedules"
  ansible.builtin.template:
    src: nas-backup-s3-schedule.conf.j2
    dest: "/etc/systemd/system/nas-backup-s3@{{ item.name }}.timer.d/schedule.conf"
    mode: '0644'
  loop: "{{ nas_s3_repositories }}"
  loop_control:
    label: "{{ item.name }}"
  tags:
    - nas
    - config
    - s3
    - nas_s3
    - nas_s3_config

- name: "nas : Copy S3 check service"
  ansible.builtin.template:
    src: nas-check-s3@.service.j2
    dest: /etc/systemd/system/nas-check-s3@.service
    mode: '0644'
  tags:
    - nas
    - config
    - s3
    - nas_s3
    - nas_s3_config

- name: "nas : Copy S3 check timer"
  ansible.builtin.template:
    src: nas-check-s3@.timer.j2
    dest: /etc/systemd/system/nas-check-s3@.timer
    mode: '0644'
  tags:
    - nas
    - config
    - s3
    - nas_s3
    - nas_s3_config

- name: "nas : Enable and start S3 timers"
  ansible.builtin.systemd:
    name: "{{ item.0 }}@{{ item.1.name }}.timer"
    enabled: true
    state: started
    daemon_reload: true
  loop: "{{ ['nas-backup-s3', 'nas-check-s3'] | product(nas_s3_repositories) | list }}"
  loop_control:
    label: "{{ item.0 }}@{{ item.1.name }}"
  tags:
    - nas
    - config
    - s3
    - nas_s3
    - nas_s3_config
