---
- name: storage | Create key directory
  ansible.builtin.file:
    path: "{{ nas_keyfile | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: storage | Deploy LUKS key file
  # The key lives on the NVMe so the volumes open without a passphrase after a
  # power cut. This trades away protection against theft of the whole host,
  # which the Synology it replaces did not offer either; the point of LUKS here
  # is that discarding the key wipes a disk that cannot be securely erased.
  ansible.builtin.copy:
    content: "{{ nas_keyfile_content }}"
    dest: "{{ nas_keyfile }}"
    owner: root
    group: root
    mode: "0400"
  no_log: true

- name: storage | Create mount points
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop: "{{ nas_volumes }}"
  loop_control:
    label: "{{ item.path }}"

- name: storage | Configure crypttab
  community.general.crypttab:
    name: "{{ item.name }}"
    backing_device: "UUID={{ item.luks_uuid }}"
    password: "{{ nas_keyfile }}"
    # nofail keeps a boot going when the enclosure is off or unplugged. argon2id
    # asks for 386 MB per volume, so opening all three peaks around 1.2 GB.
    #
    # discard lets the weekly fstrim reach the SSDs through dm-crypt, which
    # otherwise blocks it and leaves the drive unable to reclaim free blocks.
    # Bay 1 ran out of SLC cache during the migration for want of it. The cost is
    # that the pattern of used blocks stops being hidden, which does not weaken
    # the goal here: making a disk unreadable when its key is discarded.
    opts: "luks,nofail{{ ',discard' if item.discard | default(false) else '' }}"
    state: present
  loop: "{{ nas_volumes }}"
  loop_control:
    label: "{{ item.name }}"

- name: storage | Configure fstab
  # state=present writes the entry without mounting: these volumes are already
  # mounted, and a converge run must never remount one while restic, Samba or
  # Frigate hold files open on it. Mounting is left to boot.
  #
  # nofail alone still stalls a boot for the 90 second default device timeout when
  # the enclosure is absent, so the timeout is shortened. It has to outlast the
  # LUKS open: the mapper device the mount waits for does not exist until then,
  # and argon2id spends several seconds per volume deriving the key.
  ansible.posix.mount:
    src: "/dev/mapper/{{ item.name }}"
    path: "{{ item.path }}"
    fstype: ext4
    opts: "defaults,nofail,x-systemd.device-timeout={{ nas_device_timeout }}"
    state: present
  loop: "{{ nas_volumes }}"
  loop_control:
    label: "{{ item.path }}"

- name: storage | Unlock and mount on hot-plug via udev
  ansible.builtin.template:
    src: 99-nas-hotplug.rules.j2
    dest: /etc/udev/rules.d/99-nas-hotplug.rules
    mode: "0644"
  notify: Reload udev rules

- name: storage | Copy the enclosure attach script
  ansible.builtin.template:
    src: nas-attach.j2
    dest: /usr/local/sbin/nas-attach
    mode: "0755"

- name: storage | Copy the enclosure detach script
  ansible.builtin.template:
    src: nas-detach.j2
    dest: /usr/local/sbin/nas-detach
    mode: "0755"
    # The script writes Docker format strings, which share Jinja's delimiters.
    variable_start_string: "[%"
    variable_end_string: "%]"

- name: storage | Copy the attach unit
  ansible.builtin.template:
    src: nas-attach.service.j2
    dest: /etc/systemd/system/nas-attach.service
    mode: "0644"
  notify: "nas : Reload systemd"

- name: storage | Enable the attach unit
  # Enabling is what links it under each mount unit's wants directory, the
  # WantedBy in the unit naming the mounts rather than a target.
  ansible.builtin.systemd:
    name: nas-attach.service
    enabled: true
    daemon_reload: true

- name: storage | Create Docker override directory
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: storage | Order Docker after the volumes
  ansible.builtin.template:
    src: docker-nas-mounts.conf.j2
    dest: /etc/systemd/system/docker.service.d/nas-mounts.conf
    mode: "0644"
  notify: "nas : Reload systemd"
