---
# The three bays of the ORICO 9948C3, each LUKS2 over the whole device with ext4
# inside. UUIDs come from nas-luks-init.sh, which prints both after formatting.
#
# Bay 1 holds the live data (homes and Frigate recordings), Bay 2 the backups
# (restic and Time Machine), Bay 3 the archive.
nas_keyfile: /etc/luks/nas.key
nas_keyfile_content: "{{ lookup('pipe', 'op read \"op://ansible/LUKS - nas/password\"') }}"

nas_archive_path: /srv/nas/archive
nas_backup_path: /srv/nas/backup
nas_data_path: /srv/nas/data

# Offsite copies. Two repositories rather than one because the local side keeps
# only homes: sharing a repository would make a prune driven by the archive
# affect it. There is next to no overlap between the two, so nothing is lost by
# not sharing deduplication.
#
# The archive is the reason step 23 waits: its staging copy on Bay 1 cannot go
# until a complete snapshot exists here.
# 128 MiB is restic's ceiling. Larger packs are what the tuning guide calls for
# on a fast uplink: fewer objects to pay per-request for, and better throughput.
# The cost is temporary space of this times the connection count plus one.
nas_restic_pack_size: 128

nas_s3_bucket: rewse-nas-bak
nas_s3_region: ap-northeast-1
nas_s3_repositories:
  - name: archive
    source: "{{ nas_archive_path }}"
  - name: homes
    source: "{{ nas_data_path }}/homes"

# Hosts that keep their restic repository on Bay 2 and reach it over NFS. Each
# is exported its own subdirectory rather than the whole volume, so a client
# cannot read another host's backups or the Time Machine shares.
#
# no_root_squash is required because the client runs restic as root; combined
# with sec=sys it means the export trusts the address, which is why one is
# opened per client instead of a subnet.
nas_nfs_clients:
  - name: hotel
    address: 192.168.0.40

# Samba accounts. The password is only read when the account is missing from the
# Samba database, which keeps the run idempotent; rotating one in 1Password
# therefore does not propagate, so remove it with pdbedit -x first.
nas_samba_users:
  - tats
  - ubiqu

# Unix accounts this role owns. They exist only to own files and to give Samba a
# name to map to, so they carry no shell and no password.
#
# tats is deliberately absent: it already exists and holds sudo and docker
# membership that this role knows nothing about and would strip.
nas_service_users:
  - name: ubiqu
    uid: 2001

# One share per Mac. fruit:time machine max size makes Samba report the limit as
# the volume size, so macOS thins from the start instead of filling the disk;
# vfs_fruit derives free space from the sparsebundle alone, which is why nothing
# else may be stored under these paths.
#
# The limits carry over the quotas the Synology enforced. They oversubscribe the
# volume on purpose: 800 + 350 GB against 1.9 TB shared with the repositories,
# where the current occupancy is 712 and 80 GB.
nas_timemachine_shares:
  - name: timemachine-akimac
    user: ubiqu
    max_size: 350G
  - name: timemachine-youth
    user: tats
    max_size: 800G

nas_volumes:
  # Bay 3. The archive is served to a single user, so the filesystem root itself
  # is closed; Samba enforces the same through valid users.
  #
  # No discard: the ST4000VN000 is a spindle and reports DISC-MAX 0B.
  - name: nas-archive
    path: /srv/nas/archive
    luks_uuid: 1f51b48f-5827-4eb3-9146-1e798e89c85b
    owner: "{{ admin }}"
    group: "{{ admin }}"
    mode: '0700'
  # Bay 2. Stays traversable: Samba serves a Time Machine share per Mac below
  # it as separate users, while the restic repositories keep their own 0700 root.
  - name: nas-backup
    path: "{{ nas_backup_path }}"
    luks_uuid: c340cf31-c585-407d-830f-7e83d3fbeda4
    owner: root
    group: root
    mode: '0755'
    discard: true
  # Bay 1. Traversable so Samba can expand %U under homes.
  - name: nas-data
    path: /srv/nas/data
    luks_uuid: 84e1c6c0-9fb4-4e57-aa1b-6ec010de9f2f
    owner: root
    group: root
    mode: '0755'
    discard: true
