---
- name: Test Power Monitor package metadata
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../vars/main.yml
  tasks:
    - name: "power-monitor-test : Verify package metadata"
      ansible.builtin.assert:
        that:
          - power_monitor_version == '1.3.4'
          - >-
            power_monitor_package_url
            == 'https://github.com/SAP/power-monitoring-tool-for-macos/releases/download/1.3.4/PowerMonitor_1.3.4.pkg'
          - >-
            power_monitor_package_checksum
            == 'sha256:2eb052647d458d4aa5f07e3b663cda0f0df86c736b52058b7884bf2267a025e2'
