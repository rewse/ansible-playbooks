---
- name: "homebrew : Install required packages"
  community.general.homebrew:
    name:
      - jq
      - mosquitto
    state: present
  tags:
    - power-monitor
    - install
    - homebrew
    - power-monitor_homebrew
    - power-monitor_homebrew_install

- name: "power-monitor : Get installed application version"
  ansible.builtin.command:
    argv:
      - /usr/libexec/PlistBuddy
      - -c
      - "Print :CFBundleShortVersionString"
      - "/Applications/Power Monitor.app/Contents/Info.plist"
  check_mode: false
  changed_when: false
  failed_when: false
  register: power_monitor_current_version
  tags:
    - power-monitor
    - install
    - update
    - app
    - power-monitor_app
    - power-monitor_app_install
    - power-monitor_app_update

- name: "power-monitor : Determine whether application update is required"
  ansible.builtin.set_fact:
    power_monitor_install_required: >-
      {{
        power_monitor_current_version.rc != 0 or
        power_monitor_version is version(
          power_monitor_current_version.stdout | trim, '>'
        )
      }}
  tags:
    - power-monitor
    - install
    - update
    - app
    - power-monitor_app
    - power-monitor_app_install
    - power-monitor_app_update

- name: "power-monitor : Download application package"
  ansible.builtin.get_url:
    url: "{{ power_monitor_package_url }}"
    dest: "/tmp/PowerMonitor_{{ power_monitor_version }}.pkg"
    checksum: "{{ power_monitor_package_checksum }}"
    mode: '0644'
  when: power_monitor_install_required
  tags:
    - power-monitor
    - install
    - update
    - app
    - power-monitor_app
    - power-monitor_app_install
    - power-monitor_app_update

- name: "power-monitor : Install application package"
  ansible.builtin.command:
    argv:
      - /usr/sbin/installer
      - -pkg
      - "/tmp/PowerMonitor_{{ power_monitor_version }}.pkg"
      - -target
      - /
  become: true
  changed_when: true
  when:
    - power_monitor_install_required
    - not ansible_check_mode
  tags:
    - power-monitor
    - install
    - update
    - app
    - power-monitor_app
    - power-monitor_app_install
    - power-monitor_app_update

- name: "power-monitor : Report application update deferred in check mode"
  ansible.builtin.debug:
    msg: >-
      Power Monitor {{ power_monitor_version }} installation is deferred in
      check mode because installing the package would modify the system.
  when:
    - power_monitor_install_required
    - ansible_check_mode
  tags:
    - power-monitor
    - install
    - update
    - app
    - power-monitor_app
    - power-monitor_app_install
    - power-monitor_app_update

- name: "power-monitor : Create directories"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ ansible_facts['env']['HOME'] }}/.local/bin"
    - "{{ ansible_facts['env']['HOME'] }}/.config/power-monitor-mqtt"
  tags:
    - power-monitor
    - config
    - power-monitor_power-monitor
    - power-monitor_power-monitor_config

- name: "power-monitor : Download MQTT script from GitHub"
  ansible.builtin.get_url:
    url: "{{ power_monitor_mqtt_script_url }}"
    dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/power-monitor-mqtt"
    mode: '0755'
    force: true
  tags:
    - power-monitor
    - config
    - power-monitor_power-monitor
    - power-monitor_power-monitor_config

- name: "power-monitor : Download configuration file from GitHub"
  ansible.builtin.get_url:
    url: "{{ power_monitor_mqtt_config_url }}"
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/power-monitor-mqtt/config"
    mode: '0600'
    force: true
  tags:
    - power-monitor
    - config
    - power-monitor_power-monitor
    - power-monitor_power-monitor_config

- name: "power-monitor : Configure MQTT host"
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/power-monitor-mqtt/config"
    regexp: '^MQTT_HOST='
    line: 'MQTT_HOST="{{ power_monitor_mosquitto_host }}"'
  tags:
    - power-monitor
    - config
    - power-monitor_power-monitor
    - power-monitor_power-monitor_config

- name: "power-monitor : Configure MQTT password"
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/power-monitor-mqtt/config"
    regexp: '^MQTT_PASSWORD='
    line: 'MQTT_PASSWORD="{{ power_monitor_mosquitto_password }}"'
  tags:
    - power-monitor
    - config
    - power-monitor_power-monitor
    - power-monitor_power-monitor_config

- name: "power-monitor : Test MQTT script"
  ansible.builtin.command:
    cmd: "{{ ansible_facts['env']['HOME'] }}/.local/bin/power-monitor-mqtt --test"
  register: power_monitor_test
  changed_when: false
  failed_when: power_monitor_test.rc != 0
  tags:
    - power-monitor
    - test
    - power-monitor_power-monitor
    - power-monitor_power-monitor_test

- name: "power-monitor : Display test results"
  ansible.builtin.debug:
    var: power_monitor_test.stdout
  tags:
    - power-monitor
    - test
    - power-monitor_power-monitor
    - power-monitor_power-monitor_test
