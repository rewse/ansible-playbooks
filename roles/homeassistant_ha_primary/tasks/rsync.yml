---
# The standby pulls over SSH, so the package stays for that and the daemon goes.
- name: rsync | Install package
  ansible.builtin.apt:
    name: rsync

- name: rsync | Stop and disable daemon
  ansible.builtin.systemd:
    name: rsync
    enabled: false
    state: stopped

- name: rsync | Remove daemon configuration
  ansible.builtin.file:
    path: /etc/rsyncd.conf
    state: absent

- name: rsync | Remove logrotate config
  ansible.builtin.file:
    path: /etc/logrotate.d/rsyncd
    state: absent
