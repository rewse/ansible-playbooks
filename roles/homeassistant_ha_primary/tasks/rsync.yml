---
- name: rsync | Install package
  ansible.builtin.apt:
    name: rsync

- name: rsync | Copy configuration
  ansible.builtin.template:
    src: rsyncd.conf.j2
    dest: /etc/rsyncd.conf
    mode: "0644"
  notify: Restart rsync

- name: rsync | Enable and start service
  ansible.builtin.systemd:
    name: rsync
    enabled: true
    state: started

- name: rsync | Install logrotate config
  ansible.builtin.copy:
    src: rsyncd.logrotate
    dest: /etc/logrotate.d/rsyncd
    mode: "0644"
