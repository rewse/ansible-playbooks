---
- name: Restart teslamate
  community.docker.docker_compose_v2:
    project_src: /etc/compose/teslamate
    services:
      - teslamate
    # A restart keeps the environment the container was created with, so
    # recreate it to apply a changed env_file.
    pull: never
    recreate: always
    state: present
  when: not ansible_check_mode

- name: Restart teslamate-grafana
  community.docker.docker_compose_v2:
    project_src: /etc/compose/teslamate
    services:
      - teslamate-grafana
    # A restart keeps the environment the container was created with, so
    # recreate it to apply a changed env_file.
    pull: never
    recreate: always
    state: present
  when: not ansible_check_mode

- name: Validate Apache configuration
  ansible.builtin.command: apache2ctl configtest
  # A successful validation marks this handler changed so it can notify the
  # reload handler; a failed validation stops before Apache is reloaded.
  changed_when: true
  notify: Reload Apache

- name: Reload Apache
  ansible.builtin.systemd:
    name: apache2
    state: reloaded

- name: Restart fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted
