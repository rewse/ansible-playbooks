# Reads the Apache log for the reason the couchdb filter gives: the container log
# path changes whenever the container is recreated.
#
# Format is vhost_combined, so the virtual host comes first, <HOST> is the second
# field, and the fourth is the user Apache authenticated. The hosts are pinned
# because the file carries every name Apache serves.
#
# TeslaMate sits behind Apache basic auth. A browser's first request carries no
# credentials and gets 401 with the user logged as "-", so only a 401 naming a
# user is a failed sign-in; Apache does not log these at its LogLevel.
#
# Grafana answers an expired session with 401 on its API, so only a failed POST
# to /login counts there.
[Definition]
failregex = ^teslamate\.rewse\.jp:\d+ <HOST> \S+ (?!-\s)\S+ \[\] "\S+ \S+ HTTP/[\d.]+" 401 \d+
            ^grafana\.rewse\.jp:\d+ <HOST> \S+ \S+ \[\] "POST /login HTTP/[\d.]+" 401 \d+
ignoreregex =
