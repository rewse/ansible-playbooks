---
- name: "teslamate : Resolve TeslaMate image"
  ansible.builtin.include_role:
    name: docker/quarantine
    apply:
      tags:
        - teslamate
        - config
        - update
        - docker
        - grafana
        - quarantine
        - teslamate_docker
        - teslamate_docker_config
        - teslamate_docker_update
        - teslamate_grafana
        - teslamate_grafana_config
  vars:
    quarantine_repo: teslamate/teslamate
    quarantine_tag_pattern: '^\d+\.\d+\.\d+$'
  tags:
    - teslamate
    - config
    - update
    - docker
    - grafana
    - quarantine
    - teslamate_docker
    - teslamate_docker_config
    - teslamate_docker_update
    - teslamate_grafana
    - teslamate_grafana_config

- name: "teslamate : Preserve TeslaMate image reference"
  ansible.builtin.set_fact:
    teslamate_image_ref: "{{ docker_quarantine_image_ref }}"
  tags:
    - teslamate
    - config
    - update
    - docker
    - grafana
    - teslamate_docker
    - teslamate_docker_config
    - teslamate_docker_update
    - teslamate_grafana
    - teslamate_grafana_config

- name: "teslamate : Resolve Grafana image"
  ansible.builtin.include_role:
    name: docker/quarantine
    apply:
      tags:
        - teslamate
        - config
        - update
        - docker
        - grafana
        - quarantine
        - teslamate_docker
        - teslamate_docker_config
        - teslamate_docker_update
        - teslamate_grafana
        - teslamate_grafana_config
  vars:
    quarantine_repo: teslamate/grafana
    quarantine_tag_pattern: '^\d+\.\d+\.\d+$'
  tags:
    - teslamate
    - config
    - update
    - docker
    - grafana
    - quarantine
    - teslamate_docker
    - teslamate_docker_config
    - teslamate_docker_update
    - teslamate_grafana
    - teslamate_grafana_config

- name: "teslamate : Preserve Grafana image reference"
  ansible.builtin.set_fact:
    teslamate_grafana_image_digest_ref: >-
      {{ docker_quarantine_image_ref | regex_replace(':[^/@]+@', '@') }}
    teslamate_grafana_image_ref: "{{ docker_quarantine_image_ref }}"
  tags:
    - teslamate
    - config
    - update
    - docker
    - grafana
    - teslamate_docker
    - teslamate_docker_config
    - teslamate_docker_update
    - teslamate_grafana
    - teslamate_grafana_config

- name: "teslamate : Check data directory"
  ansible.builtin.stat:
    path: "{{ teslamate_data_dir }}"
  register: teslamate_data_dir_status
  tags:
    - teslamate
    - config
    - update
    - docker
    - grafana
    - teslamate_docker
    - teslamate_docker_config
    - teslamate_docker_update
    - teslamate_grafana
    - teslamate_grafana_config
    - teslamate_teslamate
    - teslamate_teslamate_init

- name: "teslamate : Create data directories"
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ teslamate_data_dir }}"
      owner: root
      group: root
      mode: '0755'
    - path: "{{ teslamate_data_dir }}/grafana"
      owner: '472'
      group: '0'
      mode: '0750'
    - path: "{{ teslamate_data_dir }}/grafana-dashboards"
      owner: root
      group: root
      mode: '0755'
    - path: "{{ teslamate_data_dir }}/import"
      owner: root
      group: root
      mode: '0755'
  when:
    - teslamate_image_ref | length > 0
    - teslamate_grafana_image_ref | length > 0
  tags:
    - teslamate
    - config
    - update
    - docker
    - grafana
    - teslamate_docker
    - teslamate_docker_config
    - teslamate_docker_update
    - teslamate_grafana
    - teslamate_grafana_config
    - teslamate_teslamate
    - teslamate_teslamate_init

- name: "teslamate : Download Amazon RDS CA bundle"
  ansible.builtin.get_url:
    url: "{{ teslamate_database_ca_url }}"
    dest: "{{ teslamate_data_dir }}/global-bundle.pem"
    checksum: "{{ teslamate_database_ca_checksum }}"
    owner: root
    group: root
    mode: '0644'
  notify: "teslamate: Restart"
  when:
    - teslamate_image_ref | length > 0
    - teslamate_grafana_image_ref | length > 0
    # Check mode does not create the parent directory on a first run.
    - not ansible_check_mode or teslamate_data_dir_status.stat.exists
  tags:
    - teslamate
    - config
    - database
    - teslamate_database
    - teslamate_database_config

- name: "teslamate : Deploy environment file"
  ansible.builtin.template:
    src: teslamate.env.j2
    dest: "{{ teslamate_data_dir }}/teslamate.env"
    owner: root
    group: root
    mode: '0600'
    backup: true
  no_log: true
  notify: "teslamate: Restart"
  when:
    - teslamate_image_ref | length > 0
    - teslamate_grafana_image_ref | length > 0
    # Check mode does not create the parent directory, so a first run cannot
    # stage this file. The local template contract test still renders it.
    - not ansible_check_mode or teslamate_data_dir_status.stat.exists
  tags:
    - teslamate
    - config
    - teslamate_teslamate
    - teslamate_teslamate_config

- name: "teslamate : Deploy Grafana environment file"
  ansible.builtin.template:
    src: grafana.env.j2
    dest: "{{ teslamate_data_dir }}/grafana.env"
    owner: root
    group: root
    mode: '0600'
    backup: true
  no_log: true
  notify: "teslamate-grafana: Restart"
  when:
    - teslamate_image_ref | length > 0
    - teslamate_grafana_image_ref | length > 0
    # Check mode does not create the parent directory, so a first run cannot
    # stage this file. The local template contract test still renders it.
    - not ansible_check_mode or teslamate_data_dir_status.stat.exists
  tags:
    - teslamate
    - config
    - teslamate_grafana
    - teslamate_grafana_config

- name: "teslamate : Deploy Visited dashboard patcher"
  ansible.builtin.copy:
    src: patch_visited_dashboard.py
    dest: "{{ teslamate_data_dir }}/patch_visited_dashboard.py"
    owner: root
    group: root
    mode: '0755'
  when:
    - teslamate_image_ref | length > 0
    - teslamate_grafana_image_ref | length > 0
    - not ansible_check_mode or teslamate_data_dir_status.stat.exists
  tags:
    - teslamate
    - config
    - update
    - docker
    - grafana
    - teslamate_docker
    - teslamate_docker_config
    - teslamate_docker_update
    - teslamate_grafana
    - teslamate_grafana_config

- name: "teslamate : Create Vampire Drain dashboard directory"
  ansible.builtin.file:
    path: "{{ teslamate_data_dir }}/grafana-dashboards"
    state: directory
    owner: root
    group: root
    mode: '0755'
  when:
    - teslamate_image_ref | length > 0
    - teslamate_grafana_image_ref | length > 0
  tags:
    - teslamate
    - config
    - update
    - docker
    - grafana
    - teslamate_docker
    - teslamate_docker_config
    - teslamate_docker_update
    - teslamate_grafana
    - teslamate_grafana_config

- name: "teslamate : Deploy Vampire Drain dashboard patcher"
  ansible.builtin.copy:
    src: patch_vampire_drain_dashboard.py
    dest: "{{ teslamate_data_dir }}/patch_vampire_drain_dashboard.py"
    owner: root
    group: root
    mode: '0755'
  when:
    - teslamate_image_ref | length > 0
    - teslamate_grafana_image_ref | length > 0
    - not ansible_check_mode or teslamate_data_dir_status.stat.exists
  tags:
    - teslamate
    - config
    - update
    - docker
    - grafana
    - teslamate_docker
    - teslamate_docker_config
    - teslamate_docker_update
    - teslamate_grafana
    - teslamate_grafana_config

- name: "teslamate : Check Grafana dashboard source image"
  community.docker.docker_image_info:
    name: "{{ teslamate_grafana_image_digest_ref }}"
  register: teslamate_grafana_dashboard_source_image
  when:
    - teslamate_image_ref | length > 0
    - teslamate_grafana_image_ref | length > 0
  tags:
    - teslamate
    - update
    - config
    - docker
    - grafana
    - teslamate_docker
    - teslamate_docker_config
    - teslamate_docker_update
    - teslamate_grafana
    - teslamate_grafana_config

- name: "teslamate : Pull Grafana dashboard source image"
  community.docker.docker_image:
    name: "{{ teslamate_grafana_image_ref }}"
    source: pull
  when:
    - teslamate_image_ref | length > 0
    - teslamate_grafana_image_ref | length > 0
    - teslamate_grafana_dashboard_source_image.images | length == 0
    - not ansible_check_mode
  tags:
    - teslamate
    - update
    - config
    - docker
    - grafana
    - teslamate_docker
    - teslamate_docker_config
    - teslamate_docker_update
    - teslamate_grafana
    - teslamate_grafana_config

- name: "teslamate : Remove stale Grafana dashboard source container"
  ansible.builtin.command:
    argv:
      - docker
      - rm
      - --force
      - teslamate-grafana-dashboard-source
  register: teslamate_grafana_dashboard_source_cleanup
  changed_when: false
  failed_when:
    - teslamate_grafana_dashboard_source_cleanup.rc != 0
    - "'No such container' not in teslamate_grafana_dashboard_source_cleanup.stderr"
  when:
    - teslamate_image_ref | length > 0
    - teslamate_grafana_image_ref | length > 0
    - not ansible_check_mode
  tags:
    - teslamate
    - update
    - config
    - docker
    - grafana
    - teslamate_docker
    - teslamate_docker_config
    - teslamate_docker_update
    - teslamate_grafana
    - teslamate_grafana_config

- name: "teslamate : Extract upstream Grafana dashboards"
  when:
    - teslamate_image_ref | length > 0
    - teslamate_grafana_image_ref | length > 0
    - not ansible_check_mode
  tags:
    - teslamate
    - update
    - config
    - docker
    - grafana
    - teslamate_docker
    - teslamate_docker_config
    - teslamate_docker_update
    - teslamate_grafana
    - teslamate_grafana_config
  block:
    - name: "teslamate : Create Grafana dashboard source container"
      ansible.builtin.command:
        argv:
          - docker
          - create
          - --name
          - teslamate-grafana-dashboard-source
          - "{{ teslamate_grafana_image_ref }}"
      changed_when: false

    - name: "teslamate : Copy upstream Grafana dashboards"
      ansible.builtin.command:
        argv:
          - docker
          - cp
          - "teslamate-grafana-dashboard-source:{{ item.source }}"
          - "{{ teslamate_data_dir }}/grafana-dashboards/{{ item.name }}.upstream.json"
      loop:
        - name: drive-details
          source: /dashboards_internal/drive-details.json
        - name: trip
          source: /dashboards/trip.json
        - name: visited
          source: /dashboards/visited.json
      loop_control:
        label: "{{ item.name }}"
      changed_when: false
  always:
    - name: "teslamate : Remove Grafana dashboard source container"
      ansible.builtin.command:
        argv:
          - docker
          - rm
          - --force
          - teslamate-grafana-dashboard-source
      changed_when: false

- name: "teslamate : Remove stale Vampire Drain dashboard source container"
  ansible.builtin.command:
    argv:
      - docker
      - rm
      - --force
      - teslamate-grafana-vampire-drain-source
  register: teslamate_grafana_vampire_drain_source_cleanup
  changed_when: false
  failed_when:
    - teslamate_grafana_vampire_drain_source_cleanup.rc != 0
    - "'No such container' not in teslamate_grafana_vampire_drain_source_cleanup.stderr"
  when:
    - teslamate_image_ref | length > 0
    - teslamate_grafana_image_ref | length > 0
    - not ansible_check_mode
  tags:
    - teslamate
    - update
    - config
    - docker
    - grafana
    - teslamate_docker
    - teslamate_docker_config
    - teslamate_docker_update
    - teslamate_grafana
    - teslamate_grafana_config

- name: "teslamate : Extract upstream Vampire Drain dashboard"
  when:
    - teslamate_image_ref | length > 0
    - teslamate_grafana_image_ref | length > 0
    - not ansible_check_mode
  tags:
    - teslamate
    - update
    - config
    - docker
    - grafana
    - teslamate_docker
    - teslamate_docker_config
    - teslamate_docker_update
    - teslamate_grafana
    - teslamate_grafana_config
  block:
    - name: "teslamate : Create Vampire Drain dashboard source container"
      ansible.builtin.command:
        argv:
          - docker
          - create
          - --name
          - teslamate-grafana-vampire-drain-source
          - "{{ teslamate_grafana_image_ref }}"
      changed_when: false

    - name: "teslamate : Copy upstream Vampire Drain dashboard"
      ansible.builtin.command:
        argv:
          - docker
          - cp
          - teslamate-grafana-vampire-drain-source:/dashboards/vampire-drain.json
          - "{{ teslamate_data_dir }}/grafana-dashboards/vampire-drain.upstream.json"
      changed_when: false
  always:
    - name: "teslamate : Remove Vampire Drain dashboard source container"
      ansible.builtin.command:
        argv:
          - docker
          - rm
          - --force
          - teslamate-grafana-vampire-drain-source
      changed_when: false

- name: "teslamate : Patch Vampire Drain dashboard"
  ansible.builtin.command:
    argv:
      - python3
      - "{{ teslamate_data_dir }}/patch_vampire_drain_dashboard.py"
      - --input
      - "{{ teslamate_data_dir }}/grafana-dashboards/vampire-drain.upstream.json"
      - --output
      - "{{ teslamate_data_dir }}/grafana-dashboards/vampire-drain.json"
  register: teslamate_grafana_vampire_drain_patch
  changed_when: teslamate_grafana_vampire_drain_patch.stdout == 'changed'
  notify: "teslamate-grafana: Restart"
  when:
    - teslamate_image_ref | length > 0
    - teslamate_grafana_image_ref | length > 0
    - not ansible_check_mode
  tags:
    - teslamate
    - update
    - config
    - docker
    - grafana
    - teslamate_docker
    - teslamate_docker_config
    - teslamate_docker_update
    - teslamate_grafana
    - teslamate_grafana_config

- name: "teslamate : Patch Grafana dashboards"
  ansible.builtin.command:
    argv:
      - python3
      - "{{ teslamate_data_dir }}/patch_visited_dashboard.py"
      - --input
      - "{{ teslamate_data_dir }}/grafana-dashboards/{{ item }}.upstream.json"
      - --output
      - "{{ teslamate_data_dir }}/grafana-dashboards/{{ item }}.json"
      - --geofence
      - "{{ teslamate_grafana_excluded_geofence }}"
  loop:
    - drive-details
    - trip
    - visited
  register: teslamate_grafana_dashboard_patch
  changed_when: teslamate_grafana_dashboard_patch.stdout == 'changed'
  notify: "teslamate-grafana: Restart"
  when:
    - teslamate_image_ref | length > 0
    - teslamate_grafana_image_ref | length > 0
    - not ansible_check_mode
  tags:
    - teslamate
    - update
    - config
    - docker
    - grafana
    - teslamate_docker
    - teslamate_docker_config
    - teslamate_docker_update
    - teslamate_grafana
    - teslamate_grafana_config

- name: "teslamate : Add services to compose"
  ansible.builtin.blockinfile:
    path: /etc/compose.yml
    marker: "# {mark} ANSIBLE MANAGED BLOCK teslamate"
    block: "{{ lookup('template', 'compose.yml.j2') }}"
  notify:
    - "teslamate: Restart"
    - "teslamate-grafana: Restart"
  when:
    - teslamate_image_ref | length > 0
    - teslamate_grafana_image_ref | length > 0
  tags:
    - teslamate
    - config
    - update
    - docker
    - grafana
    - teslamate_docker
    - teslamate_docker_config
    - teslamate_docker_update
    - teslamate_grafana
    - teslamate_grafana_config

- name: "teslamate : Pull and update containers"
  community.docker.docker_compose_v2:
    project_src: /etc
    pull: missing
    services:
      - teslamate
      - teslamate-grafana
    state: present
  when:
    - teslamate_image_ref | length > 0
    - teslamate_grafana_image_ref | length > 0
    - not ansible_check_mode
  tags:
    - teslamate
    - config
    - update
    - docker
    - grafana
    - teslamate_docker
    - teslamate_docker_config
    - teslamate_docker_update
    - teslamate_grafana
    - teslamate_grafana_config

- name: "teslamate : Install Apache authentication utility"
  ansible.builtin.apt:
    name: apache2-utils
  tags:
    - teslamate
    - install
    - apache
    - teslamate_apache
    - teslamate_apache_install

- name: "teslamate : Enable Apache modules"
  community.general.apache2_module:
    name: "{{ item }}"
  loop:
    - auth_basic
    - headers
    - proxy
    - proxy_http
    - proxy_wstunnel
    - rewrite
    - ssl
  notify: "teslamate: Validate Apache configuration"
  tags:
    - teslamate
    - config
    - apache
    - teslamate_apache
    - teslamate_apache_config

- name: "teslamate : Check Apache password file"
  ansible.builtin.stat:
    path: /etc/apache2/.teslamate.htpasswd
  register: teslamate_htpasswd_status
  tags:
    - teslamate
    - config
    - apache
    - teslamate_apache
    - teslamate_apache_config

- name: "teslamate : Verify Apache password"
  ansible.builtin.command:
    argv:
      - htpasswd
      - -v
      - -i
      - /etc/apache2/.teslamate.htpasswd
      - "{{ teslamate_basic_auth_username }}"
    stdin: "{{ teslamate_basic_auth_password }}"
  check_mode: false
  changed_when: false
  failed_when: false
  no_log: true
  register: teslamate_htpasswd_verify
  when: teslamate_htpasswd_status.stat.exists
  tags:
    - teslamate
    - config
    - apache
    - teslamate_apache
    - teslamate_apache_config

- name: "teslamate : Create Apache password file"
  ansible.builtin.command:
    argv:
      - htpasswd
      - -c
      - -B
      - -i
      - /etc/apache2/.teslamate.htpasswd
      - "{{ teslamate_basic_auth_username }}"
    stdin: "{{ teslamate_basic_auth_password }}"
  changed_when: true
  no_log: true
  notify: "teslamate: Validate Apache configuration"
  when:
    - not teslamate_htpasswd_status.stat.exists
    - not ansible_check_mode
  tags:
    - teslamate
    - config
    - apache
    - teslamate_apache
    - teslamate_apache_config

- name: "teslamate : Update Apache password"
  ansible.builtin.command:
    argv:
      - htpasswd
      - -B
      - -i
      - /etc/apache2/.teslamate.htpasswd
      - "{{ teslamate_basic_auth_username }}"
    stdin: "{{ teslamate_basic_auth_password }}"
  changed_when: true
  no_log: true
  notify: "teslamate: Validate Apache configuration"
  when:
    - teslamate_htpasswd_status.stat.exists
    - teslamate_htpasswd_verify.rc != 0
    - not ansible_check_mode
  tags:
    - teslamate
    - config
    - apache
    - teslamate_apache
    - teslamate_apache_config

- name: "teslamate : Set Apache password file permissions"
  ansible.builtin.file:
    path: /etc/apache2/.teslamate.htpasswd
    state: file
    owner: root
    group: www-data
    mode: '0640'
  when: teslamate_htpasswd_status.stat.exists or not ansible_check_mode
  tags:
    - teslamate
    - config
    - apache
    - teslamate_apache
    - teslamate_apache_config

- name: "teslamate : Deploy Apache sites"
  ansible.builtin.template:
    src: "{{ item }}.conf.j2"
    dest: "/etc/apache2/sites-available/{{ item }}.conf"
    mode: '0644'
  loop:
    - "{{ teslamate_grafana_hostname }}"
    - "{{ teslamate_hostname }}"
  notify: "teslamate: Validate Apache configuration"
  tags:
    - teslamate
    - config
    - apache
    - teslamate_apache
    - teslamate_apache_config

- name: "teslamate : Enable Apache sites"
  ansible.builtin.command:
    argv:
      - a2ensite
      - "{{ item }}"
  loop:
    - "{{ teslamate_grafana_hostname }}"
    - "{{ teslamate_hostname }}"
  register: teslamate_a2ensite
  changed_when: "'already enabled' not in teslamate_a2ensite.stdout"
  notify: "teslamate: Validate Apache configuration"
  tags:
    - teslamate
    - config
    - apache
    - teslamate_apache
    - teslamate_apache_config
