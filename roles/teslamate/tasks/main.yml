---
- name: "teslamate : Check data directory"
  ansible.builtin.stat:
    path: "{{ teslamate_data_dir }}"
  register: teslamate_data_dir_status
  tags:
    - teslamate
    - config
    - update
    - docker
    - grafana
    - teslamate_docker
    - teslamate_docker_config
    - teslamate_docker_update
    - teslamate_grafana
    - teslamate_grafana_config
    - teslamate_teslamate
    - teslamate_teslamate_init

- name: "teslamate : Create data directories"
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ teslamate_data_dir }}"
      owner: root
      group: root
      mode: '0755'
    - path: "{{ teslamate_data_dir }}/grafana"
      owner: '472'
      group: '0'
      mode: '0750'
    - path: "{{ teslamate_data_dir }}/import"
      owner: root
      group: root
      mode: '0755'
  tags:
    - teslamate
    - config
    - update
    - docker
    - grafana
    - teslamate_docker
    - teslamate_docker_config
    - teslamate_docker_update
    - teslamate_grafana
    - teslamate_grafana_config
    - teslamate_teslamate
    - teslamate_teslamate_init

- name: "teslamate : Download Amazon RDS CA bundle"
  ansible.builtin.get_url:
    url: "{{ teslamate_database_ca_url }}"
    dest: "{{ teslamate_data_dir }}/global-bundle.pem"
    checksum: "{{ teslamate_database_ca_checksum }}"
    owner: root
    group: root
    mode: '0644'
  notify: "teslamate: Restart"
  when:
    # Check mode does not create the parent directory on a first run.
    - not ansible_check_mode or teslamate_data_dir_status.stat.exists
  tags:
    - teslamate
    - config
    - database
    - teslamate_database
    - teslamate_database_config

- name: "teslamate : Deploy environment file"
  ansible.builtin.template:
    src: teslamate.env.j2
    dest: "{{ teslamate_data_dir }}/teslamate.env"
    owner: root
    group: root
    mode: '0600'
    backup: true
  no_log: true
  notify: "teslamate: Restart"
  when:
    # Check mode does not create the parent directory, so a first run cannot
    # stage this file. The local template contract test still renders it.
    - not ansible_check_mode or teslamate_data_dir_status.stat.exists
  tags:
    - teslamate
    - config
    - teslamate_teslamate
    - teslamate_teslamate_config

- name: "teslamate : Deploy Grafana environment file"
  ansible.builtin.template:
    src: grafana.env.j2
    dest: "{{ teslamate_data_dir }}/grafana.env"
    owner: root
    group: root
    mode: '0600'
    backup: true
  no_log: true
  notify: "teslamate-grafana: Restart"
  when:
    # Check mode does not create the parent directory, so a first run cannot
    # stage this file. The local template contract test still renders it.
    - not ansible_check_mode or teslamate_data_dir_status.stat.exists
  tags:
    - teslamate
    - config
    - teslamate_grafana
    - teslamate_grafana_config

- name: "teslamate : Resolve fork images"
  ansible.builtin.set_fact:
    # The fork is this account's own build, so it follows main without a cooldown.
    __teslamate_image: >-
      {{ lookup('aged_release', 'oci:ghcr.io/rewse/teslamate', pattern='^main$', days=0, platform='linux/' ~ ('arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64')) }}
    __teslamate_grafana_image: >-
      {{ lookup('aged_release', 'oci:ghcr.io/rewse/teslamate/grafana', pattern='^main$', days=0, platform='linux/' ~ ('arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64')) }}
  tags:
    - teslamate
    - config
    - update
    - docker
    - grafana
    - teslamate_docker
    - teslamate_docker_config
    - teslamate_docker_update
    - teslamate_grafana
    - teslamate_grafana_config

- name: "teslamate : Pre-pull deployment images"
  community.docker.docker_image:
    name: "{{ item }}"
    source: pull
  # By digest alone: docker_image cannot match a local image to a tag@digest
  # name, so that form pulls again on every run.
  loop:
    - "{{ __teslamate_image.ref | regex_replace(':[^:@/]+@', '@') }}"
    - "{{ __teslamate_grafana_image.ref | regex_replace(':[^:@/]+@', '@') }}"
  when:
    - not ansible_check_mode
  tags:
    - teslamate
    - config
    - update
    - docker
    - grafana
    - teslamate_docker
    - teslamate_docker_config
    - teslamate_docker_update
    - teslamate_grafana
    - teslamate_grafana_config

- name: "teslamate : Create compose directory"
  ansible.builtin.file:
    path: /etc/compose/teslamate
    state: directory
    mode: "0755"
  tags:
    - teslamate
    - config
    - update
    - docker
    - grafana
    - teslamate_docker
    - teslamate_docker_config
    - teslamate_docker_update
    - teslamate_grafana
    - teslamate_grafana_config

- name: "teslamate : Deploy compose file"
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: /etc/compose/teslamate/compose.yaml
    mode: "0644"
  register: __teslamate_compose
  tags:
    - teslamate
    - config
    - update
    - docker
    - grafana
    - teslamate_docker
    - teslamate_docker_config
    - teslamate_docker_update
    - teslamate_grafana
    - teslamate_grafana_config

# The container kept its name when it moved out of the shared /etc project, so
# the old one has to go before the new project can create it. These run before
# the start, against the usual order, and can be deleted once every host has
# converged.
- name: "teslamate : Read legacy container teslamate"
  community.docker.docker_container_info:
    name: teslamate
  register: __teslamate_legacy_teslamate
  tags:
    - teslamate
    - config
    - update
    - docker
    - grafana
    - teslamate_docker
    - teslamate_docker_config
    - teslamate_docker_update
    - teslamate_grafana
    - teslamate_grafana_config

- name: "teslamate : Remove legacy container teslamate"
  community.docker.docker_container:
    name: teslamate
    state: absent
  when:
    - __teslamate_legacy_teslamate.exists
    - __teslamate_legacy_teslamate.container.Config.Labels['com.docker.compose.project'] | default('') == 'etc'
  tags:
    - teslamate
    - config
    - update
    - docker
    - grafana
    - teslamate_docker
    - teslamate_docker_config
    - teslamate_docker_update
    - teslamate_grafana
    - teslamate_grafana_config

# The container kept its name when it moved out of the shared /etc project, so
# the old one has to go before the new project can create it. These run before
# the start, against the usual order, and can be deleted once every host has
# converged.
- name: "teslamate : Read legacy container teslamate-grafana"
  community.docker.docker_container_info:
    name: teslamate-grafana
  register: __teslamate_legacy_teslamate_grafana
  tags:
    - teslamate
    - config
    - update
    - docker
    - grafana
    - teslamate_docker
    - teslamate_docker_config
    - teslamate_docker_update
    - teslamate_grafana
    - teslamate_grafana_config

- name: "teslamate : Remove legacy container teslamate-grafana"
  community.docker.docker_container:
    name: teslamate-grafana
    state: absent
  when:
    - __teslamate_legacy_teslamate_grafana.exists
    - __teslamate_legacy_teslamate_grafana.container.Config.Labels['com.docker.compose.project'] | default('') == 'etc'
  tags:
    - teslamate
    - config
    - update
    - docker
    - grafana
    - teslamate_docker
    - teslamate_docker_config
    - teslamate_docker_update
    - teslamate_grafana
    - teslamate_grafana_config

- name: "teslamate : Remove legacy compose block teslamate"
  ansible.builtin.blockinfile:
    path: /etc/compose.yml
    marker: "# {mark} ANSIBLE MANAGED BLOCK teslamate"
    state: absent
  tags:
    - teslamate
    - config
    - update
    - docker
    - grafana
    - teslamate_docker
    - teslamate_docker_config
    - teslamate_docker_update
    - teslamate_grafana
    - teslamate_grafana_config

- name: "teslamate : Pull and update containers"
  community.docker.docker_compose_v2:
    project_src: /etc/compose/teslamate
    pull: never
    state: present
  when: not ansible_check_mode
  tags:
    - teslamate
    - config
    - update
    - docker
    - grafana
    - teslamate_docker
    - teslamate_docker_config
    - teslamate_docker_update
    - teslamate_grafana
    - teslamate_grafana_config

- name: "teslamate : Remove legacy dashboard patch assets"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ teslamate_data_dir }}/patch_vampire_drain_dashboard.py"
    - "{{ teslamate_data_dir }}/patch_visited_dashboard.py"
    - "{{ teslamate_data_dir }}/grafana-dashboards"
  tags:
    - teslamate
    - config
    - update
    - docker
    - grafana
    - teslamate_docker
    - teslamate_docker_config
    - teslamate_docker_update
    - teslamate_grafana
    - teslamate_grafana_config

- name: "teslamate : Install Apache authentication utility"
  ansible.builtin.apt:
    name: apache2-utils
  tags:
    - teslamate
    - install
    - apache
    - teslamate_apache
    - teslamate_apache_install

- name: "teslamate : Enable Apache modules"
  community.general.apache2_module:
    name: "{{ item }}"
  loop:
    - auth_basic
    - headers
    - proxy
    - proxy_http
    - proxy_wstunnel
    - rewrite
    - ssl
  notify: "teslamate: Validate Apache configuration"
  tags:
    - teslamate
    - config
    - apache
    - teslamate_apache
    - teslamate_apache_config

- name: "teslamate : Check Apache password file"
  ansible.builtin.stat:
    path: /etc/apache2/.teslamate.htpasswd
  register: teslamate_htpasswd_status
  tags:
    - teslamate
    - config
    - apache
    - teslamate_apache
    - teslamate_apache_config

- name: "teslamate : Verify Apache password"
  ansible.builtin.command:
    argv:
      - htpasswd
      - -v
      - -i
      - /etc/apache2/.teslamate.htpasswd
      - "{{ teslamate_basic_auth_username }}"
    stdin: "{{ teslamate_basic_auth_password }}"
  check_mode: false
  changed_when: false
  failed_when: false
  no_log: true
  register: teslamate_htpasswd_verify
  when: teslamate_htpasswd_status.stat.exists
  tags:
    - teslamate
    - config
    - apache
    - teslamate_apache
    - teslamate_apache_config

- name: "teslamate : Create Apache password file"
  ansible.builtin.command:
    argv:
      - htpasswd
      - -c
      - -B
      - -i
      - /etc/apache2/.teslamate.htpasswd
      - "{{ teslamate_basic_auth_username }}"
    stdin: "{{ teslamate_basic_auth_password }}"
  changed_when: true
  no_log: true
  notify: "teslamate: Validate Apache configuration"
  when:
    - not teslamate_htpasswd_status.stat.exists
    - not ansible_check_mode
  tags:
    - teslamate
    - config
    - apache
    - teslamate_apache
    - teslamate_apache_config

- name: "teslamate : Update Apache password"
  ansible.builtin.command:
    argv:
      - htpasswd
      - -B
      - -i
      - /etc/apache2/.teslamate.htpasswd
      - "{{ teslamate_basic_auth_username }}"
    stdin: "{{ teslamate_basic_auth_password }}"
  changed_when: true
  no_log: true
  notify: "teslamate: Validate Apache configuration"
  when:
    - teslamate_htpasswd_status.stat.exists
    - teslamate_htpasswd_verify.rc != 0
    - not ansible_check_mode
  tags:
    - teslamate
    - config
    - apache
    - teslamate_apache
    - teslamate_apache_config

- name: "teslamate : Set Apache password file permissions"
  ansible.builtin.file:
    path: /etc/apache2/.teslamate.htpasswd
    state: file
    owner: root
    group: www-data
    mode: '0640'
  when: teslamate_htpasswd_status.stat.exists or not ansible_check_mode
  tags:
    - teslamate
    - config
    - apache
    - teslamate_apache
    - teslamate_apache_config

- name: "teslamate : Deploy Apache sites"
  ansible.builtin.template:
    src: "{{ item }}.conf.j2"
    dest: "/etc/apache2/sites-available/{{ item }}.conf"
    mode: '0644'
  loop:
    - "{{ teslamate_grafana_hostname }}"
    - "{{ teslamate_hostname }}"
  notify: "teslamate: Validate Apache configuration"
  tags:
    - teslamate
    - config
    - apache
    - teslamate_apache
    - teslamate_apache_config

- name: "teslamate : Enable Apache sites"
  ansible.builtin.command:
    argv:
      - a2ensite
      - "{{ item }}"
  loop:
    - "{{ teslamate_grafana_hostname }}"
    - "{{ teslamate_hostname }}"
  register: teslamate_a2ensite
  changed_when: "'already enabled' not in teslamate_a2ensite.stdout"
  notify: "teslamate: Validate Apache configuration"
  tags:
    - teslamate
    - config
    - apache
    - teslamate_apache
    - teslamate_apache_config
