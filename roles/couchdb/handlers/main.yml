---
- name: Reload Apache
  ansible.builtin.systemd:
    name: apache2
    state: reloaded

- name: Restart couchdb
  community.docker.docker_compose_v2:
    project_src: /etc/compose/couchdb
    state: restarted
  # The project directory may not exist yet in check mode.
  when: not ansible_check_mode

- name: Run couchdb init script
  # The script only applies CouchDB settings over HTTP; there is no module for them.
  ansible.builtin.command: "{{ couchdb_livesync_dir }}/utils/couchdb/couchdb-init.sh"
  changed_when: true
  environment:
    hostname: "{{ couchdb_url }}"
    password: "{{ couchdb_password }}"
    # The script falls back to this URL when provision.ts is not beside it, so
    # a missing copy fails instead of running the upstream default branch.
    provision_script_url: "{{ couchdb_livesync_dir }}/utils/couchdb/provision.ts"
    username: "{{ admin_user }}"
  no_log: true

- name: Restart fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted
