# CouchDB's own log is not usable here. Docker names it after the container id, so
# the path changes whenever the container is recreated, and a glob wide enough to
# survive that matches every other container's log too. Apache fronts CouchDB and
# records the same requests at a stable path.
#
# Format is vhost_combined, so the virtual host comes first and <HOST> is the
# second field. The host is pinned because the file carries every name Apache
# serves.
#
# 401 alone. CouchDB answers a bad basic-auth credential with it, and nothing
# reaching this virtual host answers 401 in normal use: across the retained logs
# the only two are from testing this filter.
#
# Any method counts. CouchDB checks the credential before the method, so a
# request with a wrong one gets 401 whatever method it uses.
[Definition]
failregex = ^couchdb\.rewse\.jp:\d+ <HOST> \S+ \S+ \[\] "\S+ \S+ HTTP/[\d.]+" 401 \d+
ignoreregex =
