---
- name: apache | Deploy vhost config
  ansible.builtin.template:
    src: couchdb.rewse.jp.conf.j2
    dest: /etc/apache2/sites-available/couchdb.rewse.jp.conf
    mode: "0644"
  notify: Reload Apache

- name: apache | Enable site
  # No module enables an Apache site; a2ensite reports whether it changed.
  ansible.builtin.command: a2ensite couchdb.rewse.jp
  register: __couchdb_a2ensite
  changed_when: "'already enabled' not in __couchdb_a2ensite.stdout"
  notify: Reload Apache
