---
- name: database | Resolve aged release of the init script
  ansible.builtin.set_fact:
    __couchdb_livesync: "{{ lookup('aged_release', 'github-tag:vrtmrz/obsidian-livesync') }}"

- name: database | Create init script directories
  ansible.builtin.file:
    path: "{{ couchdb_livesync_dir }}/utils/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - couchdb
    - flyio

# Fetched with uri and written with copy rather than get_url, which in check mode
# reports a forced download as changed without comparing content. Every file
# comes from the commit of the aged tag.
- name: database | Fetch init script
  ansible.builtin.uri:
    url: https://raw.githubusercontent.com/vrtmrz/obsidian-livesync/{{ __couchdb_livesync.commit }}/utils/{{ item }}
    return_content: true
  loop: "{{ couchdb_livesync_files }}"
  register: __couchdb_init_script
  check_mode: false

- name: database | Install init script
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: "{{ couchdb_livesync_dir }}/utils/{{ item.item }}"
    mode: "{{ '0755' if item.item.endswith('.sh') else '0644' }}"
  loop: "{{ __couchdb_init_script.results }}"
  loop_control:
    label: "{{ item.item }}"
  notify: Run couchdb init script

- name: database | Remove legacy init script
  ansible.builtin.file:
    path: /usr/local/src/couchdb-init.sh
    state: absent
