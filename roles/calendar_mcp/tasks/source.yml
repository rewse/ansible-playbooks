---
- name: source | Resolve aged release
  ansible.builtin.set_fact:
    # Upstream has no tags or releases; each version lands as one commit whose
    # subject is "Release x.y.z".
    __calendar_mcp_source: >-
      {{ lookup('aged_release', 'github-commit:MarimerLLC/calendar-mcp',
                message='^Release (\d+\.\d+\.\d+)') }}

- name: source | Name image
  ansible.builtin.set_fact:
    # The patch checksum is part of the tag, so a changed patch builds a new
    # image even when the upstream commit stays the same.
    __calendar_mcp_image: >-
      {{ 'calendar-mcp:' ~ __calendar_mcp_source.version
         ~ '-' ~ __calendar_mcp_source.commit[:7]
         ~ '-' ~ (lookup('ansible.builtin.file', 'save-draft.patch') | hash('sha256'))[:8] }}

- name: source | Read image
  community.docker.docker_image_info:
    name: "{{ __calendar_mcp_image }}"
  register: __calendar_mcp_image_info

- name: source | Remove previous checkout
  # A forced checkout keeps untracked files, and the patch adds one, so the
  # next version's patch would refuse to create it again.
  ansible.builtin.file:
    path: "{{ calendar_mcp_source_dir }}"
    state: absent
  when: not ansible_check_mode and __calendar_mcp_image_info.images | length == 0

- name: source | Check out repository
  ansible.builtin.git:
    repo: https://github.com/MarimerLLC/calendar-mcp.git
    dest: "{{ calendar_mcp_source_dir }}"
    version: "{{ __calendar_mcp_source.commit }}"
  when: __calendar_mcp_image_info.images | length == 0

- name: source | Report skipped build in check mode
  ansible.builtin.debug:
    msg: Patch and build skipped because the checkout is not written in check mode
    verbosity: 0
  when: ansible_check_mode and __calendar_mcp_image_info.images | length == 0

- name: source | Apply patch
  # A patch that no longer applies fails the play here, so the running container
  # keeps its image until the patch is fixed.
  ansible.posix.patch:
    src: save-draft.patch
    basedir: "{{ calendar_mcp_source_dir }}"
    strip: 1
  when: not ansible_check_mode and __calendar_mcp_image_info.images | length == 0

- name: source | Build image
  community.docker.docker_image_build:
    name: "{{ __calendar_mcp_image.split(':')[0] }}"
    tag: "{{ __calendar_mcp_image.split(':')[1] }}"
    path: "{{ calendar_mcp_source_dir }}"
    dockerfile: Dockerfile
  when: not ansible_check_mode and __calendar_mcp_image_info.images | length == 0
