---
# calendar_mcp replaces mailboxd, which served the same Sakura mailboxes to Muse.
# Delete this file and its import once every host has converged.
- name: legacy | Check mailboxd compose file
  ansible.builtin.stat:
    path: /etc/compose/mailboxd/compose.yaml
  register: __calendar_mcp_mailboxd_compose

- name: legacy | Stop mailboxd
  community.docker.docker_compose_v2:
    project_src: /etc/compose/mailboxd
    state: absent
    remove_images: all
  when: __calendar_mcp_mailboxd_compose.stat.exists

- name: legacy | Remove mailboxd vhost
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apache2/sites-enabled/mail-mcp.rewse.jp.conf
    - /etc/apache2/sites-available/mail-mcp.rewse.jp.conf
  notify: Reload Apache

- name: legacy | Remove mailboxd fail2ban jail
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/fail2ban/filter.d/mailboxd.conf
    - /etc/fail2ban/jail.d/mailboxd.conf
  notify: Restart fail2ban

- name: legacy | Remove mailboxd files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/compose/mailboxd
    - /srv/mailboxd
