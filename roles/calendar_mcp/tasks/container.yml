---
- name: container | Create compose directory
  ansible.builtin.file:
    path: /etc/compose/calendar_mcp
    state: directory
    mode: "0755"

- name: container | Create data directories
  # Created here rather than left to Docker, which would make a missing bind
  # source owned by root and leave the container user unable to write its state.
  ansible.builtin.file:
    path: "{{ calendar_mcp_data_dir }}/{{ item.name }}"
    state: directory
    owner: "{{ calendar_mcp_uid }}"
    group: "{{ calendar_mcp_uid }}"
    mode: "0750"
  loop: "{{ calendar_mcp_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: container | Resolve fork commit
  ansible.builtin.set_fact:
    # The fork carries the changes upstream lacks (drafts folder, save_draft,
    # headers) on top of an upstream release. It is this account's own
    # repository, so it is followed without a cooldown; upstream code reaches
    # it only by rebasing onto a release older than supply_chain_cooldown_days.
    __calendar_mcp_source: "{{ lookup('aged_release', 'github-commit:rewse/calendar-mcp', days=0) }}"

- name: container | Name image
  ansible.builtin.set_fact:
    __calendar_mcp_image: "{{ 'calendar-mcp:' ~ __calendar_mcp_source.commit[:12] }}"

- name: container | Read image
  community.docker.docker_image_info:
    name: "{{ __calendar_mcp_image }}"
  register: __calendar_mcp_image_info

- name: container | Check out repository
  ansible.builtin.git:
    repo: https://github.com/rewse/calendar-mcp.git
    dest: "{{ calendar_mcp_source_dir }}"
    version: "{{ __calendar_mcp_source.commit }}"
    force: true
  when: __calendar_mcp_image_info.images | length == 0

- name: container | Report skipped build in check mode
  ansible.builtin.debug:
    msg: Build skipped because the checkout is not written in check mode
    verbosity: 0
  when: ansible_check_mode and __calendar_mcp_image_info.images | length == 0

- name: container | Build image
  community.docker.docker_image_build:
    name: "{{ __calendar_mcp_image.split(':')[0] }}"
    tag: "{{ __calendar_mcp_image.split(':')[1] }}"
    path: "{{ calendar_mcp_source_dir }}"
    dockerfile: Dockerfile
  when: not ansible_check_mode and __calendar_mcp_image_info.images | length == 0

- name: container | Deploy compose file
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: /etc/compose/calendar_mcp/compose.yaml
    mode: "0644"
  register: __calendar_mcp_compose
  notify: Recreate calendar-mcp

- name: container | Report skipped start in check mode
  ansible.builtin.debug:
    msg: Start skipped because the compose file is not written in check mode
    verbosity: 0
  when: ansible_check_mode and __calendar_mcp_compose is changed

- name: container | Start containers
  community.docker.docker_compose_v2:
    project_src: /etc/compose/calendar_mcp
    state: present
    pull: never
    # The health check reads /health, so waiting for healthy confirms that the
    # configuration loaded and the server answers.
    wait: true
    wait_timeout: 120
  when: not (ansible_check_mode and __calendar_mcp_compose is changed)
