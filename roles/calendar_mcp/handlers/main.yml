---
- name: Reload Apache
  ansible.builtin.systemd:
    name: apache2
    state: reloaded

- name: Recreate calendar-mcp
  community.docker.docker_compose_v2:
    project_src: /etc/compose/calendar_mcp
    state: present
    # A restart keeps the environment the container was created with, so a
    # changed .env takes effect only in a new container.
    recreate: always
    pull: never
    wait: true
    wait_timeout: 120
  # The project directory may not exist yet in check mode.
  when: not ansible_check_mode

- name: Restart fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted
