---
# The stable channel has no InRelease yet, so preview is the only channel
# that installs. The official install script falls back to it the same way.
rex_apt_channel: preview
# dpkg names for ansible_facts['architecture']; Rex builds only these two.
rex_apt_architectures:
  aarch64: arm64
  x86_64: amd64
rex_apt_key_url: https://pkgs.superlogical.com/rex/keys/rex-archive-keyring.gpg
rex_apt_keyring: /etc/apt/keyrings/rex-archive-keyring.gpg
rex_apt_uri: https://pkgs.superlogical.com/rex/apt
