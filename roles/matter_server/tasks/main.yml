---
- name: "matter-server : Create data directory"
  ansible.builtin.file:
    path: /etc/matter-server/data
    state: directory
    mode: '0755'
  tags:
    - matter-server
    - init
    - matter-server_matter-server
    - matter-server_matter-server_init

- name: "docker : Resolve aged image"
  ansible.builtin.set_fact:
    __matter_server_image: >-
      {{ lookup('aged_release', 'oci:ghcr.io/home-assistant-libs/python-matter-server', pattern='^\d+\.\d+\.\d+$',
                platform='linux/' ~ ('arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64')) }}
  tags:
    - matter_server
    - update
    - docker
    - matter_server_docker

- name: "docker : Create compose directory"
  ansible.builtin.file:
    path: /etc/compose/matter_server
    state: directory
    mode: "0755"
  tags:
    - matter_server
    - update
    - docker
    - matter_server_docker

- name: "docker : Deploy compose file"
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: /etc/compose/matter_server/compose.yaml
    mode: "0644"
  register: __matter_server_compose
  tags:
    - matter_server
    - update
    - docker
    - matter_server_docker

- name: "docker : Report skipped start in check mode"
  ansible.builtin.debug:
    msg: Start skipped because the compose file is not written in check mode
    verbosity: 0
  when: ansible_check_mode and __matter_server_compose is changed
  tags:
    - matter_server
    - update
    - docker
    - matter_server_docker

- name: "docker : Start containers"
  community.docker.docker_compose_v2:
    project_src: /etc/compose/matter_server
    state: present
    pull: missing
  when: not (ansible_check_mode and __matter_server_compose is changed)
  tags:
    - matter_server
    - update
    - docker
    - matter_server_docker
