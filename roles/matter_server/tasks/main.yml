---
- name: "matter-server : Create data directory"
  ansible.builtin.file:
    path: /etc/matter-server/data
    state: directory
    mode: '0755'
  tags:
    - matter-server
    - init
    - matter-server_matter-server
    - matter-server_matter-server_init

- name: "docker : Resolve aged image"
  ansible.builtin.set_fact:
    __matter_server_image: >-
      {{ lookup('aged_release', 'oci:ghcr.io/home-assistant-libs/python-matter-server', pattern='^\d+\.\d+\.\d+$',
                platform='linux/' ~ ('arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64')) }}
  tags:
    - matter_server
    - update
    - docker
    - matter_server_docker

- name: "docker : Create compose directory"
  ansible.builtin.file:
    path: /etc/compose/matter_server
    state: directory
    mode: "0755"
  tags:
    - matter_server
    - update
    - docker
    - matter_server_docker

- name: "docker : Deploy compose file"
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: /etc/compose/matter_server/compose.yaml
    mode: "0644"
  register: __matter_server_compose
  tags:
    - matter_server
    - update
    - docker
    - matter_server_docker

# The container kept its name when it moved out of the shared /etc project, so
# the old one has to go before the new project can create it. These run before
# the start, against the usual order, and can be deleted once every host has
# converged.
- name: "docker : Read legacy container matter-server"
  community.docker.docker_container_info:
    name: matter-server
  register: __matter_server_legacy_matter_server
  tags:
    - matter_server
    - update
    - docker
    - matter_server_docker

- name: "docker : Remove legacy container matter-server"
  community.docker.docker_container:
    name: matter-server
    state: absent
  when:
    - __matter_server_legacy_matter_server.exists
    - __matter_server_legacy_matter_server.container.Config.Labels['com.docker.compose.project'] | default('') == 'etc'
  tags:
    - matter_server
    - update
    - docker
    - matter_server_docker

- name: "docker : Remove legacy compose block matter-server"
  ansible.builtin.blockinfile:
    path: /etc/compose.yml
    marker: "# {mark} ANSIBLE MANAGED BLOCK matter-server"
    state: absent
  tags:
    - matter_server
    - update
    - docker
    - matter_server_docker

- name: "docker : Report skipped start in check mode"
  ansible.builtin.debug:
    msg: Start skipped because the compose file is not written in check mode
    verbosity: 0
  when: ansible_check_mode and __matter_server_compose is changed
  tags:
    - matter_server
    - update
    - docker
    - matter_server_docker

- name: "docker : Start containers"
  community.docker.docker_compose_v2:
    project_src: /etc/compose/matter_server
    state: present
    pull: missing
  when: not (ansible_check_mode and __matter_server_compose is changed)
  tags:
    - matter_server
    - update
    - docker
    - matter_server_docker
