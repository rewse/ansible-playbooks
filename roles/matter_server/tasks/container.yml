---
- name: container | Check legacy data directory
  ansible.builtin.stat:
    path: /srv/matter-server
  register: __matter_server_legacy

- name: container | Stop containers before moving data
  community.docker.docker_compose_v2:
    project_src: /etc/compose/matter_server
    state: stopped
  when: __matter_server_legacy.stat.exists

- name: container | Move data to the role directory
  # No module renames a directory; mv on one filesystem is an atomic rename.
  ansible.builtin.command: mv /srv/matter-server /srv/matter_server
  args:
    creates: /srv/matter_server
    removes: /srv/matter-server

- name: container | Create data directory
  ansible.builtin.file:
    path: /srv/matter_server/data
    state: directory
    mode: "0755"

- name: container | Resolve aged image
  ansible.builtin.set_fact:
    __matter_server_image: >-
      {{ lookup('aged_release', 'oci:ghcr.io/home-assistant-libs/python-matter-server', pattern='^\d+\.\d+\.\d+$',
                platform='linux/' ~ ('arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64')) }}

- name: container | Create compose directory
  ansible.builtin.file:
    path: /etc/compose/matter_server
    state: directory
    mode: "0755"

- name: container | Deploy compose file
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: /etc/compose/matter_server/compose.yaml
    mode: "0644"
  register: __matter_server_compose

- name: container | Report skipped start in check mode
  ansible.builtin.debug:
    msg: Start skipped because the compose file is not written in check mode
    verbosity: 0
  when: ansible_check_mode and __matter_server_compose is changed

- name: container | Start containers
  community.docker.docker_compose_v2:
    project_src: /etc/compose/matter_server
    state: present
    pull: missing
  when: not (ansible_check_mode and __matter_server_compose is changed)

- name: container | Remove legacy configuration directory
  ansible.builtin.file:
    path: /etc/matter-server
    state: absent
