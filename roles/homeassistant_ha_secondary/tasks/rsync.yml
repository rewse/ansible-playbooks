---
- name: rsync | Create config directory
  ansible.builtin.file:
    path: /srv/homeassistant/config
    state: directory
    mode: "0755"

- name: rsync | Install package
  ansible.builtin.apt:
    name: rsync

- name: rsync | Copy script
  ansible.builtin.template:
    src: homeassistant-sync.j2
    dest: /usr/local/bin/homeassistant-sync
    mode: "0755"
    # The script uses Docker and shell syntax that clashes with Jinja's.
    variable_start_string: "[%"
    variable_end_string: "%]"

- name: rsync | Copy service unit
  ansible.builtin.copy:
    src: homeassistant-sync.service
    dest: /etc/systemd/system/homeassistant-sync.service
    mode: "0644"
  notify: Reload systemd

- name: rsync | Copy timer unit
  ansible.builtin.copy:
    src: homeassistant-sync.timer
    dest: /etc/systemd/system/homeassistant-sync.timer
    mode: "0644"
  notify: Reload systemd

- name: rsync | Enable timer
  ansible.builtin.systemd:
    name: homeassistant-sync.timer
    enabled: true
    state: started
    daemon_reload: true
  when: not ansible_check_mode
