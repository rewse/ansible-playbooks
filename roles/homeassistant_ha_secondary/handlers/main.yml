---
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Reload Apache
  ansible.builtin.systemd:
    name: apache2
    state: reloaded

- name: Restart Apache
  ansible.builtin.systemd:
    name: apache2
    state: restarted

- name: Restart zabbix-agent
  ansible.builtin.systemd:
    name: zabbix-agent
    state: restarted

- name: Restart fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted
