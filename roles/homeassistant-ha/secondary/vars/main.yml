---
homeassistant_ha_token: "{{ lookup('pipe', 'op read \"op://ansible/Home Assistant - homeassistant-ha/credential\"') }}"
# 15 minutes filters a primary that is only rebooting, which accounted for one of
# the two failovers seen so far, while still covering the hour-long outage of the
# other one.
homeassistant_ha_failover_after: 900
# The name that follows whichever host serves Home Assistant, and the two hosts
# it moves between.
homeassistant_ha_domain: hass.rewse.jp
homeassistant_ha_primary_ip: 192.168.0.30
homeassistant_ha_standby_ip: 192.168.0.40
# Reached through the Site Manager Cloud Connector rather than the console's own
# address, because a key generated at unifi.ui.com is refused locally.
homeassistant_ha_unifi_console: sierra
homeassistant_ha_unifi_api_key: "{{ lookup('pipe', 'op read \"op://ansible/UniFi API/credential\"') }}"
