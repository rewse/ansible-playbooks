---
homeassistant_ha_token: "{{ lookup('pipe', 'op read \"op://ansible/Home Assistant - homeassistant-ha/credential\"') }}"
# 15 minutes filters a primary that is only rebooting, which accounted for one of
# the two failovers seen so far, while still covering the hour-long outage of the
# other one.
homeassistant_ha_failover_after: 900
