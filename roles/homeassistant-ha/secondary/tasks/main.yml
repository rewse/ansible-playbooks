---
- name: "config : Create directory"
  ansible.builtin.file:
    path: /srv/homeassistant/config
    state: directory
    mode: '0755'
  tags: [homeassistant-ha-secondary, init]

- name: "rsync-sync : Install package"
  ansible.builtin.apt:
    name: rsync
  tags: [homeassistant-ha-secondary, install]

- name: "rsync-sync : Copy script"
  ansible.builtin.copy:
    src: homeassistant-sync
    dest: /usr/local/bin/homeassistant-sync
    mode: '0755'
  tags: [homeassistant-ha-secondary, config]

- name: "rsync-sync : Copy service unit"
  ansible.builtin.copy:
    src: homeassistant-sync.service
    dest: /etc/systemd/system/homeassistant-sync.service
    mode: '0644'
  notify: "systemd: Reload"
  tags: [homeassistant-ha-secondary, config]

- name: "rsync-sync : Copy timer unit"
  ansible.builtin.copy:
    src: homeassistant-sync.timer
    dest: /etc/systemd/system/homeassistant-sync.timer
    mode: '0644'
  notify: "systemd: Reload"
  tags: [homeassistant-ha-secondary, config]

- name: "rsync-sync : Enable timer"
  ansible.builtin.systemd:
    name: homeassistant-sync.timer
    enabled: true
    state: started
    daemon_reload: true
  when: not ansible_check_mode
  tags: [homeassistant-ha-secondary, config]

- name: "docker : Resolve quarantined image"
  ansible.builtin.include_role:
    name: docker/quarantine
    apply:
      tags: [homeassistant-ha-secondary, update, quarantine]
  vars:
    quarantine_repo: ghcr.io/home-assistant/home-assistant
    quarantine_tag_pattern: '^\d{4}\.\d+\.\d+$'
  tags: [homeassistant-ha-secondary, update, quarantine]

- name: "docker : Add compose service"
  ansible.builtin.blockinfile:
    path: /etc/compose.yml
    create: true
    mode: '0644'
    marker: "# {mark} ANSIBLE MANAGED BLOCK homeassistant"
    block: |2
        homeassistant:
          container_name: homeassistant
          image: {{ docker_quarantine_image_ref }}
          volumes:
            - /etc/localtime:/etc/localtime:ro
            - /run/dbus:/run/dbus:ro
            - /srv/homeassistant/config:/config
          security_opt:
            - apparmor:unconfined
          network_mode: host
          privileged: true
          restart: "no"
  when: docker_quarantine_image_ref | length > 0
  tags: [homeassistant-ha-secondary, config]

- name: "docker : Pull image (standby, do not start)"
  community.docker.docker_compose_v2:
    project_src: /etc
    services: homeassistant
    state: stopped
    pull: missing
  when: docker_quarantine_image_ref | length > 0
  tags: [homeassistant-ha-secondary, update]

- name: "failover : Create state directory"
  ansible.builtin.file:
    path: /var/lib/homeassistant-ha
    state: directory
    mode: '0755'
  tags: [homeassistant-ha-secondary, init]

- name: "failover : Copy script"
  ansible.builtin.template:
    src: homeassistant-failover.j2
    dest: /usr/local/bin/homeassistant-failover
    mode: '0755'
    variable_start_string: "[%"
    variable_end_string: "%]"
  tags: [homeassistant-ha-secondary, config]

- name: "failover : Copy service unit"
  ansible.builtin.copy:
    src: homeassistant-failover.service
    dest: /etc/systemd/system/homeassistant-failover.service
    mode: '0644'
  notify: "systemd: Reload"
  tags: [homeassistant-ha-secondary, config]

- name: "failover : Copy timer unit"
  ansible.builtin.copy:
    src: homeassistant-failover.timer
    dest: /etc/systemd/system/homeassistant-failover.timer
    mode: '0644'
  notify: "systemd: Reload"
  tags: [homeassistant-ha-secondary, config]

- name: "failover : Enable timer"
  ansible.builtin.systemd:
    name: homeassistant-failover.timer
    enabled: true
    state: started
    daemon_reload: true
  when: not ansible_check_mode
  tags: [homeassistant-ha-secondary, config]

- name: "failback : Copy script"
  ansible.builtin.template:
    src: homeassistant-failback.j2
    dest: /usr/local/bin/homeassistant-failback
    mode: '0755'
    variable_start_string: "[%"
    variable_end_string: "%]"
  tags: [homeassistant-ha-secondary, config]

- name: "name-switch : Copy script"
  ansible.builtin.template:
    src: homeassistant-name-switch.j2
    dest: /usr/local/bin/homeassistant-name-switch
    mode: '0700'
    variable_start_string: "[%"
    variable_end_string: "%]"
  tags: [homeassistant-ha-secondary, config]

- name: "sslcert-sync : Copy script"
  ansible.builtin.copy:
    src: sslcert-sync
    dest: /usr/local/bin/sslcert-sync
    mode: '0755'
  tags: [homeassistant-ha-secondary, config]

- name: "sslcert-sync : Copy service unit"
  ansible.builtin.copy:
    src: sslcert-sync.service
    dest: /etc/systemd/system/sslcert-sync.service
    mode: '0644'
  notify: "systemd: Reload"
  tags: [homeassistant-ha-secondary, config]

- name: "sslcert-sync : Copy timer unit"
  ansible.builtin.copy:
    src: sslcert-sync.timer
    dest: /etc/systemd/system/sslcert-sync.timer
    mode: '0644'
  notify: "systemd: Reload"
  tags: [homeassistant-ha-secondary, config]

- name: "sslcert-sync : Enable timer"
  ansible.builtin.systemd:
    name: sslcert-sync.timer
    enabled: true
    state: started
    daemon_reload: true
  when: not ansible_check_mode
  tags: [homeassistant-ha-secondary, config]

- name: "sslcert-sync : Fetch the certificate now"
  ansible.builtin.command: /usr/local/bin/sslcert-sync
  register: homeassistant_ha_sslcert_sync
  changed_when: "'updated' in homeassistant_ha_sslcert_sync.stdout"
  when: not ansible_check_mode
  tags: [homeassistant-ha-secondary, config]

# The vhost proxies to the container over HTTP and upgrades the websocket, which
# the base httpd role has no reason to enable.
- name: "apache : Enable proxy modules"
  community.general.apache2_module:
    name: "{{ item }}"
  loop:
    - proxy
    - proxy_http
    - proxy_wstunnel
  notify: "apache: Restart"
  tags: [homeassistant-ha-secondary, config]

# The primary serves this name while it is up; the standby answers on it only
# after homeassistant-name-switch points the name here. Same file as the primary
# uses, so the two cannot drift.
- name: "apache : Copy vhost configuration"
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/roles/homeassistant/files/hass.rewse.jp.conf"
    dest: /etc/apache2/sites-available/hass.rewse.jp.conf
    mode: '0644'
  notify: "apache: Reload"
  tags: [homeassistant-ha-secondary, config]

- name: "apache : Enable site"
  ansible.builtin.command: a2ensite hass.rewse.jp
  register: homeassistant_ha_a2ensite
  changed_when: "'already enabled' not in homeassistant_ha_a2ensite.stdout"
  notify: "apache: Reload"
  tags: [homeassistant-ha-secondary, config]

- name: "zabbix : Copy userparameter config"
  ansible.builtin.copy:
    src: homeassistant-ha.conf
    dest: /etc/zabbix/zabbix_agentd.d/homeassistant-ha.conf
    mode: '0644'
  notify: "zabbix-agent: Restart"
  tags: [homeassistant-ha-secondary, config]
