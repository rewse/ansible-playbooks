---
- name: automation | Create directories
  ansible.builtin.file:
    path: /srv/homeassistant/config/{{ item }}
    state: directory
    mode: "0755"
    follow: false
  loop:
    - automations
    - blueprints/automation

- name: automation | Copy files
  # configuration.yaml merges every file in the directory, so each automations-*
  # file in the role is deployed without being listed.
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /srv/homeassistant/config/automations
    mode: "0644"
  with_fileglob: automations-*.yaml

- name: automation | Remove renamed files
  # The renamed files hold the same automation IDs, so leftovers would load as duplicates.
  ansible.builtin.file:
    path: /srv/homeassistant/config/automations/{{ item }}
    state: absent
  loop:
    - automations-dads-room-climates.yaml
    - automations-dads-room-lights.yaml
    - automations-dads-room.yaml
    - automations-moms-room-climates.yaml
    - automations-moms-room-lights.yaml
    - automations-moms-room.yaml
