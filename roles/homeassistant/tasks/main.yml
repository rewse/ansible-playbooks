- name: "configuration : Configure main settings"
  ansible.builtin.blockinfile:
    path: /srv/homeassistant/config/configuration.yaml
    block: |
      homeassistant:
        name: "Home"
        latitude: !secret latlng_home_lat
        longitude: !secret latlng_home_lng
        elevation: 40
        unit_system: metric
        temperature_unit: C
        time_zone: "Asia/Tokyo"
        country: "JP"
        currency: "JPY"
        external_url: "https://hass.rewse.jp/"
        internal_url: "https://hass.rewse.jp/"
        customize: !include customize.yaml
      logger:
        default: warning
        logs:
          androidtv.adb_manager.adb_manager_async: error
          homeassistant.components.androidtv.media_player: error
          homeassistant.components.imap_email_content.sensor: warning
      lovelace:
        mode: storage
      recorder:
        db_url: !secret postgres_connstr
        purge_keep_days: 450
      zha:
        zigpy_config:
          ota:
            ikea_provider: true
  notify: "homeassistant: Restart"
  tags:
    - homeassistant
    - config

- name: "tesla-fleet : Copy private key"
  ansible.builtin.copy:
    content: "{{ homeassistant_tesla_fleet.private_key }}\n"
    dest: /srv/homeassistant/config/tesla_fleet.key
    mode: '0600'
  no_log: true
  notify: "homeassistant: Restart"
  tags:
    - homeassistant
    - config
    - tesla-fleet
    - homeassistant_tesla-fleet
    - homeassistant_tesla-fleet_config

- name: "tesla-fleet : Create public key directory"
  ansible.builtin.file:
    path: /srv/www/tesla
    state: directory
    mode: '0755'
  tags:
    - homeassistant
    - init
    - tesla-fleet
    - homeassistant_tesla-fleet
    - homeassistant_tesla-fleet_init

# Tesla pairs a vehicle against the key published under the domain, so this file
# must stay derived from the private key Home Assistant signs commands with.
- name: "tesla-fleet : Copy public key"
  ansible.builtin.copy:
    content: "{{ homeassistant_tesla_fleet.public_key }}\n"
    dest: /srv/www/tesla/com.tesla.3p.public-key.pem
    mode: '0644'
  tags:
    - homeassistant
    - config
    - tesla-fleet
    - homeassistant_tesla-fleet
    - homeassistant_tesla-fleet_config

