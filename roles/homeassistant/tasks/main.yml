- name: "frigate : Clone integration"
  ansible.builtin.git:
    repo: https://github.com/blakeblackshear/frigate-hass-integration.git
    dest: /tmp/frigate-hass-integration
    version: "v{{ homeassistant_frigate_version }}"
  register: homeassistant_frigate_git
  tags:
    - homeassistant
    - install
    - custom
    - frigate
    - homeassistant_frigate
    - homeassistant_frigate_install

- name: "frigate : Install integration"
  ansible.builtin.copy:
    src: /tmp/frigate-hass-integration/custom_components/frigate
    dest: /srv/homeassistant/config/custom_components
    remote_src: true
    mode: '0644'
  notify: "homeassistant: Restart"
  when: not ansible_check_mode
  tags:
    - homeassistant
    - config
    - custom
    - frigate
    - homeassistant_frigate
    - homeassistant_frigate_config
    - homeassistant_frigate_install

- name: "frigate : Report installation deferred in check mode"
  ansible.builtin.debug:
    msg: >-
      Frigate integration file installation is deferred in check mode because
      the requested checkout is not created during a dry run.
  when: ansible_check_mode
  tags:
    - homeassistant
    - config
    - custom
    - frigate
    - homeassistant_frigate
    - homeassistant_frigate_config
    - homeassistant_frigate_install

