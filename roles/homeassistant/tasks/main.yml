  loop:
    - proxy
    - proxy_http
    - proxy_wstunnel
  notify: "apache: Restart"
  tags:
    - homeassistant
    - config
    - apache
    - homeassistant_apache
    - homeassistant_apache_config

- name: "apache : Copy vhost configuration"
  ansible.builtin.copy:
    src: hass.rewse.jp.conf
    dest: /etc/apache2/sites-available
    mode: '0644'
  notify: "apache: Reload"
  tags:
    - homeassistant
    - config
    - apache
    - homeassistant_apache
    - homeassistant_apache_config

- name: "apache : Enable site"
  ansible.builtin.command: a2ensite hass.rewse.jp
  register: homeassistant_a2ensite
  changed_when: "'already enabled' not in homeassistant_a2ensite.stdout"
  notify: "apache: Reload"
  tags:
    - homeassistant
    - config
    - apache
    - homeassistant_apache
    - homeassistant_apache_config
