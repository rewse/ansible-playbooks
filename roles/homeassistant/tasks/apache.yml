---
- name: apache | Enable proxy modules
  community.general.apache2_module:
    name: "{{ item }}"
  loop:
    - proxy
    - proxy_http
    - proxy_wstunnel
  notify: Restart Apache

- name: apache | Copy vhost configuration
  ansible.builtin.copy:
    src: hass.rewse.jp.conf
    dest: /etc/apache2/sites-available
    mode: "0644"
  notify: Reload Apache

- name: apache | Enable site
  # No module enables an Apache site.
  ansible.builtin.command: a2ensite hass.rewse.jp
  register: __homeassistant_a2ensite
  changed_when: "'already enabled' not in __homeassistant_a2ensite.stdout"
  notify: Reload Apache
