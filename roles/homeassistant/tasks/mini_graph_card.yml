---
- name: mini_graph_card | Create www directory
  ansible.builtin.file:
    path: /srv/homeassistant/config/www
    state: directory
    mode: "0755"

- name: mini_graph_card | Resolve aged release
  ansible.builtin.set_fact:
    __homeassistant_mini_graph_card: "{{ lookup('aged_release', 'github-release:kalkih/mini-graph-card', asset='mini-graph-card-bundle.js') }}"

- name: mini_graph_card | Install
  ansible.builtin.get_url:
    url: "{{ __homeassistant_mini_graph_card.url }}"
    dest: /srv/homeassistant/config/www/mini-graph-card-bundle.js
    mode: "0644"
    checksum: "{{ __homeassistant_mini_graph_card.checksum | default(omit, true) }}"
    # The file name carries no version, so without a checksum only a fresh
    # download reveals a new release.
    force: "{{ __homeassistant_mini_graph_card.checksum == '' }}"
  notify: Restart Home Assistant
