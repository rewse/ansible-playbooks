---
- name: Test thermometer fault detection
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    room_contracts:
      - alarm_file: automations-dads-room.yaml
        alarm_id: automation.alarm_dads_room_temp_difference
        climate_file: automations-dads-room-climates.yaml
        control_automation_ids:
          - automation.adjust_dads_room_ac_temp
          - automation.change_dads_room_ac_from_heatcool
          - automation.change_dads_room_ac_mode
          - automation.toggle_dads_room_ac_cooldry
          - automation.toggle_dads_room_ac_heat
        fault_entity_id: binary_sensor.dads_room_thermometer_fault
        prefix: dads_room
        secondary_entity_id: sensor.dads_room_switchbot_meter_temperature
        secondary_unavailable_seconds: 86400
        smoothed_entity_ids:
          - sensor.dads_room_switchbot_meter_temperature_smoothed
          - sensor.dads_room_temperature_smoothed
        source_entity_ids:
          - sensor.dads_room_switchbot_meter_temperature
          - sensor.dads_room_temperature
      - alarm_file: automations-living-room.yaml
        alarm_id: automation.alarm_living_room_temperature_difference
        climate_file: automations-living-room-climates.yaml
        control_automation_ids:
          - automation.adjust_living_room_ac_temp
          - automation.change_living_room_ac_from_heatcool
          - automation.change_living_room_ac_mode
          - automation.toggle_living_area_floor_heating
          - automation.toggle_living_room_ac_cooldry
          - automation.toggle_living_room_ac_heat
        fault_entity_id: binary_sensor.living_room_thermometer_fault
        prefix: living_room
        smoothed_entity_ids:
          - sensor.living_room_switchbot_hub_2_temperature_smoothed
          - sensor.living_room_temperature_smoothed
        source_entity_ids:
          - sensor.living_room_switchbot_hub_2_temperature
          - sensor.living_room_temperature
      - alarm_file: automations-moms-room.yaml
        alarm_id: automation.alarm_moms_room_temp_difference
        climate_file: automations-moms-room-climates.yaml
        control_automation_ids:
          - automation.adjust_moms_room_ac_temp
          - automation.change_moms_room_ac_from_heatcool
          - automation.change_moms_room_ac_mode
          - automation.toggle_moms_room_ac_cooldry
          - automation.toggle_moms_room_ac_heat
        fault_entity_id: binary_sensor.moms_room_thermometer_fault
        prefix: moms_room
        smoothed_entity_ids:
          - sensor.moms_room_switchbot_meter_temperature_smoothed
          - sensor.moms_room_temperature_smoothed
        source_entity_ids:
          - sensor.moms_room_switchbot_meter_temperature
          - sensor.moms_room_temperature
  tasks:
    - name: "thermometer-fault-test : Parse shared configuration"
      ansible.builtin.set_fact:
        homeassistant_sensors: "{{ lookup('file', '../files/sensors.yaml') | from_yaml }}"
        homeassistant_templates: "{{ lookup('file', '../files/templates.yaml') | from_yaml }}"

    - name: "thermometer-fault-test : Collect template binary sensors"
      ansible.builtin.set_fact:
        homeassistant_template_binary_sensors: >-
          {{ homeassistant_templates
             | selectattr('binary_sensor', 'defined')
             | map(attribute='binary_sensor')
             | flatten }}

    - name: "thermometer-fault-test : Verify each room contract"
      ansible.builtin.include_tasks: thermometer_fault_detection_room.yml
      loop: "{{ room_contracts }}"
      loop_control:
        loop_var: room_contract
