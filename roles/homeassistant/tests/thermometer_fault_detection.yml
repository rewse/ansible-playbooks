---
- name: Test thermometer fault detection
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    room_contracts:
      - alarm_file: automations-dads-room.yaml
        alarm_id: automation.alarm_dads_room_temp_difference
        anomaly_entity_id: binary_sensor.dad_s_room_thermometer_anomaly
        anomaly_unique_id: binary_sensor.dads_room_thermometer_anomaly
        climate_file: automations-dads-room-climates.yaml
        control_automation_ids:
          - automation.adjust_dads_room_ac_temp
          - automation.change_dads_room_ac_from_heatcool
          - automation.change_dads_room_ac_mode
          - automation.toggle_dads_room_ac_cooldry
          - automation.toggle_dads_room_ac_heat
        disagreement_entity_id: binary_sensor.dad_s_room_temperature_disagreement
        disagreement_unique_id: binary_sensor.dads_room_temperature_disagreement
        fault_entity_id: binary_sensor.dad_s_room_thermometer_fault
        fault_unique_id: binary_sensor.dads_room_thermometer_fault
        prefix: dads_room
        primary_entity_id: sensor.dad_s_room_thermometer_primary_temperature
        secondary_entity_id: sensor.dad_s_room_thermometer_secondary_temperature
        secondary_stale_seconds: 86400
        secondary_unavailable_seconds: 86400
        smoothed_sensors:
          - entity_id: sensor.dad_s_room_switchbot_meter_temperature_smoothed
            unique_id: sensor.dads_room_switchbot_meter_temperature_smoothed
          - entity_id: sensor.dad_s_room_temperature_smoothed
            unique_id: sensor.dads_room_temperature_smoothed
        source_entity_ids:
          - sensor.dad_s_room_thermometer_secondary_temperature
          - sensor.dad_s_room_thermometer_primary_temperature
      - alarm_file: automations-living-room.yaml
        alarm_id: automation.alarm_living_room_temperature_difference
        anomaly_entity_id: binary_sensor.living_room_thermometer_anomaly
        anomaly_unique_id: binary_sensor.living_room_thermometer_anomaly
        climate_file: automations-living-room-climates.yaml
        control_automation_ids:
          - automation.adjust_living_room_ac_temp
          - automation.change_living_room_ac_from_heatcool
          - automation.change_living_room_ac_mode
          - automation.toggle_living_area_floor_heating
          - automation.toggle_living_room_ac_cooldry
          - automation.toggle_living_room_ac_heat
        disagreement_entity_id: binary_sensor.living_room_temperature_disagreement
        disagreement_unique_id: binary_sensor.living_room_temperature_disagreement
        fault_entity_id: binary_sensor.living_room_thermometer_fault
        fault_unique_id: binary_sensor.living_room_thermometer_fault
        prefix: living_room
        primary_entity_id: sensor.living_room_thermometer_temperature
        secondary_entity_id: sensor.living_room_switchbot_hub_temperature
        secondary_stale_seconds: 86400
        secondary_unavailable_seconds: 86400
        smoothed_sensors:
          - entity_id: sensor.living_room_switchbot_hub_2_temperature_smoothed
            unique_id: sensor.living_room_switchbot_hub_2_temperature_smoothed
          - entity_id: sensor.living_room_temperature_smoothed
            unique_id: sensor.living_room_temperature_smoothed
        source_entity_ids:
          - sensor.living_room_switchbot_hub_temperature
          - sensor.living_room_thermometer_temperature
      - alarm_file: automations-moms-room.yaml
        alarm_id: automation.alarm_moms_room_temp_difference
        anomaly_entity_id: binary_sensor.mom_s_room_thermometer_anomaly
        anomaly_unique_id: binary_sensor.moms_room_thermometer_anomaly
        climate_file: automations-moms-room-climates.yaml
        control_automation_ids:
          - automation.adjust_moms_room_ac_temp
          - automation.change_moms_room_ac_from_heatcool
          - automation.change_moms_room_ac_mode
          - automation.toggle_moms_room_ac_cooldry
          - automation.toggle_moms_room_ac_heat
        disagreement_entity_id: binary_sensor.mom_s_room_temperature_disagreement
        disagreement_unique_id: binary_sensor.moms_room_temperature_disagreement
        fault_entity_id: binary_sensor.mom_s_room_thermometer_fault
        fault_unique_id: binary_sensor.moms_room_thermometer_fault
        prefix: moms_room
        primary_entity_id: sensor.mom_s_room_thermometer_primary_temperature
        secondary_entity_id: sensor.mom_s_room_thermometer_secondary_temperature
        secondary_stale_seconds: 86400
        secondary_unavailable_seconds: 86400
        smoothed_sensors:
          - entity_id: sensor.mom_s_room_switchbot_meter_temperature_smoothed
            unique_id: sensor.moms_room_switchbot_meter_temperature_smoothed
          - entity_id: sensor.mom_s_room_temperature_smoothed
            unique_id: sensor.moms_room_temperature_smoothed
        source_entity_ids:
          - sensor.mom_s_room_thermometer_secondary_temperature
          - sensor.mom_s_room_thermometer_primary_temperature
  tasks:
    - name: Parse shared configuration
      ansible.builtin.set_fact:
        homeassistant_sensors: "{{ lookup('file', '../files/sensors.yaml') | from_yaml }}"
        homeassistant_templates: "{{ lookup('file', '../files/templates.yaml') | from_yaml }}"

    - name: Collect template binary sensors
      ansible.builtin.set_fact:
        homeassistant_template_binary_sensors: >-
          {{ homeassistant_templates
             | selectattr('binary_sensor', 'defined')
             | map(attribute='binary_sensor')
             | flatten }}

    - name: Verify each room contract
      ansible.builtin.include_tasks: thermometer_fault_detection_room.yml
      loop: "{{ room_contracts }}"
      loop_control:
        loop_var: room_contract
