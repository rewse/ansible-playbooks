---
- name: Test hygrometer fault detection
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    retired_sensor_ids:
      - sensor.dad_s_room_humidity_difference
      - sensor.dad_s_room_humidity_difference_average
      - sensor.dad_s_room_temp_difference
      - sensor.dad_s_room_temp_difference_average
      - sensor.living_room_humidity_difference
      - sensor.living_room_humidity_difference_average
      - sensor.living_room_temp_difference
      - sensor.living_room_temp_difference_average
      - sensor.mom_s_room_humidity_difference
      - sensor.mom_s_room_humidity_difference_average
      - sensor.mom_s_room_temp_difference
      - sensor.mom_s_room_temp_difference_average
    room_contracts:
      - alarm_file: automations-dad-s-room.yaml
        alarm_id: automation.dad_s_room_alarm_humidity_difference
        anomaly_entity_id: binary_sensor.dad_s_room_hygrometer_anomaly
        anomaly_unique_id: binary_sensor.dad_s_room_hygrometer_anomaly
        climate_file: automations-dad-s-room-climates.yaml
        control_automation_ids:
          - automation.dad_s_room_adjust_ac_temperature
          - automation.dad_s_room_change_ac_from_heatcool
          - automation.dad_s_room_change_ac_mode
          - automation.dad_s_room_toggle_ac_cooldry
          - automation.dad_s_room_toggle_ac_heat
        disagreement_entity_id: binary_sensor.dad_s_room_humidity_disagreement
        disagreement_unique_id: binary_sensor.dad_s_room_humidity_disagreement
        fault_entity_id: binary_sensor.dad_s_room_hygrometer_fault
        fault_unique_id: binary_sensor.dad_s_room_hygrometer_fault
        prefix: dad_s_room
        primary_entity_id: sensor.dad_s_room_thermometer_primary_humidity
        secondary_entity_id: sensor.dad_s_room_thermometer_secondary_humidity
        secondary_stale_seconds: 86400
        secondary_unavailable_seconds: 86400
        smoothed_sensors:
          - entity_id: sensor.dad_s_room_thermometer_primary_humidity_smoothed
            unique_id: sensor.dad_s_room_thermometer_primary_humidity_smoothed
          - entity_id: sensor.dad_s_room_thermometer_secondary_humidity_smoothed
            unique_id: sensor.dad_s_room_thermometer_secondary_humidity_smoothed
        source_entity_ids:
          - sensor.dad_s_room_thermometer_primary_humidity
          - sensor.dad_s_room_thermometer_secondary_humidity
      - alarm_file: automations-living-room.yaml
        alarm_id: automation.living_room_alarm_humidity_difference
        anomaly_entity_id: binary_sensor.living_room_hygrometer_anomaly
        anomaly_unique_id: binary_sensor.living_room_hygrometer_anomaly
        climate_file: automations-living-room-climates.yaml
        control_automation_ids:
          - automation.living_room_adjust_ac_temperature
          - automation.living_room_change_ac_from_heatcool
          - automation.living_room_change_ac_mode
          - automation.living_room_toggle_floor_heating
          - automation.living_room_toggle_ac_cooldry
          - automation.living_room_toggle_ac_heat
        disagreement_entity_id: binary_sensor.living_room_humidity_disagreement
        disagreement_unique_id: binary_sensor.living_room_humidity_disagreement
        fault_entity_id: binary_sensor.living_room_hygrometer_fault
        fault_unique_id: binary_sensor.living_room_hygrometer_fault
        prefix: living_room
        primary_entity_id: sensor.living_room_thermometer_humidity
        secondary_entity_id: sensor.living_room_switchbot_hub_humidity
        secondary_stale_seconds: 86400
        secondary_unavailable_seconds: 86400
        smoothed_sensors:
          - entity_id: sensor.living_room_thermometer_humidity_smoothed
            unique_id: sensor.living_room_thermometer_humidity_smoothed
          - entity_id: sensor.living_room_switchbot_hub_humidity_smoothed
            unique_id: sensor.living_room_switchbot_hub_humidity_smoothed
        source_entity_ids:
          - sensor.living_room_thermometer_humidity
          - sensor.living_room_switchbot_hub_humidity
      - alarm_file: automations-mom-s-room.yaml
        alarm_id: automation.mom_s_room_alarm_humidity_difference
        anomaly_entity_id: binary_sensor.mom_s_room_hygrometer_anomaly
        anomaly_unique_id: binary_sensor.mom_s_room_hygrometer_anomaly
        climate_file: automations-mom-s-room-climates.yaml
        control_automation_ids:
          - automation.mom_s_room_adjust_ac_temperature
          - automation.mom_s_room_change_ac_from_heatcool
          - automation.mom_s_room_change_ac_mode
          - automation.mom_s_room_toggle_ac_cooldry
          - automation.mom_s_room_toggle_ac_heat
        disagreement_entity_id: binary_sensor.mom_s_room_humidity_disagreement
        disagreement_unique_id: binary_sensor.mom_s_room_humidity_disagreement
        fault_entity_id: binary_sensor.mom_s_room_hygrometer_fault
        fault_unique_id: binary_sensor.mom_s_room_hygrometer_fault
        prefix: mom_s_room
        primary_entity_id: sensor.mom_s_room_thermometer_primary_humidity
        secondary_entity_id: sensor.mom_s_room_thermometer_secondary_humidity
        secondary_stale_seconds: 86400
        secondary_unavailable_seconds: 86400
        smoothed_sensors:
          - entity_id: sensor.mom_s_room_thermometer_primary_humidity_smoothed
            unique_id: sensor.mom_s_room_thermometer_primary_humidity_smoothed
          - entity_id: sensor.mom_s_room_thermometer_secondary_humidity_smoothed
            unique_id: sensor.mom_s_room_thermometer_secondary_humidity_smoothed
        source_entity_ids:
          - sensor.mom_s_room_thermometer_primary_humidity
          - sensor.mom_s_room_thermometer_secondary_humidity
  tasks:
    - name: Parse shared configuration
      ansible.builtin.set_fact:
        homeassistant_sensors: "{{ lookup('file', '../files/sensors.yaml') | from_yaml }}"
        homeassistant_templates: "{{ lookup('file', '../files/templates.yaml') | from_yaml }}"

    - name: Collect template entities
      ansible.builtin.set_fact:
        homeassistant_template_binary_sensors: >-
          {{ homeassistant_templates
             | selectattr('binary_sensor', 'defined')
             | map(attribute='binary_sensor')
             | flatten }}
        homeassistant_template_sensors: >-
          {{ homeassistant_templates
             | selectattr('sensor', 'defined')
             | map(attribute='sensor')
             | flatten }}

    - name: Verify each room contract
      ansible.builtin.include_tasks: hygrometer_fault_detection_room.yml
      loop: "{{ room_contracts }}"
      loop_control:
        loop_var: room_contract

    - name: Verify retired sensors are absent
      ansible.builtin.assert:
        that:
          - item not in (homeassistant_sensors | map(attribute='unique_id') | list)
          - item not in (homeassistant_template_sensors | map(attribute='unique_id') | list)
      loop: "{{ retired_sensor_ids }}"
