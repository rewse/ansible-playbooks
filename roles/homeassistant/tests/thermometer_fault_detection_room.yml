---
- name: "thermometer-fault-test : Parse {{ room_contract.prefix }} automations"
  ansible.builtin.set_fact:
    room_alarm_automations: >-
      {{ lookup('file', '../files/' ~ room_contract.alarm_file) | from_yaml }}
    room_climate_automations: >-
      {{ lookup('file', '../files/' ~ room_contract.climate_file) | from_yaml }}

- name: "thermometer-fault-test : Select {{ room_contract.prefix }} sensors"
  ansible.builtin.set_fact:
    room_alarm_automation: >-
      {{ room_alarm_automations
         | selectattr('id', 'equalto', room_contract.alarm_id)
         | list }}
    room_control_automations: >-
      {{ room_climate_automations
         | selectattr('id', 'in', room_contract.control_automation_ids)
         | list }}
    room_disagreement_sensors: >-
      {{ homeassistant_template_binary_sensors
         | selectattr('unique_id', 'equalto', 'binary_sensor.' ~ room_contract.prefix ~ '_temperature_disagreement')
         | list }}
    room_fault_sensors: >-
      {{ homeassistant_template_binary_sensors
         | selectattr('unique_id', 'equalto', room_contract.fault_entity_id)
         | list }}
    room_smoothed_sensors: >-
      {{ homeassistant_sensors
         | selectattr('unique_id', 'match', '^sensor\.' ~ room_contract.prefix ~ '_.*temperature_smoothed$')
         | list }}

- name: "thermometer-fault-test : Verify {{ room_contract.prefix }} entities exist"
  ansible.builtin.assert:
    that:
      - room_alarm_automation | length == 1
      - room_control_automations | length == room_contract.control_automation_ids | length
      - room_disagreement_sensors | length == 1
      - room_fault_sensors | length == 1
      - room_smoothed_sensors | length == 2

- name: "thermometer-fault-test : Store {{ room_contract.prefix }} entities"
  ansible.builtin.set_fact:
    room_alarm_automation_value: "{{ room_alarm_automation[0] }}"
    room_disagreement_sensor: "{{ room_disagreement_sensors[0] }}"
    room_fault_sensor: "{{ room_fault_sensors[0] }}"

- name: "thermometer-fault-test : Verify {{ room_contract.prefix }} smoothing"
  ansible.builtin.assert:
    that:
      - item.entity_id in room_contract.source_entity_ids
      - item.state_characteristic == 'average_step'
      - item.max_age.hours == 1
      - item.unique_id in room_contract.smoothed_entity_ids
  loop: "{{ room_smoothed_sensors }}"

- name: "thermometer-fault-test : Verify {{ room_contract.prefix }} smoothed wiring"
  ansible.builtin.assert:
    that:
      - "(\"states('\" ~ item ~ \"')\") in room_disagreement_sensor.state"
      - "(\"is_number(states('\" ~ item ~ \"'))\") in room_disagreement_sensor.state"
      - "(\"states('\" ~ item ~ \"')\") in room_alarm_automation_value.actions[0].data.message"
  loop: "{{ room_contract.smoothed_entity_ids }}"

- name: "thermometer-fault-test : Verify {{ room_contract.prefix }} persistence"
  ansible.builtin.assert:
    that:
      - room_disagreement_sensor.delay_on.hours == 2
      - room_fault_sensor.delay_off.hours == 1
      - "'> 1.5' in room_disagreement_sensor.state"
      - room_fault_sensor.state | regex_findall('not is_number') | length == 2
      - room_fault_sensor.state | regex_findall('primary \\| float < 5') | length == 1
      - room_fault_sensor.state | regex_findall('primary \\| float > 40') | length == 1
      - room_fault_sensor.state | regex_findall('secondary \\| float < 5') | length == 1
      - room_fault_sensor.state | regex_findall('secondary \\| float > 40') | length == 1
      - room_fault_sensor.state | regex_findall('>= 7200') | length == 2
      - >-
        ("is_state('binary_sensor." ~ room_contract.prefix ~
         "_temperature_disagreement', 'on')") in room_fault_sensor.state

- name: "thermometer-fault-test : Verify {{ room_contract.prefix }} source freshness"
  ansible.builtin.assert:
    that:
      - "('states.' ~ item ~ '.last_reported') in room_fault_sensor.state"
  loop: "{{ room_contract.source_entity_ids }}"

- name: "thermometer-fault-test : Verify {{ room_contract.prefix }} secondary availability delay"
  ansible.builtin.assert:
    that:
      - >-
        (
          "not is_number(secondary) and (now() - states." ~
          room_contract.secondary_entity_id ~
          ".last_changed).total_seconds() >= " ~
          room_contract.secondary_unavailable_seconds
        ) in (room_fault_sensor.state | regex_replace('\\s+', ' '))
  when: room_contract.secondary_unavailable_seconds is defined

- name: "thermometer-fault-test : Verify {{ room_contract.prefix }} has no secondary availability delay"
  ansible.builtin.assert:
    that:
      - "'.last_changed' not in room_fault_sensor.state"
      - "'1800' not in room_fault_sensor.state"
  when: room_contract.secondary_unavailable_seconds is not defined

- name: "thermometer-fault-test : Verify {{ room_contract.prefix }} alarm"
  ansible.builtin.assert:
    that:
      - room_alarm_automation_value.triggers | length == 1
      - room_alarm_automation_value.triggers[0].entity_id == room_contract.fault_entity_id
      - room_alarm_automation_value.triggers[0].to == 'on'
      - room_alarm_automation_value.actions | selectattr('action', 'equalto', 'automation.turn_off') | list | length == 0
      - "'is_number' in room_alarm_automation_value.actions[0].data.message"
      - "'unavailable' in room_alarm_automation_value.actions[0].data.message"

- name: "thermometer-fault-test : Verify {{ room_contract.prefix }} control guards"
  ansible.builtin.assert:
    that:
      - >-
        item.conditions
        | selectattr('entity_id', 'defined')
        | selectattr('entity_id', 'equalto', room_contract.fault_entity_id)
        | selectattr('state', 'equalto', 'off')
        | list
        | length == 1
  loop: "{{ room_control_automations }}"
  loop_control:
    label: "{{ item.id }}"
