- id: automation.alarm_dads_room_humidity_difference
  alias: "ALARM: Dad’s Room Humidity Difference"
  triggers:
    - trigger: state
      entity_id: binary_sensor.dads_room_hygrometer_fault
      to: "on"
  actions:
    - action: notify.tats_devices
      data:
        title: "⚠️ ALARM"
        message: >-
          Dad’s Room humidity sensors may be faulty.
          Current: {{ states('sensor.dads_room_humidity') }}% /
          {{ states('sensor.dads_room_switchbot_meter_humidity') }}%.
          Smoothed difference:
          {% set primary_smoothed = states('sensor.dads_room_humidity_smoothed') %}
          {% set secondary_smoothed = states('sensor.dads_room_switchbot_meter_humidity_smoothed') %}
          {% if is_number(primary_smoothed) and is_number(secondary_smoothed) %}
            {{ (primary_smoothed | float - secondary_smoothed | float) | abs | round(2) }}pt
          {% else %}
            unavailable
          {% endif %}
        data:
          push:
            interruption-level: time-sensitive
          url: "/lovelace/overview"
  trace:
    stored_traces: 100
