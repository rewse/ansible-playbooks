- id: automation.toggle_mom_s_room_air_purifier
  alias: "Toggle Air Purifier"
  triggers:
    - trigger: state
      entity_id: alarm_control_panel.home
    - trigger: homeassistant
      event: start
  actions:
    - choose:
        - conditions:
            - condition: state
              entity_id: alarm_control_panel.home
              state:
                - "armed_home"
                - "disarmed"
          sequence:
            - action: fan.set_preset_mode
              target:
                entity_id: fan.mom_s_room_air_purifier
              data:
                preset_mode: "auto"
        - conditions:
            - condition: state
              entity_id: alarm_control_panel.home
              state:
                - "armed_away"
                - "armed_vacation"
          sequence:
            - action: fan.set_preset_mode
              target:
                entity_id: fan.mom_s_room_air_purifier
              data:
                preset_mode: "pet"
  trace:
    stored_traces: 100
- id: automation.toggle_mom_s_room_humidifier
  alias: "Toggle Humidifier"
  triggers:
    - trigger: state
      entity_id:
        - input_number.mom_s_room_humidity_target
        - input_number.mom_s_room_humidity_maximum_difference
        - input_number.mom_s_room_humidity_minimum_difference
    - trigger: time_pattern
      minutes: "/5"
      seconds: 54
    - trigger: homeassistant
      event: start
  conditions:
    - condition: state
      entity_id: input_select.season_mode
      state: "Winter"
      for:
        minutes: 20
  actions:
    - choose:
        - conditions:
            - condition: state
              entity_id: binary_sensor.mom_s_room_humidity_low
              state: "on"
            - condition: state
              entity_id: switch.mom_s_room_humidifier
              state: "off"
              for:
                hours: 1
          sequence:
            - choose:
                - conditions:
                    - condition: state
                      entity_id: input_boolean.mom_s_room_window_mode
                      state: "on"
                      for:
                        minutes: 10
                  sequence:
                    - event: "mom_s_room_humidity_too_low"
                - conditions:
                    - condition: state
                      entity_id: input_boolean.mom_s_room_window_mode
                      state: "off"
                      for:
                        minutes: 10
                  sequence:
                    - action: switch.toggle
                      entity_id: switch.mom_s_room_humidifier
                    - action: notify.all_devices
                      data:
                        message: >-
                          Turned on Mom’s Room Humidifier.
                          Current: {{ states('sensor.mom_s_room_thermometer_primary_humidity') }}%
                        data:
                          push:
                            interruption-level: time-sensitive
                          url: "/lovelace/overview"
                    - delay:
                        hours: 1
        - conditions:
            - condition: state
              entity_id: binary_sensor.mom_s_room_humidity_high
              state: "on"
            - condition: state
              entity_id: switch.mom_s_room_humidifier
              state: "on"
          sequence:
            - action: switch.toggle
              entity_id: switch.mom_s_room_humidifier
            - action: notify.all_devices
              data:
                message: >-
                  Turned off Mom’s Room Humidifier.
                  Current: {{ states('sensor.mom_s_room_thermometer_primary_humidity') }}%
                data:
                  push:
                    interruption-level: time-sensitive
                  url: "/lovelace/overview"
            - delay:
                hours: 1
  trace:
    stored_traces: 100
- id: automation.turn_off_mom_s_room_ac_internal_clean
  alias: "Turn Off AC Internal Clean"
  triggers:
    - trigger: state
      entity_id: climate.mom_s_room_ac
      to: "fan_only"
      for:
        minutes: 120
    - trigger: state
      entity_id: climate.mom_s_room_ac
      from: "fan_only"
      to: "off"
  actions:
    - action: climate.turn_off
      target:
        entity_id: climate.mom_s_room_ac
    - action: automation.turn_off
      target:
        entity_id:
          - automation.mom_s_room_turn_on_ac_internal_clean
  trace:
    stored_traces: 100
- id: automation.turn_off_mom_s_room_climate_ventilated
  alias: "Turn off Climate Ventilated"
  triggers:
    - trigger: state
      entity_id: input_select.mom_s_room_climate_mode
      to: "Ventilated"
  actions:
    - variables:
        acted: false
    - if:
        - condition: state
          entity_id: climate.mom_s_room_ac
          state:
            - "cool"
            - "dry"
            - "heat"
      then:
        - action: climate.turn_off
          target:
            entity_id: climate.mom_s_room_ac
        - variables:
            acted: true
    - if:
        - condition: state
          entity_id: switch.mom_s_room_humidifier
          state: "on"
      then:
        - action: switch.turn_off
          target:
            entity_id: switch.mom_s_room_humidifier
        - variables:
            acted: true
    - if:
        - "{{ acted }}"
      then:
        - action: notify.all_devices
          data:
            message: "Turned off Mom’s Room Climate Systems Due to Ventilating"
            data:
              push:
                interruption-level: time-sensitive
              url: "/lovelace/overview"
  trace:
    stored_traces: 100
- id: automation.turn_on_mom_s_room_ac_internal_clean
  alias: "Turn on AC Internal Clean"
  triggers:
    - trigger: state
      entity_id: climate.mom_s_room_ac
      to: "off"
      for:
        seconds: 10
  actions:
    - action: climate.set_hvac_mode
      target:
        entity_id: climate.mom_s_room_ac
      data:
        hvac_mode: "fan_only"
  trace:
    stored_traces: 100
- id: automation.turn_on_mom_s_room_ac_streamer
  alias: "Turn on AC Streamer"
  triggers:
    - trigger: state
      entity_id: climate.mom_s_room_ac
      not_to: "off"
      for:
        seconds: 10
  actions:
    - action: switch.turn_on
      target:
        entity_id: switch.mom_s_room_ac_streamer
  trace:
    stored_traces: 100
