- id: automation.toggle_mom_s_room_ac_cooldry
  alias: "Toggle AC CoolDry"
  triggers:
    - trigger: state
      entity_id:
        - input_number.mom_s_room_temperature_target
        - input_number.mom_s_room_temperature_maximum_difference
        - input_number.mom_s_room_temperature_minimum_difference
    - trigger: state
      entity_id: input_boolean.mom_s_room_window_mode
      to: "off"
    - trigger: time_pattern
      minutes: "/5"
      seconds: 31
    - trigger: homeassistant
      event: start
  conditions:
    - condition: state
      entity_id: binary_sensor.mom_s_room_thermometer_fault
      state: "off"
    - condition: state
      entity_id: binary_sensor.mom_s_room_hygrometer_fault
      state: "off"
    - condition: state
      entity_id: input_select.season_mode
      state: "Summer"
      for:
        minutes: 20
  actions:
    - choose:
        - conditions:
            - condition: state
              entity_id: binary_sensor.mom_s_room_temperature_high
              state: "on"
            - not:
                - condition: state
                  entity_id: climate.mom_s_room_ac
                  state: "cool"
          sequence:
            - choose:
                - conditions:
                    - condition: state
                      entity_id: input_boolean.mom_s_room_window_mode
                      state: "on"
                      for:
                        minutes: 10
                  sequence:
                    - event: "mom_s_room_temp_too_high"
                - conditions:
                    - condition: state
                      entity_id: input_boolean.mom_s_room_window_mode
                      state: "off"
                      for:
                        minutes: 10
                  sequence:
                    - action: climate.set_temperature
                      target:
                        entity_id: climate.mom_s_room_ac
                      data:
                        hvac_mode: "cool"
                        temperature: "{{ int(states('input_number.mom_s_room_temperature_target')) }}"
                    - action: notify.all_devices
                      data:
                        message: >-
                          Turned on Mom’s Room AC Cool.
                          Current: {{ states('sensor.mom_s_room_thermometer_primary_temperature') }}°C
                        data:
                          push:
                            interruption-level: time-sensitive
                          url: "/lovelace/overview"
                    - delay:
                        hours: 2
        - conditions:
            - condition: state
              entity_id: binary_sensor.mom_s_room_humidity_high
              state: "on"
            - condition: state
              entity_id: binary_sensor.mom_s_room_temperature_high
              state: "off"
            - not:
                - condition: state
                  entity_id: climate.mom_s_room_ac
                  state:
                    - "fan_only"
                    - "dry"
          sequence:
            - choose:
                - conditions:
                    - condition: state
                      entity_id: input_boolean.mom_s_room_window_mode
                      state: "on"
                      for:
                        minutes: 10
                  sequence:
                    - event: "mom_s_room_humidity_too_high"
                - conditions:
                    - condition: state
                      entity_id: input_boolean.mom_s_room_window_mode
                      state: "off"
                      for:
                        minutes: 10
                  sequence:
                    - action: climate.set_hvac_mode
                      target:
                        entity_id: climate.mom_s_room_ac
                      data:
                        hvac_mode: "dry"
                    - action: notify.all_devices
                      data:
                        message: >-
                          Turned on Mom’s Room AC Dry.
                          Current: {{ states('sensor.mom_s_room_thermometer_primary_humidity') }}%
                        data:
                          push:
                            interruption-level: time-sensitive
                          url: "/lovelace/overview"
                    - delay:
                        hours: 2
        - conditions:
            - condition: state
              entity_id: binary_sensor.mom_s_room_humidity_low
              state: "on"
              for:
                hours: 1
            - condition: state
              entity_id: binary_sensor.mom_s_room_temperature_low
              state: "on"
              for:
                hours: 1
            - condition: state
              entity_id: binary_sensor.mom_s_room_ac_cooldry
              state: "on"
              for:
                hours: 1
          sequence:
            - action: climate.turn_off
              target:
                entity_id: climate.mom_s_room_ac
            - action: notify.all_devices
              data:
                message: >-
                  Turned off Mom’s Room AC.
                  Current: {{ states('sensor.mom_s_room_thermometer_primary_temperature') }}°C, 
                  {{ states('sensor.mom_s_room_thermometer_primary_humidity') }}%
                data:
                  push:
                    interruption-level: time-sensitive
                  url: "/lovelace/overview"
            - delay:
                hours: 2
  trace:
    stored_traces: 100
- id: automation.toggle_mom_s_room_ac_heat
  alias: "Toggle AC Heat"
  triggers:
    - trigger: state
      entity_id:
        - input_number.mom_s_room_temperature_target
