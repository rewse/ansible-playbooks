- id: automation.adjust_mom_s_room_ac_temp
  alias: "Adjust Mom’s Room AC Temperature"
  triggers:
    - trigger: state
      entity_id: input_number.mom_s_room_temperature_target
    - trigger: time_pattern
      minutes: "/5"
      seconds: 21
    - trigger: homeassistant
      event: start
  conditions:
    - condition: state
      entity_id: binary_sensor.mom_s_room_thermometer_fault
      state: "off"
    - condition: state
      entity_id: binary_sensor.mom_s_room_hygrometer_fault
      state: "off"
    - condition: state
      entity_id: climate.mom_s_room_ac
      state:
        - "cool"
        - "heat"
      for:
        minutes: 9
  actions:
    - choose:
        - conditions:
            - >-
              {{
                float(states('sensor.mom_s_room_thermometer_primary_temperature')) -
                float(states('input_number.mom_s_room_temperature_target')) < -0.5
              }}
          sequence:
            - action: climate.set_temperature
              target:
                entity_id: climate.mom_s_room_ac
              data:
                temperature: "{{ int(states('sensor.mom_s_room_ac_temperature')) + 1 }}"
            - delay:
                minutes: 9
        - conditions:
            - >-
              {{
                float(states('sensor.mom_s_room_thermometer_primary_temperature')) -
                float(states('input_number.mom_s_room_temperature_target')) > 0.5
              }}
          sequence:
            - action: climate.set_temperature
              target:
                entity_id: climate.mom_s_room_ac
              data:
                temperature: "{{ int(states('sensor.mom_s_room_ac_temperature')) - 1 }}"
            - delay:
                minutes: 9
  trace:
    stored_traces: 100
- id: automation.change_mom_s_room_ac_from_heatcool
  alias: "Change AC from HeatCool"
  triggers:
    - trigger: state
      entity_id: climate.mom_s_room_ac
      to: "heat_cool"
  conditions:
    - condition: state
      entity_id: binary_sensor.mom_s_room_thermometer_fault
      state: "off"
    - condition: state
      entity_id: binary_sensor.mom_s_room_hygrometer_fault
      state: "off"
  actions:
    - choose:
        - conditions:
            - condition: state
              entity_id: input_select.season_mode
              state: "Summer"
            - >-
              {{
                float(states('sensor.mom_s_room_thermometer_primary_humidity')) >
                float(states('input_number.mom_s_room_humidity_target_present_summer')) +
                float(states('input_number.mom_s_room_humidity_maximum_difference_present_summer'))
              }}
            - >-
              {{
                float(states('sensor.mom_s_room_thermometer_primary_temperature')) <
                float(states('input_number.mom_s_room_temperature_target_present_summer')) -
                float(states('input_number.mom_s_room_temperature_minimum_difference_present_summer'))
              }}
          sequence:
            - action: climate.set_hvac_mode
              target:
                entity_id: climate.mom_s_room_ac
              data:
                hvac_mode: dry
        - conditions:
            - condition: state
              entity_id: input_select.season_mode
              state: "Summer"
          sequence:
            - action: climate.set_hvac_mode
              target:
                entity_id: climate.mom_s_room_ac
              data:
                hvac_mode: cool
            - action: climate.set_temperature
              target:
                entity_id: climate.mom_s_room_ac
              data:
                temperature: "{{ int(states('input_number.mom_s_room_temperature_target_present_summer')) }}"
        - conditions:
            - condition: state
              entity_id: input_select.season_mode
              state: "Winter"
          sequence:
            - action: climate.set_hvac_mode
              target:
                entity_id: climate.mom_s_room_ac
              data:
                hvac_mode: heat
            - action: climate.set_temperature
              target:
                entity_id: climate.mom_s_room_ac
              data:
                temperature: "{{ int(states('input_number.mom_s_room_temperature_target_present_winter')) }}"
  trace:
    stored_traces: 100
- id: automation.change_mom_s_room_ac_fan_mode
  alias: "Change AC Fan Mode"
  triggers:
    - trigger: state
      entity_id: climate.mom_s_room_ac
      not_to:
        - "off"
    - trigger: state
      entity_id: input_select.time_mode
  actions:
    - delay:
        seconds: 3
    - if:
        - condition: state
          entity_id: input_select.time_mode
          state:
            - "Late Night"
            - "Midnight"
      then:
        - action: climate.set_fan_mode
          target:
            entity_id: climate.mom_s_room_ac
          data:
            fan_mode: "Silence"
      else:
        - action: climate.set_fan_mode
          target:
            entity_id: climate.mom_s_room_ac
          data:
            fan_mode: "Auto"
  trace:
    stored_traces: 100
- id: automation.change_mom_s_room_ac_mode
  alias: "Change AC Mode"
  triggers:
    - trigger: time_pattern
      minutes: "/5"
      seconds: 14
    - trigger: homeassistant
      event: start
  conditions:
    - condition: state
      entity_id: binary_sensor.mom_s_room_thermometer_fault
      state: "off"
    - condition: state
      entity_id: binary_sensor.mom_s_room_hygrometer_fault
      state: "off"
    - condition: state
      entity_id: climate.mom_s_room_ac
      state:
        - "cool"
        - "dry"
      for:
        minutes: 10
  actions:
    - choose:
        - conditions:
            - condition: state
              entity_id: climate.mom_s_room_ac
              state: "dry"
            - or:
                - and:
                    - >-
                        {{
                          float(states('sensor.mom_s_room_thermometer_primary_temperature')) <
                          float(states('input_number.mom_s_room_temperature_target'))
                        }}
                    - >-
                        {{
                          float(states('sensor.mom_s_room_thermometer_primary_humidity')) <
                          float(states('input_number.mom_s_room_humidity_target'))
                        }}
                - and:
                    - >-
                        {{
                          float(states('sensor.mom_s_room_thermometer_primary_temperature')) <
                          float(states('input_number.mom_s_room_temperature_target'))
                        }}
                    - >-
                        {{
                          float(states('sensor.mom_s_room_thermometer_primary_humidity')) >
                          float(states('input_number.mom_s_room_humidity_target'))
                        }}
                    - >-
                        {{
                          (
                            float(states('input_number.mom_s_room_temperature_target')) -
                            float(states('sensor.mom_s_room_thermometer_primary_temperature'))
                          ) / float(states('input_number.mom_s_room_temperature_minimum_difference')) >
                          (
                            float(states('sensor.mom_s_room_thermometer_primary_humidity')) -
                            float(states('input_number.mom_s_room_humidity_target'))
                          ) / float(states('input_number.mom_s_room_humidity_maximum_difference'))
                        }}
          sequence:
            - action: climate.set_hvac_mode
              target:
                entity_id: climate.mom_s_room_ac
              data:
                hvac_mode: "cool"
            - delay:
                seconds: 5
            - action: climate.set_temperature
              target:
                entity_id: climate.mom_s_room_ac
              data:
                temperature: "{{ int(states('sensor.mom_s_room_ac_temperature')) + 1 }}"
            - delay:
                minutes: 29
        - conditions:
            - >-
              {{
                float(states('sensor.mom_s_room_thermometer_primary_temperature')) >
                float(states('input_number.mom_s_room_temperature_target'))
              }}
            - >-
              {{
                (
                  float(states('sensor.mom_s_room_thermometer_primary_temperature')) -
                  float(states('input_number.mom_s_room_temperature_target'))
                ) / float(states('input_number.mom_s_room_temperature_maximum_difference')) >
                (
                  float(states('sensor.mom_s_room_thermometer_primary_humidity')) -
                  float(states('input_number.mom_s_room_humidity_target'))
                ) / float(states('input_number.mom_s_room_humidity_maximum_difference'))
              }}
          sequence:
            - action: climate.set_hvac_mode
              target:
                entity_id: climate.mom_s_room_ac
              data:
                hvac_mode: "cool"
            - delay:
                minutes: 29
        - conditions:
            - >-
              {{
                float(states('sensor.mom_s_room_thermometer_primary_humidity')) >
                float(states('input_number.mom_s_room_humidity_target'))
              }}
            - >-
              {{
                (
                  float(states('sensor.mom_s_room_thermometer_primary_temperature')) -
                  float(states('input_number.mom_s_room_temperature_target'))
                ) / float(states('input_number.mom_s_room_temperature_maximum_difference')) <
                (
                  float(states('sensor.mom_s_room_thermometer_primary_humidity')) -
                  float(states('input_number.mom_s_room_humidity_target'))
                ) / float(states('input_number.mom_s_room_humidity_maximum_difference'))
              }}
          sequence:
            - action: climate.set_hvac_mode
              target:
                entity_id: climate.mom_s_room_ac
              data:
                hvac_mode: "dry"
            - delay:
                minutes: 29
  trace:
    stored_traces: 100
- id: automation.notify_mom_s_room_climate
  alias: "Notify Climate"
  triggers:
    - trigger: event
      event_type: "mom_s_room_humidity_too_high"
      id: "mom_s_room_humidity_too_high"
    - trigger: event
      event_type: "mom_s_room_humidity_too_low"
      id: "mom_s_room_humidity_too_low"
    - trigger: event
      event_type: "mom_s_room_temp_too_high"
      id: "mom_s_room_temp_too_high"
    - trigger: event
      event_type: "mom_s_room_temp_too_low"
      id: "mom_s_room_temp_too_low"
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: "mom_s_room_humidity_too_high"
          sequence:
            - action: notify.all_devices
              data:
                message: >-
                  Mom’s Room Humidity is Too High.
                  Current: {{ states('sensor.mom_s_room_thermometer_primary_humidity') }}%
                data:
                  push:
                    interruption-level: time-sensitive
                  url: "/lovelace/overview"
            - delay:
                hours: 2
        - conditions:
            - condition: trigger
              id: "mom_s_room_humidity_too_low"
          sequence:
            - action: notify.all_devices
              data:
                message: >-
                  Mom’s Room Humidity is Too Low.
                  Current: {{ states('sensor.mom_s_room_thermometer_primary_humidity') }}%
                data:
                  push:
                    interruption-level: time-sensitive
                  url: "/lovelace/overview"
            - delay:
                hours: 2
        - conditions:
            - condition: trigger
              id: "mom_s_room_temp_too_high"
          sequence:
            - action: notify.all_devices
              data:
                message: >-
                  Mom’s Room Temperature is Too High.
                  Current: {{ states('sensor.mom_s_room_thermometer_primary_temperature') }}°C
                data:
                  push:
                    interruption-level: time-sensitive
                  url: "/lovelace/overview"
            - delay:
                hours: 2
        - conditions:
            - condition: trigger
              id: "mom_s_room_temp_too_low"
          sequence:
            - action: notify.all_devices
              data:
                message: >-
                  Mom’s Room Temperature is Too Low.
                  Current: {{ states('sensor.mom_s_room_thermometer_primary_temperature') }}°C
                data:
                  push:
                    interruption-level: time-sensitive
                  url: "/lovelace/overview"
            - delay:
                hours: 2
  trace:
    stored_traces: 100
- id: automation.plan_to_turn_on_mom_s_room_ac_internal_clean
  alias: "Plan to Turn on AC Internal Clean"
  triggers:
    - trigger: state
      entity_id: climate.mom_s_room_ac
      to:
        - "cool"
        - "dry"
      for:
        minutes: 5
  actions:
    - action: automation.turn_on
      target:
        entity_id:
          - automation.mom_s_room_turn_on_ac_internal_clean
  trace:
    stored_traces: 100
- id: automation.recover_mom_s_room_ac_manual_internal_clean
  alias: "Recover from AC Manual Internal Clean"
  triggers:
    - trigger: time
      at: input_datetime.mom_s_room_ac_manual_internal_clean
  actions:
    - action: automation.turn_on
      target:
        entity_id:
          - automation.mom_s_room_adjust_ac_temperature
          - automation.mom_s_room_change_ac_mode
          - automation.mom_s_room_toggle_ac_cooldry
          - automation.mom_s_room_toggle_ac_heat
  trace:
    stored_traces: 100
- id: automation.select_mom_s_room_climate_mode
  alias: "Select Climate Mode"
  triggers:
    - trigger: state
      entity_id:
        - input_select.season_mode
        - input_select.time_mode
    - trigger: state
      entity_id: input_boolean.mom_s_room_presence_mode
      for:
        minutes: "{{ states('input_number.mom_s_room_presence_sensitivity_minutes') }}"
    - trigger: state
      entity_id: input_boolean.mom_s_room_presence_mode
      to: "off"
      for:
        minutes: "{{ states('input_number.mom_s_room_climate_auto_off_minutes') }}"
    - trigger: state
      entity_id: input_boolean.mom_s_room_window_mode
      to: "on"
      for:
        minutes: "{{ states('input_number.mom_s_room_climate_auto_off_minutes_ventilated') }}"
    - trigger: state
      entity_id: input_boolean.mom_s_room_window_mode
      to: "off"
    - trigger: homeassistant
      event: start
  actions:
    - choose:
        - conditions:
            - condition: state
              entity_id: input_boolean.mom_s_room_window_mode
              state: "on"
              for:
                minutes: "{{ states('input_number.mom_s_room_climate_auto_off_minutes_ventilated') }}"
          sequence:
            - action: input_select.select_option
              target:
                entity_id: input_select.mom_s_room_climate_mode
              data:
                option: "Ventilated"
        - conditions:
            - condition: state
              entity_id: input_boolean.mom_s_room_presence_mode
              state: "on"
              for:
                minutes: "{{ states('input_number.mom_s_room_presence_sensitivity_minutes') }}"
            - condition: state
              entity_id: input_select.season_mode
              state: "Summer"
            - not:
                - condition: state
                  entity_id: input_select.time_mode
                  state:
                    - "Midnight"
                    - "Dark"
          sequence:
            - action: input_select.select_option
              target:
                entity_id: input_select.mom_s_room_climate_mode
              data:
                option: "Present Summer"
        - conditions:
            - condition: state
              entity_id: input_boolean.mom_s_room_presence_mode
              state: "on"
              for:
                minutes: "{{ states('input_number.mom_s_room_presence_sensitivity_minutes') }}"
            - condition: state
              entity_id: input_select.season_mode
              state: "Winter"
            - not:
                - condition: state
                  entity_id: input_select.time_mode
                  state:
                    - "Midnight"
                    - "Dark"
          sequence:
            - action: input_select.select_option
              target:
                entity_id: input_select.mom_s_room_climate_mode
              data:
                option: "Present Winter"
        - conditions:
            - condition: state
              entity_id: input_boolean.mom_s_room_presence_mode
              state: "on"
              for:
                minutes: "{{ states('input_number.mom_s_room_presence_sensitivity_minutes') }}"
            - condition: state
              entity_id: input_select.season_mode
              state: "Summer"
            - condition: state
              entity_id: input_select.time_mode
              state:
                - "Midnight"
                - "Dark"
          sequence:
            - action: input_select.select_option
              target:
                entity_id: input_select.mom_s_room_climate_mode
              data:
                option: "Present Summer Midnight"
        - conditions:
            - condition: state
              entity_id: input_boolean.mom_s_room_presence_mode
              state: "on"
              for:
                minutes: "{{ states('input_number.mom_s_room_presence_sensitivity_minutes') }}"
            - condition: state
              entity_id: input_select.season_mode
              state: "Winter"
            - condition: state
              entity_id: input_select.time_mode
              state:
                - "Midnight"
                - "Dark"
          sequence:
            - action: input_select.select_option
              target:
                entity_id: input_select.mom_s_room_climate_mode
              data:
                option: "Present Winter Midnight"
        - conditions:
            - or:
                - and:
                    - condition: state
                      entity_id: climate.mom_s_room_ac
                      state:
                        - "fan_only"
                        - "off"
                    - condition: state
                      entity_id: input_boolean.mom_s_room_presence_mode
                      state: "off"
                      for:
                        minutes: "{{ states('input_number.mom_s_room_presence_sensitivity_minutes') }}"
                    - condition: state
                      entity_id: input_select.season_mode
                      state: "Summer"
                - and:
                    - condition: state
                      entity_id: climate.mom_s_room_ac
                      state:
                        - "cool"
                        - "dry"
                        - "heat"
                    - condition: state
                      entity_id: input_boolean.mom_s_room_presence_mode
                      state: "off"
                      for:
                        minutes: "{{ states('input_number.mom_s_room_climate_auto_off_minutes') }}"
                    - condition: state
                      entity_id: input_select.season_mode
                      state: "Summer"
          sequence:
            - action: input_select.select_option
              target:
                entity_id: input_select.mom_s_room_climate_mode
              data:
                option: "Absent Summer"
        - conditions:
            - or:
                - and:
                    - condition: state
                      entity_id: climate.mom_s_room_ac
                      state: "off"
                    - condition: state
                      entity_id: input_boolean.mom_s_room_presence_mode
                      state: "off"
                      for:
                        minutes: "{{ states('input_number.mom_s_room_presence_sensitivity_minutes') }}"
                    - condition: state
                      entity_id: input_select.season_mode
                      state: "Winter"
                - and:
                    - condition: state
                      entity_id: climate.mom_s_room_ac
                      state:
                        - "cool"
                        - "dry"
                        - "heat"
                    - condition: state
                      entity_id: input_boolean.mom_s_room_presence_mode
                      state: "off"
                      for:
                        minutes: "{{ states('input_number.mom_s_room_climate_auto_off_minutes') }}"
                    - condition: state
                      entity_id: input_select.season_mode
                      state: "Winter"
          sequence:
            - action: input_select.select_option
              target:
                entity_id: input_select.mom_s_room_climate_mode
              data:
                option: "Absent Winter"
  trace:
    stored_traces: 100
- id: automation.select_mom_s_room_humiture_target
  alias: "Select Humiture Target"
  triggers:
    - trigger: state
      entity_id:
        - input_select.mom_s_room_climate_mode
        - input_number.mom_s_room_temperature_target_present_summer
        - input_number.mom_s_room_temperature_target_present_winter
        - input_number.mom_s_room_temperature_target_present_summer_midnight
        - input_number.mom_s_room_temperature_target_present_winter_midnight
        - input_number.mom_s_room_temperature_target_absent_winter
        - input_number.mom_s_room_humidity_target_present_summer
        - input_number.mom_s_room_humidity_target_present_winter
        - input_number.mom_s_room_humidity_target_present_summer_midnight
        - input_number.mom_s_room_humidity_target_present_winter_midnight
        - input_number.mom_s_room_humidity_target_absent_winter
        - input_number.mom_s_room_temperature_maximum_difference_present_summer
        - input_number.mom_s_room_temperature_maximum_difference_present_winter
        - input_number.mom_s_room_temperature_maximum_difference_present_summer_midnight
        - input_number.mom_s_room_temperature_maximum_difference_present_winter_midnight
        - input_number.mom_s_room_temperature_maximum_difference_absent_winter
        - input_number.mom_s_room_humidity_maximum_difference_present_summer
        - input_number.mom_s_room_humidity_maximum_difference_present_winter
        - input_number.mom_s_room_humidity_maximum_difference_present_summer_midnight
        - input_number.mom_s_room_humidity_maximum_difference_present_winter_midnight
        - input_number.mom_s_room_humidity_maximum_difference_absent_winter
        - input_number.mom_s_room_temperature_minimum_difference_present_summer
        - input_number.mom_s_room_temperature_minimum_difference_present_winter
        - input_number.mom_s_room_temperature_minimum_difference_present_summer_midnight
        - input_number.mom_s_room_temperature_minimum_difference_present_winter_midnight
        - input_number.mom_s_room_temperature_minimum_difference_absent_winter
        - input_number.mom_s_room_humidity_minimum_difference_present_summer
        - input_number.mom_s_room_humidity_minimum_difference_present_winter
        - input_number.mom_s_room_humidity_minimum_difference_present_summer_midnight
        - input_number.mom_s_room_humidity_minimum_difference_present_winter_midnight
        - input_number.mom_s_room_humidity_minimum_difference_absent_winter
    - trigger: state
      entity_id:
        - input_number.mom_s_room_temperature_maximum_difference
        - input_number.mom_s_room_humidity_maximum_difference
        - input_number.mom_s_room_temperature_minimum_difference
        - input_number.mom_s_room_humidity_minimum_difference
        - input_number.mom_s_room_temperature_target
        - input_number.mom_s_room_humidity_target
      for:
        hours: 2
    - trigger: homeassistant
      event: start
  actions:
    - choose:
        - conditions:
            - condition: state
              entity_id: input_select.mom_s_room_climate_mode
              state: "Present Summer"
          sequence:
            repeat:
              for_each:
                - src: input_number.mom_s_room_temperature_maximum_difference_present_summer
                  dest: input_number.mom_s_room_temperature_maximum_difference
                - src: input_number.mom_s_room_humidity_maximum_difference_present_summer
                  dest: input_number.mom_s_room_humidity_maximum_difference
                - src: input_number.mom_s_room_temperature_minimum_difference_present_summer
                  dest: input_number.mom_s_room_temperature_minimum_difference
                - src: input_number.mom_s_room_humidity_minimum_difference_present_summer
                  dest: input_number.mom_s_room_humidity_minimum_difference
                - src: input_number.mom_s_room_temperature_target_present_summer
                  dest: input_number.mom_s_room_temperature_target
                - src: input_number.mom_s_room_humidity_target_present_summer
                  dest: input_number.mom_s_room_humidity_target
              sequence:
                - action: input_number.set_value
                  target:
                    entity_id: "{{ repeat.item.dest }}"
                  data:
                    value: "{{ states(repeat.item.src) }}"
        - conditions:
            - condition: state
              entity_id: input_select.mom_s_room_climate_mode
              state: "Present Winter"
          sequence:
            repeat:
              for_each:
                - src: input_number.mom_s_room_temperature_maximum_difference_present_winter
                  dest: input_number.mom_s_room_temperature_maximum_difference
                - src: input_number.mom_s_room_humidity_maximum_difference_present_winter
                  dest: input_number.mom_s_room_humidity_maximum_difference
                - src: input_number.mom_s_room_temperature_minimum_difference_present_winter
                  dest: input_number.mom_s_room_temperature_minimum_difference
                - src: input_number.mom_s_room_humidity_minimum_difference_present_winter
                  dest: input_number.mom_s_room_humidity_minimum_difference
                - src: input_number.mom_s_room_temperature_target_present_winter
                  dest: input_number.mom_s_room_temperature_target
                - src: input_number.mom_s_room_humidity_target_present_winter
                  dest: input_number.mom_s_room_humidity_target
              sequence:
                - action: input_number.set_value
                  target:
                    entity_id: "{{ repeat.item.dest }}"
                  data:
                    value: "{{ states(repeat.item.src) }}"
        - conditions:
            - condition: state
              entity_id: input_select.mom_s_room_climate_mode
              state: "Present Summer Midnight"
          sequence:
            repeat:
              for_each:
                - src: input_number.mom_s_room_temperature_maximum_difference_present_summer_midnight
                  dest: input_number.mom_s_room_temperature_maximum_difference
                - src: input_number.mom_s_room_humidity_maximum_difference_present_summer_midnight
