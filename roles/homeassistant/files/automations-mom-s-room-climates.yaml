          sequence:
            repeat:
              for_each:
                - src: input_number.mom_s_room_temperature_maximum_difference_absent_winter
                  dest: input_number.mom_s_room_temperature_maximum_difference
                - src: input_number.mom_s_room_humidity_maximum_difference_absent_winter
                  dest: input_number.mom_s_room_humidity_maximum_difference
                - src: input_number.mom_s_room_temperature_minimum_difference_absent_winter
