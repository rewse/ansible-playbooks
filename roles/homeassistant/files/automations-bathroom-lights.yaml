- id: automation.bathroom_push_1_button_switch
  alias: "Push 1-Button Switch"
  triggers:
    - trigger: state
      entity_id: event.bathroom_1_button_switch
  actions:
    - choose:
        - conditions:
            - condition: state
              entity_id: event.bathroom_1_button_switch
              attribute: event_type
              state: "multi_press_1"
          sequence:
            - action: input_select.select_option
              target: 
                entity_id: input_select.bathroom_light_remote_mode
              data:
                option: "Turned on"
        - conditions:
            - condition: state
              entity_id: event.bathroom_1_button_switch
              attribute: event_type
              state: "multi_press_2"
          sequence:
            - action: input_select.select_option
              target: 
                entity_id: input_select.bathroom_light_remote_mode
              data:
                option: "Turned off"
  trace:
    stored_traces: 100
- id: automation.bathroom_select_light_mode
  alias: "Select Light Mode"
  triggers:
    - trigger: state
      entity_id: input_select.bathroom_light_remote_mode
    - trigger: state
      entity_id: light.bathroom_light_middle
      to: "off"
  actions:
    - choose:
        - conditions:
            - condition: state
              entity_id: input_select.bathroom_light_remote_mode
              state: "Turned on"
          sequence:
            - action: input_select.select_option
              target: 
                entity_id: input_select.bathroom_light_mode
              data:
                option: "Turned on Arise"
        - conditions:
            - condition: state
              entity_id: input_select.bathroom_light_remote_mode
              state: "Turned off"
          sequence:
            - action: input_select.select_option
              target: 
                entity_id: input_select.bathroom_light_mode
              data:
                option: "Turned on Natural Light"
        - conditions:
            - condition: state
              entity_id: light.bathroom_light_middle
              state: "off"
          sequence:
            - action: input_select.select_option
              target: 
                entity_id: input_select.bathroom_light_mode
              data:
                option: "Dark"
  trace:
    stored_traces: 100
- id: automation.bathroom_select_scene
  alias: "Select Scene"
  triggers:
    - trigger: state
      entity_id: input_select.bathroom_light_mode
    - trigger: state
      entity_id: input_select.bathroom_scene
      for:
        hours: 1
    - trigger: homeassistant
      event: start
  actions:
    - choose:
        - conditions:
            - condition: state
              entity_id: input_select.bathroom_light_mode
              state:
                - "Turned on Arise"
          sequence:
            - action: input_select.select_option
              target: 
                entity_id: input_select.bathroom_scene
              data:
                option: "scene.bathroom_light_group_arise"
        - conditions:
            - condition: state
              entity_id: input_select.bathroom_light_mode
              state:
                - "Turned on Natural Light"
          sequence:
            - action: input_select.select_option
              target: 
                entity_id: input_select.bathroom_scene
              data:
                option: "scene.bathroom_light_group_natural_light"
        - conditions:
            - condition: state
              entity_id: input_select.bathroom_light_mode
              state:
                - "Dark"
          sequence:
            - action: input_select.select_option
              target: 
                entity_id: input_select.bathroom_scene
              data:
                option: "scene.bathroom_dark"
  trace:
    stored_traces: 100
- id: automation.bathroom_turn_on_scene
  alias: "Turn on Scene"
  triggers:
    - trigger: state
      entity_id: input_select.bathroom_scene
  actions:
    - action: scene.turn_on
      target: 
        entity_id: "{{ states('input_select.bathroom_scene') }}"
    - delay:
        seconds: 1
    - action: input_select.select_option
      target: 
        entity_id: input_select.bathroom_light_remote_mode
      data:
        option: "Idle"
  mode: restart
  trace:
    stored_traces: 100
