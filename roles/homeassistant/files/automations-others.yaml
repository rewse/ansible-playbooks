# Records when the last cleaning started. Waiting 30 minutes skips runs that stop
# early, which do not count as a cleaning.
- id: automation.record_roomba_combo_last_cleaning
  alias: "Record Roomba Combo Last Cleaning"
  triggers:
    - trigger: state
      entity_id: vacuum.roomba_combo
      to: cleaning
      for:
        minutes: 30
  actions:
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.roomba_combo_last_cleaning
      data:
        timestamp: "{{ trigger.to_state.last_changed.timestamp() }}"
  mode: single
  trace:
    stored_traces: 100
- id: automation.start_roomba_combo
  alias: "Start Roomba Combo"
  triggers:
    - trigger: time_pattern
      minutes: "/5"
      seconds: 8
  conditions:
    - condition: state
      entity_id:
        - person.shibata_tats
        - person.shibata_akiko
        - person.shibata_kayano
      state: not_home
      for:
        minutes: 10
    - condition: state
      entity_id: vacuum.roomba_combo
      state: docked
    - "{{ states('sensor.roomba_combo_battery') | int(0) >= 50 }}"
    - >-
      {{
        now().timestamp() -
        state_attr('input_datetime.roomba_combo_last_cleaning', 'timestamp')
        >= 2 * 86400
      }}
  actions:
    - action: vacuum.start
      target:
        entity_id: vacuum.roomba_combo
    - action: notify.tats_devices
      data:
        message: "Start Roomba Combo"
        data:
          push:
            interruption-level: time-sensitive
  trace:
    stored_traces: 100
