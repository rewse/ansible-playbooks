- id: automation.balcony_alarm_humidity_difference
  alias: "ALARM: Humidity Difference"
  triggers:
    - trigger: state
      entity_id: sensor.balcony_thermometer_secondary_humidity
  conditions:
    - condition: numeric_state
      entity_id:
        - sensor.balcony_humidity_difference
        - sensor.balcony_humidity_difference_average
      above: 10
  actions:
    - action: notify.tats_devices
      data:
        title: "⚠️ ALARM"
        message: >-
          Balcony Humidity Difference is Too Large.
          Current: {{ states('sensor.balcony_thermometer_primary_humidity') }}% /
          {{ states('sensor.balcony_thermometer_secondary_humidity') }}%
        data:
          push:
            interruption-level: time-sensitive
          url: "/lovelace/overview"
    - delay:
        hours: 8
  trace:
    stored_traces: 100
- id: automation.balcony_alarm_temperature_difference
  alias: "ALARM: Balcony Temperature Difference"
  triggers:
    - trigger: state
      entity_id: sensor.balcony_thermometer_secondary_temperature
  conditions:
    - condition: numeric_state
      entity_id:
        - sensor.balcony_temperature_difference
        - sensor.balcony_temperature_difference_average
      above: 10
  actions:
    - action: notify.tats_devices
      data:
        title: "⚠️ ALARM"
        message: >-
          Balcony Temperature Difference is Too Large.
          Current: {{ states('sensor.balcony_thermometer_primary_temperature') }}°C /
          {{ states('sensor.balcony_thermometer_secondary_temperature') }}°C
        data:
          push:
            interruption-level: time-sensitive
          url: "/lovelace/overview"
    - delay:
        hours: 8
  trace:
    stored_traces: 100
