<VirtualHost *:443>
    ServerAdmin hostmaster@rewse.jp
    ServerName hass.rewse.jp

    # Without this the vhost is not an SSL vhost, so a TLS request for this name
    # is served by the default one instead and answers with its content.
    SSLEngine on

    ProxyPreserveHost on
    ProxyRequests off
    # Tesla reads the public key from this fixed path on the domain the Fleet
    # partner account is registered under, so it is served from disk instead of
    # being proxied. The exclusion precedes ProxyPass / because mod_proxy takes
    # the first matching rule.
    ProxyPass /.well-known/appspecific/com.tesla.3p.public-key.pem !
    ProxyPass / http://localhost:8123/
    ProxyPassReverse / http://localhost:8123/
    ProxyPass /api/websocket ws://localhost:8123/api/websocket
    ProxyPassReverse /api/websocket ws://localhost:8123/api/websocket

    Alias /.well-known/appspecific/com.tesla.3p.public-key.pem /srv/www/tesla/com.tesla.3p.public-key.pem

    # Home Assistant sets Referrer-Policy, X-Content-Type-Options and
    # X-Frame-Options on the responses it builds, but not on every error page
    # its server or a proxied integration returns. Its copy is in the onsuccess
    # table, so it is dropped there and the always table sets each header once
    # on every response, including errors and the Tesla public key.
    Header unset Referrer-Policy
    Header unset X-Content-Type-Options
    Header unset X-Frame-Options
    Header always set Referrer-Policy "no-referrer"
    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"

    RewriteEngine on
    # Home Assistant's aiohttp server decompresses a Brotli request body before
    # authentication, which puts any Brotli decoder flaw such as CVE-2026-111497
    # within reach of unauthenticated clients. No Home Assistant client sends
    # Brotli bodies, so they are refused here. The pattern matches br as a whole
    # coding in the comma-separated list, not as part of another token.
    RewriteCond %{HTTP:Content-Encoding} (^|[,\s])br($|[,\s]) [NC]
    RewriteRule ^ - [F]
    # The Frigate integration serves event media under notifications/ to
    # anyone who knows an event ID, without a Home Assistant session, so that
    # push notifications can show it. No notification here uses those URLs.
    # The instance ID before notifications/ is optional and may contain
    # slashes, as in the integration's routes.
    RewriteRule ^/api/frigate/(?:.+/)?notifications/ - [F,NC]
    # The catch-all rules below proxy with [P], which bypasses the ProxyPass
    # exclusion, so the public key path stops rewriting before reaching them.
    RewriteRule ^/\.well-known/appspecific/com\.tesla\.3p\.public-key\.pem$ - [L]
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*)  ws://localhost:8123/$1 [P,L]
    RewriteCond %{HTTP:Upgrade} !=websocket [NC]
    RewriteRule /(.*)  http://localhost:8123/$1 [P,L]

    SSLCertificateFile /etc/letsencrypt/live/rewse.jp/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/rewse.jp/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
