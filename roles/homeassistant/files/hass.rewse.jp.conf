<VirtualHost *:443>
    ServerAdmin hostmaster@rewse.jp
    ServerName hass.rewse.jp

    # Without this the vhost is not an SSL vhost, so a TLS request for this name
    # is served by the default one instead and answers with its content.
    SSLEngine on

    ProxyPreserveHost on
    ProxyRequests off
    # Tesla reads the public key from this fixed path on the domain the Fleet
    # partner account is registered under, so it is served from disk instead of
    # being proxied. The exclusion precedes ProxyPass / because mod_proxy takes
    # the first matching rule.
    ProxyPass /.well-known/appspecific/com.tesla.3p.public-key.pem !
    ProxyPass / http://localhost:8123/
    ProxyPassReverse / http://localhost:8123/
    ProxyPass /api/websocket ws://localhost:8123/api/websocket
    ProxyPassReverse /api/websocket ws://localhost:8123/api/websocket

    Alias /.well-known/appspecific/com.tesla.3p.public-key.pem /srv/www/tesla/com.tesla.3p.public-key.pem

    RewriteEngine on
    # The catch-all rules below proxy with [P], which bypasses the ProxyPass
    # exclusion, so the public key path stops rewriting before reaching them.
    RewriteRule ^/\.well-known/appspecific/com\.tesla\.3p\.public-key\.pem$ - [L]
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*)  ws://localhost:8123/$1 [P,L]
    RewriteCond %{HTTP:Upgrade} !=websocket [NC]
    RewriteRule /(.*)  http://localhost:8123/$1 [P,L]

    SSLCertificateFile /etc/letsencrypt/live/rewse.jp/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/rewse.jp/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
