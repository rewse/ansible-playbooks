# Balcony

- platform: statistics
  unique_id: sensor.balcony_humidity_difference_average
  name: "Humidity Difference Average"
  entity_id: sensor.balcony_humidity_difference
  state_characteristic: mean
  max_age:
    hours: 8
- platform: statistics
  unique_id: sensor.balcony_temp_average
  name: "Temperature Average"
  entity_id: sensor.balcony_thermometer_primary_temperature
  state_characteristic: mean
  max_age:
    hours: 24
- platform: statistics
  unique_id: sensor.balcony_temp_difference_average
  name: "Temperature Difference Average"
  entity_id: sensor.balcony_temperature_difference
  state_characteristic: mean
  max_age:
    hours: 8

# Dad’s Room

# Provides a stable value for comparison with the paired sensor.
- platform: statistics
  unique_id: sensor.dads_room_humidity_smoothed
  name: "Humidity Smoothed"
  entity_id: sensor.dad_s_room_thermometer_primary_humidity
  state_characteristic: average_step
  max_age:
    hours: 1
- platform: statistics
  unique_id: sensor.dads_room_motion_count
  name: "Motion Count"
  entity_id: binary_sensor.dad_s_room_motion_sensor_motion
  state_characteristic: count
  max_age:
    minutes: 10
# Provides a stable value for comparison with the paired sensor.
- platform: statistics
  unique_id: sensor.dads_room_switchbot_meter_humidity_smoothed
  name: "SwitchBot Meter Humidity Smoothed"
  entity_id: sensor.dad_s_room_thermometer_secondary_humidity
  state_characteristic: average_step
  max_age:
    hours: 1
# Provides a stable value for comparison with the paired sensor.
- platform: statistics
  unique_id: sensor.dads_room_switchbot_meter_temperature_smoothed
  name: "SwitchBot Meter Temperature Smoothed"
  entity_id: sensor.dad_s_room_thermometer_secondary_temperature
  state_characteristic: average_step
  max_age:
    hours: 1
# Provides a stable value for comparison with the paired sensor.
- platform: statistics
  unique_id: sensor.dads_room_temperature_smoothed
  name: "Temperature Smoothed"
  entity_id: sensor.dad_s_room_thermometer_primary_temperature
  state_characteristic: average_step
  max_age:
    hours: 1
- platform: integration
  unique_id: sensor.dads_room_youth_energy_total
  name: "youth Energy Total"
  source: sensor.dad_s_room_youth_power_current_corrected
  unit_prefix: k
  round: 6
  max_sub_interval:
    minutes: 5

