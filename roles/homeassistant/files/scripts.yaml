darken_living_room:
  alias: "Darken Living Room"
  sequence:
    - action: input_select.select_option
      target:
        entity_id: input_select.living_room_light_mode
      data:
        option: "Dark"
    - if:
        - not:
            - condition: state
              entity_id: climate.living_room_ac
              state:
                - "fan_only"
                - "off"
      then:
        - action: climate.turn_off
          target:
            entity_id: climate.living_room_ac
        - action: notify.tats_devices
          data:
            message: "Turned off Living Room AC"
            data:
              push:
                interruption-level: time-sensitive
              url: "/lovelace/overview"
    - if:
        - condition: state
          entity_id:
            - switch.living_room_floor_heater_south_operation_status
            - switch.living_room_floor_heater_north_operation_status
          match: any
          state: "on"
      then:
        - action: switch.turn_off
          target:
            entity_id:
              - switch.living_room_floor_heater_south_operation_status
              - switch.living_room_floor_heater_north_operation_status
        - action: notify.tats_devices
          data:
            message: "Turned off Living Area Floor Heating"
            data:
              push:
                interruption-level: time-sensitive
              url: "/lovelace/overview"
    - if:
        - condition: state
          entity_id: fan.living_room_fan
          state: "on"
      then:
        - action: fan.turn_off
          target:
            entity_id: fan.living_room_fan
        - action: notify.tats_devices
          data:
            message: "Turned off Living Room Fan"
            data:
              push:
                interruption-level: time-sensitive
              url: "/lovelace/overview"
    - if:
        - condition: state
          entity_id: switch.living_room_humidifier
          state: "on"
      then:
        - action: switch.turn_off
          target:
            entity_id: switch.living_room_humidifier
        - action: notify.tats_devices
          data:
            message: "Turned off Living Room Humidifier"
            data:
              push:
                interruption-level: time-sensitive
              url: "/lovelace/overview"
  icon: "mdi:bed"
force_entrance_door:
  alias: "Force Entrance Door"
  sequence:
    - action: lock.unlock
      target:
        entity_id: lock.entrance_locks
  icon: "mdi:lock-alert"
open_entrance_door:
  alias: "Open Entrance Door"
  sequence:
    - if:
        - condition: state
          entity_id:
            - device_tracker.ping_atom
            - device_tracker.ping_ubiqu_personal
            - device_tracker.ping_kijitora
          match: any
          state: home
          for:
            minutes: 10
      then:
        - action: lock.unlock
          target:
            entity_id: lock.entrance_locks
      else:
        - action: notify.all_devices
          data:
            title: "⚠️ ALARM"
            message: "Nobody is in Home"
            data:
              push:
                interruption-level: time-sensitive
  icon: "mdi:door-open"
dad_s_room_prepare_for_ac_manual_internal_clean:
  alias: "Prepare for AC Manual Internal Clean"
  sequence:
    - action: automation.turn_off
      target:
        entity_id:
          - automation.dad_s_room_adjust_ac_temperature
          - automation.dad_s_room_change_ac_mode
          - automation.dad_s_room_toggle_ac_cooldry
          - automation.dad_s_room_toggle_ac_heat
          - automation.dad_s_room_turn_on_ac_internal_clean
    - action: climate.turn_off
      target:
        entity_id: climate.dad_s_room_ac
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.dad_s_room_ac_manual_internal_clean
      data:
        datetime: "{{ now() + timedelta(hours = 3) }}"
  icon: "mdi:robot-off"
