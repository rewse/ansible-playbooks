---
- id: automation.refresh_tesla_fleet_data
  alias: "Refresh Tesla Fleet Data"
  triggers:
    - trigger: time_pattern
      minutes: "/30"
      seconds: 43
  actions:
    - action: homeassistant.update_entity
      target:
        entity_id: sensor.model_y_battery_level
  mode: single
  trace:
    stored_traces: 100
