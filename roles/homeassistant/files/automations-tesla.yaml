---
# Keeps Sentry Mode off while the car enables it automatically and its setting
# cannot be changed in the car, such as while the car is at a repair shop.
- id: automation.disable_tesla_sentry
  alias: "Disable Tesla Sentry"
  triggers:
    - trigger: state
      entity_id: switch.model_y_sentry_mode
      to: "on"
  actions:
    - action: switch.turn_off
      target:
        entity_id: switch.model_y_sentry_mode
  mode: single
  trace:
    stored_traces: 100

- id: automation.enable_tesla_sentry_at_tns_azabudai_3_chome
  alias: "Enable Tesla Sentry at TNS Azabudai 3-chome"
  triggers:
    - trigger: state
      entity_id: binary_sensor.model_y_user
      from: "on"
      to: "off"
      for:
        minutes: 3
  conditions:
    - condition: state
      entity_id: sensor.model_y_geofence
      state: "TNS Azabudai 3-chome"
    - condition: not
      conditions:
        - condition: state
          entity_id: binary_sensor.model_y_sentry_mode
          state: "on"
  actions:
    - action: switch.turn_on
      target:
        entity_id: switch.model_y_sentry_mode
  mode: single
  trace:
    stored_traces: 100

- id: automation.refresh_tesla_fleet_data
  alias: "Refresh Tesla Fleet Data"
  triggers:
    - trigger: template
      value_template: >-
        {{ states('sensor.model_y_state') in ['Online', 'Driving', 'Charging'] }}
    - trigger: time_pattern
      minutes: "/10"
      seconds: 43
  conditions:
    - condition: template
      value_template: >-
        {{ states('sensor.model_y_state') in ['Online', 'Driving', 'Charging'] }}
  actions:
    - action: homeassistant.update_entity
      target:
        entity_id: climate.model_y_climate
  mode: single
  trace:
    stored_traces: 100
