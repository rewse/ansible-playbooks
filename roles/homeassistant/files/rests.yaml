# Others

- resource: "https://weather.tsukumijima.net/api/forecast/city/130010"
  scan_interval: 3600
  headers:
    Accept: "application/json"
    User-Agent: "Home Assistant"
  sensor:
    - name: "Tokyo Weather Summary Today"
      unique_id: "sensor.tokyo_weather_summary_today"
      value_template: "{{ value_json.forecasts[0].telop }}"
      icon: "mdi:weather-partly-cloudy"
    - name: "Tokyo Weather Area"
      unique_id: "sensor.tokyo_weather_area"
      value_template: "{{ value_json.location.area }}"
      icon: "mdi:map-marker-radius"
    - name: "Tokyo Weather Prefecture"
      unique_id: "sensor.tokyo_weather_prefecture"
      value_template: "{{ value_json.location.prefecture }}"
      icon: "mdi:map-marker"
    - name: "Tokyo Weather District"
      unique_id: "sensor.tokyo_weather_district"
      value_template: "{{ value_json.location.district }}"
      icon: "mdi:map-marker-outline"
    - name: "Tokyo Weather City"
      unique_id: "sensor.tokyo_weather_city"
      value_template: "{{ value_json.location.city }}"
      icon: "mdi:city"
    - name: "Tokyo Weather Publish Time"
      unique_id: "sensor.tokyo_weather_publish_time"
      value_template: "{{ as_datetime(value_json.publicTime) }}"
      icon: "mdi:clock-outline"
    - name: "Tokyo Weather Maximum Temperature Today"
      unique_id: "sensor.tokyo_weather_maximum_temperature_today"
      # The forecast drops a temperature once its time has passed, such as today's
      # maximum in the evening; int() would then fail and the sensor would not load.
      availability: "{{ value_json is not none and value_json.forecasts[0].temperature.max.celsius is not none }}"
      value_template: "{{ int(value_json.forecasts[0].temperature.max.celsius) }}"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      icon: "mdi:thermometer"
    - name: "Tokyo Weather Rain Chance 00-06 Today"
      unique_id: "sensor.tokyo_weather_rain_chance_00_06_today"
      value_template: "{{ value_json.forecasts[0].chanceOfRain.T00_06 | replace('%', '') | int(0) }}"
      unit_of_measurement: "%"
      icon: "mdi:water-percent"
    - name: "Tokyo Weather Rain Chance 06-12 Today"
      unique_id: "sensor.tokyo_weather_rain_chance_06_12_today"
      value_template: "{{ value_json.forecasts[0].chanceOfRain.T06_12 | replace('%', '') | int(0) }}"
      unit_of_measurement: "%"
      icon: "mdi:water-percent"
    - name: "Tokyo Weather Rain Chance 12-18 Today"
      unique_id: "sensor.tokyo_weather_rain_chance_12_18_today"
      value_template: "{{ value_json.forecasts[0].chanceOfRain.T12_18 | replace('%', '') | int(0) }}"
      unit_of_measurement: "%"
      icon: "mdi:water-percent"
    - name: "Tokyo Weather Rain Chance 18-24 Today"
      unique_id: "sensor.tokyo_weather_rain_chance_18_24_today"
      value_template: "{{ value_json.forecasts[0].chanceOfRain.T18_24 | replace('%', '') | int(0) }}"
      unit_of_measurement: "%"
      icon: "mdi:water-percent"
    - name: "Tokyo Weather Detail Today"
      unique_id: "sensor.tokyo_weather_detail_today"
      value_template: "{{ value_json.forecasts[0].detail.weather | replace('　', '') }}"
      icon: "mdi:text-box"
    - name: "Tokyo Weather Wind Today"
      unique_id: "sensor.tokyo_weather_wind_today"
      value_template: "{{ value_json.forecasts[0].detail.wind }}"
      icon: "mdi:weather-windy"
    - name: "Tokyo Weather Wave Today"
