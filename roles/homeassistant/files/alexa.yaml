smart_home:
  locale: ja-JP
  endpoint: https://api.fe.amazonalexa.com/v3/events
  client_id: !secret alexa_client_id
  client_secret: !secret alexa_client_secret
  filter:
    include_entities:
      - alarm_control_panel.entrance
      - alarm_control_panel.home
      - automation.turn_down_living_area
      - automation.turn_down_living_area_more
      - binary_sensor.bathroom_motion_sensor
      - binary_sensor.mom_s_room_window_sensor_north
      - binary_sensor.mom_s_room_window_sensor_south
      - binary_sensor.entrance_door_sensor
      - binary_sensor.living_room_motion_sensor_south
      - binary_sensor.living_room_window_sensor_south
      - binary_sensor.living_room_motion_sensor_north
      - binary_sensor.living_room_window_sensor_north
      - binary_sensor.living_room_window_sensor_center
      - climate.moms_room_hvac
      - climate.living_room_hvac
      - cover.mom_s_room_curtains
      - fan.living_room_ceiling_fans
      - switch.living_room_floor_heater_south_operation_status
      - light.bathroom_lights
      - light.mom_s_room_light
      - light.living_room_dimming_downlights
      - light.living_room_downlights
      - light.living_room_light_entrance
      - light.living_room_footlight_plug
      - light.living_room_tv_light
      - lock.entrance_locks
      - media_player.living_room_apple_tv
      - media_player.living_room_av_receiver
      - sensor.balcony_thermometer_primary_temperature
      - sensor.bathroom_motion_sensor_temperature
      - sensor.mom_s_room_thermometer_primary_temperature
      - sensor.living_room_thermometer_temperature
      - sensor.study_temperature
      - switch.living_room_humidifier
      - switch.living_room_hvac_cleaner
  entity_config:
    alarm_control_panel.entrance:
      name: 玄関のオートロック
    alarm_control_panel.home:
      name: 監視カメラ
    automation.turn_down_living_area:
      name: リビングのターンダウン
      display_categories: SCENE_TRIGGER
    automation.turn_down_living_area_more:
      name: リビングのもっとターンダウン
      display_categories: SCENE_TRIGGER
    binary_sensor.bathroom_motion_sensor:
      name: 浴室のモーションセンサー
    binary_sensor.mom_s_room_window_sensor_north:
      name: ママの部屋の北側の窓
    binary_sensor.mom_s_room_window_sensor_south:
      name: ママの部屋の南側のの窓
    binary_sensor.entrance_door_sensor:
      name: 玄関のドア
    binary_sensor.living_room_motion_sensor_south:
      name: リビングのモーションセンサー
    binary_sensor.living_room_window_sensor_south:
      name: リビングの窓
    binary_sensor.living_room_motion_sensor_north:
      name: 書斎のモーションセンサー
    binary_sensor.living_room_window_sensor_north:
      name: 書斎の北側の窓
    binary_sensor.living_room_window_sensor_center:
      name: 書斎の南側の窓
    camera.eufy_mom:
      name: ママの部屋のカメラ
    camera.eufy_liv:
      name: リビングのカメラ
    climate.mom_s_room_ac:
      name: ママの部屋のエアコン
    climate.living_room_hvac:
      name: リビングのエアコン
    cover.mom_s_room_curtains:
      name: ママの部屋のカーテン
    fan.living_room_ceiling_fans:
      name: リビングのシーリングファン
    switch.living_room_floor_heater_south_operation_status:
      name: リビングの床暖房
      display_categories: SWITCH
    light.bathroom_lights:
      name: 浴室の照明
    light.mom_s_room_light:
      name: 寝室の照明
    light.living_room_dimming_downlights:
      name: リビングのダウンライトの調光
    light.living_room_downlights:
      name: リビングのダウンライト
    light.living_room_light_entrance:
      name: リビングの入り口の照明
    light.living_room_footlight_plug:
      name: リビングのフットライト
    light.living_room_tv_light:
      name: リビングのテレビの照明
    lock.entrance_locks:
      name: 玄関の鍵
    media_player.living_room_apple_tv:
      name: Apple TV
      display_categories: STREAMING_DEVICE
    media_player.living_room_av_receiver:
      name: アンプ
      display_categories: MUSIC_SYSTEM
    sensor.balcony_thermometer_primary_temperature:
      name: ベランダの温度計
    sensor.bathroom_motion_sensor_temperature:
      name: 浴室の温度計
    sensor.mom_s_room_thermometer_primary_temperature:
      name: 寝室の温度計
    sensor.living_room_thermometer_temperature:
      name: リビングの温度計
    sensor.study_temperature:
      name: 書斎の温度計
    switch.moms_room_ac_cleaner:
      name: ママの部屋のエアコンクリーナー
      display_categories: VACUUM_CLEANER
    switch.living_room_humidifier:
      name: リビングの加湿器
      display_categories: AIR_PURIFIER
