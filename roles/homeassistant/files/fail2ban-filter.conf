# Home Assistant logs the reverse-DNS name, then the address in parentheses, then
# the requested URL and the User-Agent, which the client chooses. The pattern
# starts at the level, right after the timestamp fail2ban cuts out, and spans
# the whole message, so only an entry the http.ban logger wrote matches, never a
# copy of its text that another logger echoes. \S+ cannot cross a space, so the
# address is the one in the first parentheses, never a name or a value the
# client sent.
[Definition]
failregex = ^\s*WARNING \(MainThread\) \[homeassistant\.components\.http\.ban\] Login attempt or request with invalid authentication from \S+ \(<HOST>\)\. Requested URL: '.*'\. \(.*\)$
ignoreregex =
