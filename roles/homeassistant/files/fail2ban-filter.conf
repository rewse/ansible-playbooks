# Home Assistant logs the reverse-DNS name, then the address in parentheses, then
# the requested URL and the User-Agent, which the client chooses. The pattern is
# not preceded by ^.* and ends at "Requested URL", so it binds to the first copy
# of the message and takes the address, never a name or a value the client sent.
[Definition]
failregex = WARNING \(MainThread\) \[homeassistant\.components\.http\.ban\] Login attempt or request with invalid authentication from \S+ \(<HOST>\)\. Requested URL: '
ignoreregex =
