- id: automation.select_home_alarm_control
  alias: "Select Home Alarm Control"
  triggers:
    - trigger: state
      entity_id:
        - device_tracker.ping_atom
        - device_tracker.ping_ubiqu_personal
        - device_tracker.ping_kijitora
    - trigger: state
      entity_id:
        - person.shibata_tats
        - person.shibata_akiko
        - person.shibata_kayano
      for:
        minutes: 10
    - trigger: homeassistant
      event: start
  actions:
    - choose:
        - conditions:
            - or:
                - condition: state
                  entity_id:
                    - device_tracker.ping_atom
                    - device_tracker.ping_ubiqu_personal
                    - device_tracker.ping_kijitora
                  match: any
                  state: "home"
                - condition: state
                  entity_id:
                    - person.shibata_tats
                    - person.shibata_akiko
                    - person.shibata_kayano
                  match: any
                  state: "home"
                  for:
                    minutes: 10
            # A disarmed panel is a deliberate choice, usually to keep the indoor
            # cameras running while working on them, and arriving home must not
            # overwrite it. Only this branch honours it: the armed_away branch
            # below still arms on departure, so leaving never goes unguarded.
            - not:
                - condition: state
                  entity_id: alarm_control_panel.home
                  state: "disarmed"
          sequence:
            - action: alarm_control_panel.alarm_arm_home
              target:
                entity_id: alarm_control_panel.home
        - conditions:
            - condition: state
              entity_id:
                - person.shibata_tats
                - person.shibata_akiko
                - person.shibata_kayano
              state: "not_home"
              for:
                minutes: 10
            - not:
                - condition: state
                  entity_id: alarm_control_panel.home
                  state: "armed_vacation"
          sequence:
            - action: alarm_control_panel.alarm_arm_away
              target:
                entity_id: alarm_control_panel.home
# Frigate restarts ffmpeg every second for a camera without power, and its main
# process grows until the container memory limit kills it. Cameras follow their
# plugs. Frigate restores the enabled state across a restart, but a set message
# published while Frigate is down is not retained and is lost, so the cameras are
# synced again when Frigate comes online.
# Kept apart from Toggle Camera Plugs, which runs only when the alarm mode and the
# plugs disagree and notifies every run. A Frigate restart or a plug switched by
# hand changes neither the alarm mode nor the need for a notification.
- id: automation.sync_frigate_cameras
  alias: "Sync Frigate Cameras"
  triggers:
    - trigger: state
      entity_id:
        - switch.dads_room_camera_plug
        - switch.living_room_camera_plug
        - switch.moms_room_camera_plug
      to: ~
    - trigger: mqtt
      topic: "frigate/available"
      payload: "online"
  actions:
    - repeat:
        for_each:
          - camera: "eufy-dad"
            plug: "switch.dads_room_camera_plug"
          - camera: "eufy-liv"
            plug: "switch.living_room_camera_plug"
          - camera: "eufy-mom"
            plug: "switch.moms_room_camera_plug"
        sequence:
          - action: mqtt.publish
            data:
              topic: "frigate/{{ repeat.item.camera }}/enabled/set"
              payload: "{{ 'ON' if is_state(repeat.item.plug, 'on') else 'OFF' }}"
  mode: queued
- id: automation.toggle_camera_plugs
  alias: "Toggle Camera Plugs"
  triggers:
    - trigger: state
      entity_id: alarm_control_panel.home
    - trigger: homeassistant
      event: start
  actions:
    - variables:
        action: ""
    - choose:
        - conditions:
            - condition: state
              entity_id: alarm_control_panel.home
              state:
                - "armed_away"
                - "armed_vacation"
            - condition: state
              entity_id:
                - switch.living_room_camera_plug
                - switch.dads_room_camera_plug
                - switch.moms_room_camera_plug
              match: any
              state: "off"
          sequence:
            - action: switch.turn_on
              target:
                entity_id:
                  - switch.living_room_camera_plug
                  - switch.dads_room_camera_plug
                  - switch.moms_room_camera_plug
            - variables:
                action: "on"
        - conditions:
            - condition: state
              entity_id: alarm_control_panel.home
              state: "armed_home"
            - condition: state
              entity_id:
                - switch.living_room_camera_plug
                - switch.dads_room_camera_plug
                - switch.moms_room_camera_plug
              match: any
              state: "on"
          sequence:
            - action: switch.turn_off
              target:
                entity_id:
                  - switch.living_room_camera_plug
                  - switch.dads_room_camera_plug
                  - switch.moms_room_camera_plug
            - variables:
                action: "off"
      default:
        - stop: "No action"
    - action: notify.all_devices
      data:
        message: "Turned {{ action }} Surveillance"
        data:
          push:
            interruption-level: time-sensitive
          url: "/lovelace/overview"
- id: automation.toggle_wireguard
  alias: "Toggle WireGuard"
  triggers:
    - trigger: state
      entity_id: device_tracker.ping_atom
      for:
        minutes: 10
    - trigger: homeassistant
      event: start
  actions:
    - choose:
        - conditions:
            - condition: state
              entity_id: device_tracker.ping_atom
              state: "not_home"
              for:
                minutes: 10
            - condition: state
              entity_id: switch.unifi_network_block_wireguard
              state: "on"
          sequence:
            - action: switch.turn_off
              target:
                entity_id: switch.unifi_network_block_wireguard
        - conditions:
            - condition: state
              entity_id: device_tracker.ping_atom
              state: "home"
              for:
                minutes: 10
            - condition: state
              entity_id: switch.unifi_network_block_wireguard
              state: "off"
          sequence:
            - action: switch.turn_on
              target:
                entity_id: switch.unifi_network_block_wireguard
  trace:
    stored_traces: 100
