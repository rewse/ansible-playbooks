---
# The UniFi objects this component manages, as Network 11.0 exposes them through
# the Site Manager connector:
#   - The address group is an IPV4_ADDRESSES traffic matching list
#     (integration/v1/sites/{siteId}/traffic-matching-lists). Its legacy
#     rest/firewallgroup twin carries the list's id as external_id, and the
#     twin's _id is what legacy objects such as port forwards reference.
#   - The WAN forwards are legacy rest/portforward objects, because the
#     documented API has no port forwards. src_limiting_enabled,
#     src_limiting_type firewall_group and src_firewall_group_id limit a forward
#     to the sources in a group.
#   - The IPv6 allows are zone-based firewall policies
#     (integration/v1/sites/{siteId}/firewall/policies) from the External zone,
#     one per destination zone, whose destination port filter names a PORTS
#     traffic matching list.
# Every call runs on the controller, which holds the API key.
- name: cloudfront | Manage the UniFi objects
  delegate_to: localhost
  become: false
  block:
    - name: cloudfront | Get AWS IP ranges
      ansible.builtin.uri:
        url: "{{ udm_cloudfront_ip_ranges_url }}"
        return_content: true
      register: __udm_cloudfront_ip_ranges
      # The GETs only read, and the comparisons below need them in check mode.
      check_mode: false

    - name: cloudfront | Set CloudFront origin-facing prefixes
      ansible.builtin.set_fact:
        __udm_cloudfront_prefixes: >-
          {{ __udm_cloudfront_ip_ranges.json.prefixes
          | selectattr('service', 'equalto', 'CLOUDFRONT_ORIGIN_FACING')
          | map(attribute='ip_prefix') | unique | sort }}

    - name: cloudfront | Check CloudFront origin-facing prefixes
      ansible.builtin.assert:
        that:
          - __udm_cloudfront_prefixes | length > 0
        fail_msg: ip-ranges.json lists no CLOUDFRONT_ORIGIN_FACING prefixes.
        quiet: true

    - name: cloudfront | Get consoles
      ansible.builtin.uri:
        url: "{{ udm_unifi_api_url }}/ea/hosts"
        headers: "{{ udm_unifi_api_headers }}"
      register: __udm_cloudfront_hosts
      check_mode: false
      no_log: true

    - name: cloudfront | Set console
      ansible.builtin.set_fact:
        __udm_cloudfront_consoles: >-
          {{ __udm_cloudfront_hosts.json.data
          | selectattr('reportedState', 'truthy')
          | selectattr('reportedState.name', 'equalto', udm_unifi_console)
          | map(attribute='id') }}

    - name: cloudfront | Check console
      ansible.builtin.assert:
        that:
          - __udm_cloudfront_consoles | length == 1
        fail_msg: No single console named {{ udm_unifi_console }} in this account.
        quiet: true

    - name: cloudfront | Set console API URL
      ansible.builtin.set_fact:
        __udm_cloudfront_network_url: >-
          {{ udm_unifi_api_url }}/v1/connector/consoles/{{ __udm_cloudfront_consoles | first }}/proxy/network

    - name: cloudfront | Get sites
      ansible.builtin.uri:
        url: "{{ __udm_cloudfront_network_url }}/integration/v1/sites"
        headers: "{{ udm_unifi_api_headers }}"
      register: __udm_cloudfront_sites
      check_mode: false
      no_log: true

    - name: cloudfront | Set site API URL
      ansible.builtin.set_fact:
        # The legacy endpoints below address the same site as "default".
        __udm_cloudfront_site_url: >-
          {{ __udm_cloudfront_network_url }}/integration/v1/sites/{{
          (__udm_cloudfront_sites.json.data
          | selectattr('internalReference', 'equalto', 'default') | first).id }}

    - name: cloudfront | Get traffic matching lists
      ansible.builtin.uri:
        url: "{{ __udm_cloudfront_site_url }}/traffic-matching-lists?limit=200"
        headers: "{{ udm_unifi_api_headers }}"
      register: __udm_cloudfront_lists
      check_mode: false
      no_log: true

    - name: cloudfront | Check traffic matching lists are complete
      ansible.builtin.assert:
        that:
          - __udm_cloudfront_lists.json.count == __udm_cloudfront_lists.json.totalCount
        fail_msg: The traffic matching lists span more than one page.
        quiet: true

    - name: cloudfront | Set address group
      ansible.builtin.set_fact:
        __udm_cloudfront_group: >-
          {{ __udm_cloudfront_lists.json.data
          | selectattr('type', 'equalto', 'IPV4_ADDRESSES')
          | selectattr('name', 'equalto', udm_cloudfront_group_name)
          | first | default({}) }}

    - name: cloudfront | Set address group members
      ansible.builtin.uri:
        url: >-
          {{ __udm_cloudfront_site_url }}/traffic-matching-lists{{
          ('/' ~ __udm_cloudfront_group.id) if __udm_cloudfront_group else '' }}
        method: "{{ 'PUT' if __udm_cloudfront_group else 'POST' }}"
        headers: "{{ udm_unifi_api_headers }}"
        body_format: json
        body:
          type: IPV4_ADDRESSES
          name: "{{ udm_cloudfront_group_name }}"
          items: >-
            {{ __udm_cloudfront_prefixes
            | map('community.general.dict_kv', 'value')
            | map('combine', {'type': 'SUBNET'}) }}
        return_content: true
      register: __udm_cloudfront_group_write
      changed_when: __udm_cloudfront_group_write.status in [200, 201]
      failed_when: false
      when:
        - not ansible_check_mode
        - >-
          __udm_cloudfront_group.get('items', []) | map(attribute='value') | sort
          != __udm_cloudfront_prefixes
      no_log: true

    # The request above is no_log because it carries the API key; this shows
    # only the status and the response body.
    - name: cloudfront | Check address group write
      ansible.builtin.assert:
        that:
          - __udm_cloudfront_group_write.status in [200, 201]
        fail_msg: >-
          Writing {{ udm_cloudfront_group_name }} returned
          {{ __udm_cloudfront_group_write.status }}:
          {{ __udm_cloudfront_group_write.json | default(__udm_cloudfront_group_write.content | default('')) }}
        quiet: true
      when: __udm_cloudfront_group_write is not skipped

    - name: cloudfront | Set address group ID
      ansible.builtin.set_fact:
        __udm_cloudfront_group_id: >-
          {{ __udm_cloudfront_group.id
          | default(__udm_cloudfront_group_write.json.id | default('')) }}

    - name: cloudfront | Get firewall groups
      ansible.builtin.uri:
        url: "{{ __udm_cloudfront_network_url }}/api/s/default/rest/firewallgroup"
        headers: "{{ udm_unifi_api_headers }}"
      register: __udm_cloudfront_firewall_groups
      check_mode: false
      when: udm_cloudfront_enforce
      no_log: true

    - name: cloudfront | Get port forwards
      ansible.builtin.uri:
        url: "{{ __udm_cloudfront_network_url }}/api/s/default/rest/portforward"
        headers: "{{ udm_unifi_api_headers }}"
      register: __udm_cloudfront_forwards
      check_mode: false
      when: udm_cloudfront_enforce
      no_log: true

    - name: cloudfront | Get firewall zones
      ansible.builtin.uri:
        url: "{{ __udm_cloudfront_site_url }}/firewall/zones?limit=200"
        headers: "{{ udm_unifi_api_headers }}"
      register: __udm_cloudfront_zones
      check_mode: false
      when: udm_cloudfront_enforce
      no_log: true

    - name: cloudfront | Get firewall policies
      ansible.builtin.uri:
        url: "{{ __udm_cloudfront_site_url }}/firewall/policies?limit=500"
        headers: "{{ udm_unifi_api_headers }}"
      register: __udm_cloudfront_policies
      check_mode: false
      when: udm_cloudfront_enforce
      no_log: true

    - name: cloudfront | Check firewall policies are complete
      ansible.builtin.assert:
        that:
          - __udm_cloudfront_policies.json.count == __udm_cloudfront_policies.json.totalCount
        fail_msg: The firewall policies span more than one page.
        quiet: true
      when: udm_cloudfront_enforce

    # Forwards are matched on the port, because their names follow whichever
    # host the failover script last pointed them at.
    - name: cloudfront | Set web forwards and legacy group
      ansible.builtin.set_fact:
        __udm_cloudfront_https_forwards: >-
          {{ __udm_cloudfront_forwards.json.data
          | selectattr('dst_port', 'equalto', '443')
          | selectattr('proto', 'in', ['tcp', 'tcp_udp']) }}
        __udm_cloudfront_http_forwards: >-
          {{ __udm_cloudfront_forwards.json.data
          | selectattr('dst_port', 'equalto', '80')
          | selectattr('proto', 'in', ['tcp', 'tcp_udp']) }}
        # The legacy twin exists only once the list does, which a check run
        # against a console without the list never sees.
        __udm_cloudfront_firewall_group_id: >-
          {{ __udm_cloudfront_firewall_groups.json.data
          | selectattr('external_id', 'equalto', __udm_cloudfront_group_id)
          | map(attribute='_id') | first | default('') }}
      when: udm_cloudfront_enforce

    - name: cloudfront | Check HTTPS forward
      ansible.builtin.assert:
        that:
          - __udm_cloudfront_https_forwards | length == 1
          - __udm_cloudfront_firewall_group_id != '' or ansible_check_mode
        fail_msg: >-
          Expected one TCP forward of port 443 and the legacy twin of
          {{ udm_cloudfront_group_name }}.
        quiet: true
      when: udm_cloudfront_enforce

    # Every enabled ALLOW policy from the internet that admits new IPv6 TCP
    # connections to port 80 or 443, whether it names IPv6 alone or both IP
    # versions, and whatever form its port filter takes; see
    # filter_plugins/udm_firewall.py. Only those that name web ports alone are
    # removed, because removing one that also names another port would close
    # that port too. Policies the console derives from them, such as return
    # traffic, go with them.
    - name: cloudfront | Set IPv6 web allows
      vars:
        external_zone: >-
          {{ (__udm_cloudfront_zones.json.data
          | selectattr('name', 'equalto', 'External') | first).id }}
      ansible.builtin.set_fact:
        __udm_cloudfront_ipv6_web: >-
          {{ __udm_cloudfront_policies.json.data
          | udm_web_allows(__udm_cloudfront_lists.json.data, external_zone) }}
        __udm_cloudfront_external_zone: "{{ external_zone }}"
      when: udm_cloudfront_enforce

    - name: cloudfront | Set removable IPv6 web allows
      ansible.builtin.set_fact:
        __udm_cloudfront_ipv6_allows: >-
          {{ __udm_cloudfront_ipv6_web | udm_web_only(__udm_cloudfront_lists.json.data) }}
      when: udm_cloudfront_enforce

    - name: cloudfront | Check IPv6 web allows are removable
      ansible.builtin.assert:
        that:
          - >-
            __udm_cloudfront_ipv6_web | map(attribute='id')
            | difference(__udm_cloudfront_ipv6_allows | map(attribute='id'))
            | length == 0
        fail_msg: >-
          These policies let IPv6 reach port 80 or 443 together with other ports
          or a range, so removing them would close more than the web ports:
          {{ __udm_cloudfront_ipv6_web | rejectattr('id', 'in', __udm_cloudfront_ipv6_allows
          | map(attribute='id')) | map(attribute='name') | join(', ') }}.
          Split them in the UniFi UI and run again.
        quiet: true
      when: udm_cloudfront_enforce

    - name: cloudfront | Set changes
      vars:
        https_limit:
          src_firewall_group_id: "{{ __udm_cloudfront_firewall_group_id }}"
          src_limiting_enabled: true
          src_limiting_type: firewall_group
        https_forward: "{{ __udm_cloudfront_https_forwards | first }}"
      ansible.builtin.set_fact:
        __udm_cloudfront_https_forward: "{{ https_forward | combine(https_limit) }}"
        __udm_cloudfront_https_pending: "{{ https_forward | combine(https_limit) != https_forward }}"
        __udm_cloudfront_https_limit: "{{ https_limit }}"
      when: udm_cloudfront_enforce

    - name: cloudfront | Set pending
      ansible.builtin.set_fact:
        __udm_cloudfront_pending: >-
          {{ __udm_cloudfront_https_pending
          or __udm_cloudfront_http_forwards | length > 0
          or __udm_cloudfront_ipv6_allows | length > 0 }}
        __udm_cloudfront_backup_name: originals-{{ now(utc=true, fmt='%Y%m%dT%H%M%SZ') }}.json
      when: udm_cloudfront_enforce

    # Rolling back stage 5 in rewse/cloudfront-waf docs/setup.md restores from
    # the saved objects, so they outlive the run; AGENTS.md has the purge policy.
    - name: cloudfront | Create backup directory
      ansible.builtin.file:
        path: "{{ udm_cloudfront_backup_dir }}"
        state: directory
        mode: "0700"
      when:
        - udm_cloudfront_enforce
        - not ansible_check_mode
        - __udm_cloudfront_pending

    # None of these objects holds a secret: forwards and policies carry only
    # addresses, ports, zones and names.
    - name: cloudfront | Save objects before changing them
      ansible.builtin.copy:
        content: >-
          {{ {'firewall_policies': __udm_cloudfront_ipv6_allows,
          'port_forwards': __udm_cloudfront_https_forwards + __udm_cloudfront_http_forwards}
          | to_nice_json }}
        dest: "{{ udm_cloudfront_backup_dir }}/{{ __udm_cloudfront_backup_name }}"
        mode: "0600"
      when:
        - udm_cloudfront_enforce
        - not ansible_check_mode
        - __udm_cloudfront_pending

    - name: cloudfront | Show backup path
      ansible.builtin.debug:
        msg: Saved the objects before the change to {{ udm_cloudfront_backup_dir }}/{{ __udm_cloudfront_backup_name }}
        verbosity: 0
      when:
        - udm_cloudfront_enforce
        - not ansible_check_mode
        - __udm_cloudfront_pending

    # The whole object goes back, the legacy endpoint replacing rather than
    # patching what it is given.
    - name: cloudfront | Limit HTTPS forward to CloudFront
      ansible.builtin.uri:
        url: >-
          {{ __udm_cloudfront_network_url }}/api/s/default/rest/portforward/{{
          __udm_cloudfront_https_forward._id }}
        method: PUT
        headers: "{{ udm_unifi_api_headers }}"
        body_format: json
        body: "{{ __udm_cloudfront_https_forward }}"
        return_content: true
      register: __udm_cloudfront_https_write
      changed_when: __udm_cloudfront_https_write.status == 200
      failed_when: false
      when:
        - udm_cloudfront_enforce
        - not ansible_check_mode
        - __udm_cloudfront_https_pending
      no_log: true

    - name: cloudfront | Check HTTPS forward write
      ansible.builtin.assert:
        that:
          - __udm_cloudfront_https_write.status == 200
        fail_msg: >-
          Limiting the HTTPS forward returned {{ __udm_cloudfront_https_write.status }}:
          {{ __udm_cloudfront_https_write.json | default(__udm_cloudfront_https_write.content | default('')) }}
        quiet: true
      when:
        - udm_cloudfront_enforce
        - __udm_cloudfront_https_write is not skipped

    # The console answers 200 to fields it does not know and drops them, so the
    # forward is read back to see that the source limit stuck.
    - name: cloudfront | Get port forwards after the change
      ansible.builtin.uri:
        url: "{{ __udm_cloudfront_network_url }}/api/s/default/rest/portforward"
        headers: "{{ udm_unifi_api_headers }}"
      register: __udm_cloudfront_forwards_after
      check_mode: false
      when:
        - udm_cloudfront_enforce
        - not ansible_check_mode
      no_log: true

    - name: cloudfront | Check HTTPS forward limit
      vars:
        stored: >-
          {{ __udm_cloudfront_forwards_after.json.data
          | selectattr('_id', 'equalto', __udm_cloudfront_https_forward._id)
          | first | default({}) }}
      ansible.builtin.assert:
        that:
          - stored.src_limiting_enabled | default(false) is true
          - stored.src_limiting_type | default('') == __udm_cloudfront_https_limit.src_limiting_type
          - stored.src_firewall_group_id | default('') == __udm_cloudfront_https_limit.src_firewall_group_id
        fail_msg: >-
          The HTTPS forward holds src_limiting_enabled={{ stored.src_limiting_enabled | default('missing') }},
          src_limiting_type={{ stored.src_limiting_type | default('missing') }},
          src_firewall_group_id={{ stored.src_firewall_group_id | default('missing') }}
          instead of the CloudFront limit, so WAN 443 is not limited.
        quiet: true
      when:
        - udm_cloudfront_enforce
        - not ansible_check_mode

    - name: cloudfront | Remove HTTP forward
      ansible.builtin.uri:
        url: "{{ __udm_cloudfront_network_url }}/api/s/default/rest/portforward/{{ item._id }}"
        method: DELETE
        headers: "{{ udm_unifi_api_headers }}"
        return_content: true
      loop: "{{ __udm_cloudfront_http_forwards | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      register: __udm_cloudfront_http_removal
      changed_when: true
      failed_when: false
      when:
        - udm_cloudfront_enforce
        - not ansible_check_mode
      no_log: true

    - name: cloudfront | Check HTTP forward removal
      ansible.builtin.assert:
        that:
          - __udm_cloudfront_http_removal.results | rejectattr('status', 'equalto', 200) | list | length == 0
        fail_msg: >-
          Removing the HTTP forward failed:
          {% for result in __udm_cloudfront_http_removal.results | rejectattr('status', 'equalto', 200) %}
          {{ result.item.name }} returned {{ result.status }}:
          {{ result.json | default(result.content | default('')) }}.
          {% endfor %}
        quiet: true
      when:
        - udm_cloudfront_enforce
        - not ansible_check_mode

    - name: cloudfront | Remove IPv6 web allows
      ansible.builtin.uri:
        url: "{{ __udm_cloudfront_site_url }}/firewall/policies/{{ item.id }}"
        method: DELETE
        headers: "{{ udm_unifi_api_headers }}"
        return_content: true
      loop: "{{ __udm_cloudfront_ipv6_allows | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      register: __udm_cloudfront_ipv6_removal
      changed_when: __udm_cloudfront_ipv6_removal.status == 200
      failed_when: false
      when:
        - udm_cloudfront_enforce
        - not ansible_check_mode
      no_log: true

    # A policy can go with an earlier one it was derived alongside, so 404
    # counts as removed.
    - name: cloudfront | Check IPv6 web allow removal
      ansible.builtin.assert:
        that:
          - __udm_cloudfront_ipv6_removal.results | rejectattr('status', 'in', [200, 404]) | list | length == 0
        fail_msg: >-
          Removing IPv6 web allows failed:
          {% for result in __udm_cloudfront_ipv6_removal.results | rejectattr('status', 'in', [200, 404]) %}
          {{ result.item.name }} returned {{ result.status }}:
          {{ result.json | default(result.content | default('')) }}.
          {% endfor %}
        quiet: true
      when:
        - udm_cloudfront_enforce
        - not ansible_check_mode

    - name: cloudfront | Get firewall policies after the change
      ansible.builtin.uri:
        url: "{{ __udm_cloudfront_site_url }}/firewall/policies?limit=500"
        headers: "{{ udm_unifi_api_headers }}"
      register: __udm_cloudfront_policies_after
      check_mode: false
      when:
        - udm_cloudfront_enforce
        - not ansible_check_mode
      no_log: true

    - name: cloudfront | Check no IPv6 web allow remains
      vars:
        remaining: >-
          {{ __udm_cloudfront_policies_after.json.data
          | udm_web_allows(__udm_cloudfront_lists.json.data, __udm_cloudfront_external_zone) }}
      ansible.builtin.assert:
        that:
          - remaining | length == 0
        fail_msg: >-
          IPv6 from the internet still reaches port 80 or 443 through:
          {{ remaining | map(attribute='name') | join(', ') }}.
        quiet: true
      when:
        - udm_cloudfront_enforce
        - not ansible_check_mode
