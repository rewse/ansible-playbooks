---
# WorkMail is retired, so the autodiscover proxy goes. proxy_http stays
# because other roles enable it for their own vhosts.
- name: apache | Disable autodiscover configuration
  ansible.builtin.command: a2disconf autodiscover
  register: __autodiscover_a2disconf
  # a2disconf exits 1 once the conf file is gone, which a later run sees.
  changed_when: "'Conf autodiscover disabled' in __autodiscover_a2disconf.stdout"
  failed_when: __autodiscover_a2disconf.rc not in [0, 1]
  notify: Reload Apache

- name: apache | Remove autodiscover configuration
  ansible.builtin.file:
    path: /etc/apache2/conf-available/autodiscover.conf
    state: absent
  notify: Reload Apache
