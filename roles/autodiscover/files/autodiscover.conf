SSLProxyEngine on
# Outlook sends the mailbox password through this proxy, so WorkMail's
# certificate is checked against the system CAs.
SSLProxyVerify require
# WorkMail serves a leaf and an intermediate; the default depth of 1 rejects it.
SSLProxyVerifyDepth 3
SSLProxyCACertificateFile /etc/ssl/certs/ca-certificates.crt
ProxyPass /autodiscover/autodiscover.xml https://autodiscover-service.mail.us-west-2.awsapps.com/autodiscover/autodiscover.xml
