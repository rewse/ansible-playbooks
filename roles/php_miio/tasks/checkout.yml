---
- name: checkout | Resolve aged tag
  ansible.builtin.set_fact:
    __php_miio_source: "{{ lookup('aged_release', 'github-tag:skysilver-lab/php-miio', pattern='^v\\.\\d+(\\.\\d+)+$') }}"

- name: checkout | Check out repository
  ansible.builtin.git:
    repo: https://github.com/skysilver-lab/php-miio.git
    # Run in place, so under /opt rather than /srv, which holds service data.
    dest: /opt/php-miio
    version: "{{ __php_miio_source.commit }}"

- name: checkout | Remove legacy checkouts
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /srv/php-miio
    - /srv/php-miio-v.0.2.6
