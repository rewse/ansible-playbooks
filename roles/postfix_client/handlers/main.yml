---
# postmap and newaliases are the only writers of Postfix lookup tables.
- name: Hash SASL password file
  ansible.builtin.command: postmap hash:/etc/postfix/sasl_passwd
  changed_when: true

- name: Hash sender_canonical
  ansible.builtin.command: postmap hash:/etc/postfix/sender_canonical
  changed_when: true

- name: Rebuild aliases
  ansible.builtin.command: newaliases
  changed_when: true

- name: Reload postfix
  ansible.builtin.systemd:
    name: postfix
    state: reloaded
