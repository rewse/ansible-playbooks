---
- name: service | Create output directory
  ansible.builtin.file:
    path: "{{ enecoq_data_fetcher_output_dir }}"
    state: directory
    owner: "{{ enecoq_data_fetcher_user }}"
    group: "{{ enecoq_data_fetcher_user }}"
    mode: "0755"
    # Fails on a link rather than handing the user the directory it points to.
    follow: false
  notify: Start enecoq-data-fetcher

- name: service | Install script
  ansible.builtin.template:
    src: enecoq-data-fetcher.j2
    dest: /usr/local/sbin/enecoq-data-fetcher
    variable_start_string: "[%"
    variable_end_string: "%]"
    # The script holds the credentials. root owns it so the service user, which
    # runs it, cannot change what the next run does.
    owner: root
    group: "{{ enecoq_data_fetcher_user }}"
    mode: "0750"
  no_log: true

- name: service | Install systemd service
  ansible.builtin.template:
    src: enecoq-data-fetcher.service.j2
    dest: /etc/systemd/system/enecoq-data-fetcher.service
    mode: "0644"
  notify: Reload systemd

- name: service | Install systemd timer
  ansible.builtin.copy:
    src: enecoq-data-fetcher.timer
    dest: /etc/systemd/system/enecoq-data-fetcher.timer
    mode: "0644"
  notify: Restart enecoq-data-fetcher timer

- name: service | Enable and start timer
  ansible.builtin.systemd:
    name: enecoq-data-fetcher.timer
    enabled: "{{ enecoq_data_fetcher_timer_enabled }}"
    state: "{{ 'started' if enecoq_data_fetcher_timer_enabled else 'stopped' }}"
    daemon_reload: true

- name: service | Remove legacy state
  # The root checkout the fetcher ran from before it had its own user, and the
  # output directory it used inside the Home Assistant configuration.
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /opt/enecoq-fetch
    - /srv/homeassistant/config/data
