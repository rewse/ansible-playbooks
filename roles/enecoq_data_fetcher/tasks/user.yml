---
- name: user | Create system user
  ansible.builtin.user:
    name: "{{ enecoq_data_fetcher_user }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ enecoq_data_fetcher_home }}"
    create_home: false

- name: user | Create directories
  # The unit's StateDirectory and CacheDirectory; created here too because the
  # browser install runs before the service has ever started.
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ enecoq_data_fetcher_user }}"
    group: "{{ enecoq_data_fetcher_user }}"
    mode: "0755"
  loop:
    - "{{ enecoq_data_fetcher_cache_dir }}"
    - "{{ enecoq_data_fetcher_home }}"
