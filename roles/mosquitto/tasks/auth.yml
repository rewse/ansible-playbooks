---
# mosquitto_passwd hashes the file in place with a random salt, so the file never
# matches its template again. A digest of the rendered template stands in for it,
# written only after the file is rewritten and hashed, so an interrupted run
# retries the rotation.
- name: auth | Read recorded password file digest
  ansible.builtin.slurp:
    src: /etc/mosquitto/pwfile.sha256
  register: __mosquitto_recorded_digest
  failed_when: false

- name: auth | Compute password file digest
  ansible.builtin.set_fact:
    __mosquitto_digest: "{{ lookup('ansible.builtin.template', 'pwfile.j2') | hash('sha256') }}"
    __mosquitto_recorded: "{{ (__mosquitto_recorded_digest.content | default('')) | b64decode | trim }}"

- name: auth | Write password file
  ansible.builtin.template:
    src: pwfile.j2
    dest: /etc/mosquitto/pwfile
    owner: mosquitto
    group: mosquitto
    mode: "0600"
  no_log: true
  when: __mosquitto_digest != __mosquitto_recorded

- name: auth | Hash password file
  # mosquitto_passwd is the only tool that writes its hash format.
  ansible.builtin.command: mosquitto_passwd -U /etc/mosquitto/pwfile
  changed_when: true
  notify: Restart mosquitto
  when:
    - __mosquitto_digest != __mosquitto_recorded
    - not ansible_check_mode

- name: auth | Record password file digest
  ansible.builtin.copy:
    content: "{{ __mosquitto_digest }}\n"
    dest: /etc/mosquitto/pwfile.sha256
    owner: root
    group: root
    mode: "0600"

- name: auth | Copy authentication config
  ansible.builtin.copy:
    src: password.conf
    dest: /etc/mosquitto/conf.d
    mode: "0644"
  notify: Restart mosquitto
