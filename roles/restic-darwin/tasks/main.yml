---
- name: "restic : Install restic"
  community.general.homebrew:
    name: restic
    state: present
  tags:
    - restic-darwin
    - install
    - homebrew
    - restic-darwin_homebrew
    - restic-darwin_homebrew_install

- name: "restic : Create directories"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0700'
  loop:
    - "{{ ansible_facts['env']['HOME'] }}/.config/restic"
    - "{{ ansible_facts['env']['HOME'] }}/.local/bin"
    - "{{ ansible_facts['env']['HOME'] }}/.local/libexec"
    - "{{ ansible_facts['env']['HOME'] }}/.local/state"
  tags:
    - restic-darwin
    - config
    - restic-darwin_restic
    - restic-darwin_restic_config

# The secrets are resolved on the control machine and land as files, because a
# launchd agent has no 1Password session to read them from at the time it runs.
- name: "restic : Install repository password"
  ansible.builtin.copy:
    content: "{{ restic_darwin_password }}"
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/restic/password"
    mode: '0600'
  no_log: true
  tags:
    - restic-darwin
    - config
    - restic-darwin_restic
    - restic-darwin_restic_config

- name: "restic : Install S3 credentials"
  ansible.builtin.copy:
    content: |
      AWS_ACCESS_KEY_ID={{ restic_darwin_aws_key }}
      AWS_SECRET_ACCESS_KEY={{ restic_darwin_aws_secret }}
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/restic/s3.env"
    mode: '0600'
  no_log: true
  tags:
    - restic-darwin
    - config
    - restic-darwin_restic
    - restic-darwin_restic_config

- name: "restic : Copy exclude patterns"
  ansible.builtin.template:
    src: exclude.j2
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/restic/exclude"
    mode: '0644'
  vars:
    home: "{{ ansible_facts['env']['HOME'] }}"
  tags:
    - restic-darwin
    - config
    - restic-darwin_restic
    - restic-darwin_restic_config

# Creating the repository belongs here rather than in the nightly script, where a
# transient S3 failure is indistinguishable from a repository that does not exist
# yet and would be answered by trying to initialise over the top of one.
- name: "restic : Initialise the repository"
  ansible.builtin.shell: |
    set -a
    . "${HOME}/.config/restic/s3.env"
    set +a
    export RESTIC_REPOSITORY="s3:s3.{{ restic_darwin.s3_region }}.amazonaws.com/{{ restic_darwin.s3_bucket }}/{{ restic_darwin.repo_name }}"
    export RESTIC_PASSWORD_FILE="${HOME}/.config/restic/password"
    export PATH="/opt/homebrew/bin:${PATH}"
    restic cat config >/dev/null 2>&1 && exit 0
    restic init
  register: restic_init
  changed_when: "'created restic repository' in restic_init.stdout"
  tags:
    - restic-darwin
    - init
    - restic-darwin_restic
    - restic-darwin_restic_init

- name: "restic : Copy iCloud download helper source"
  ansible.builtin.copy:
    src: restic-icloud-download.swift
    dest: "{{ ansible_facts['env']['HOME'] }}/.local/libexec/restic-icloud-download.swift"
    mode: '0644'
  register: restic_icloud_download_source
  tags:
    - restic-darwin
    - config
    - restic-darwin_restic
    - restic-darwin_restic_config

- name: "restic : Check iCloud download helper"
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/bin/restic-icloud-download"
    checksum_algorithm: sha256
  register: restic_icloud_download_binary
  tags:
    - restic-darwin
    - config
    - restic-darwin_restic
    - restic-darwin_restic_config

- name: "restic : Check iCloud download helper checksum"
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/libexec/restic-icloud-download.checksum"
  register: restic_icloud_download_marker
  tags:
    - restic-darwin
    - config
    - restic-darwin_restic
    - restic-darwin_restic_config

- name: "restic : Read iCloud download helper checksum"
  ansible.builtin.slurp:
    src: "{{ ansible_facts['env']['HOME'] }}/.local/libexec/restic-icloud-download.checksum"
  when: restic_icloud_download_marker.stat.exists
  register: restic_icloud_download_marker_content
  tags:
    - restic-darwin
    - config
    - restic-darwin_restic
    - restic-darwin_restic_config

- name: "restic : Compile iCloud download helper"
  ansible.builtin.shell: |
    set -e
    output="{{ ansible_facts['env']['HOME'] }}/.local/bin/restic-icloud-download.new"
    trap 'rm -f "${output}"' EXIT
    xcrun swiftc -O \
      "{{ ansible_facts['env']['HOME'] }}/.local/libexec/restic-icloud-download.swift" \
      -o "${output}"
    chmod 0755 "${output}"
    mv "${output}" "{{ ansible_facts['env']['HOME'] }}/.local/bin/restic-icloud-download"
  when: >-
    not restic_icloud_download_binary.stat.exists or
    not restic_icloud_download_marker.stat.exists or
    (restic_icloud_download_marker_content.content | default('') | b64decode | trim) !=
    (restic_icloud_download_source.checksum ~ ' ' ~ (restic_icloud_download_binary.stat.checksum | default('')))
  register: restic_icloud_download_compile
  changed_when: true
  tags:
    - restic-darwin
    - config
    - restic-darwin_restic
    - restic-darwin_restic_config

- name: "restic : Check compiled iCloud download helper"
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/bin/restic-icloud-download"
    checksum_algorithm: sha256
  register: restic_icloud_download_compiled_binary
  tags:
    - restic-darwin
    - config
    - restic-darwin_restic
    - restic-darwin_restic_config

- name: "restic : Record iCloud download helper checksum"
  ansible.builtin.copy:
    content: "{{ restic_icloud_download_source.checksum }} {{ restic_icloud_download_compiled_binary.stat.checksum }}\n"
    dest: "{{ ansible_facts['env']['HOME'] }}/.local/libexec/restic-icloud-download.checksum"
    mode: '0600'
  when: restic_icloud_download_compiled_binary.stat.checksum is defined
  tags:
    - restic-darwin
    - config
    - restic-darwin_restic
    - restic-darwin_restic_config

- name: "restic : Set iCloud download helper permissions"
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/bin/restic-icloud-download"
    state: file
    mode: '0755'
  when: restic_icloud_download_compiled_binary.stat.exists
  tags:
    - restic-darwin
    - config
    - restic-darwin_restic
    - restic-darwin_restic_config

- name: "restic : Copy scripts"
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/{{ item }}"
    mode: '0755'
  loop:
    - restic-s3-backup
    - restic-s3-check
  vars:
    home: "{{ ansible_facts['env']['HOME'] }}"
  tags:
    - restic-darwin
    - config
    - restic-darwin_restic
    - restic-darwin_restic_config

- name: "restic : Copy launchd agents"
  ansible.builtin.template:
    src: "jp.rewse.{{ item }}.plist.j2"
    dest: "{{ ansible_facts['env']['HOME'] }}/Library/LaunchAgents/jp.rewse.{{ item }}.plist"
    mode: '0644'
  loop:
    - restic-s3-backup
    - restic-s3-check
  vars:
    home: "{{ ansible_facts['env']['HOME'] }}"
  register: restic_agents
  tags:
    - restic-darwin
    - config
    - restic-darwin_restic
    - restic-darwin_restic_config

# bootout before bootstrap because launchd keeps the definition it loaded and
# ignores a rewritten file until the job is replaced.
- name: "restic : Reload launchd agents"
  ansible.builtin.shell: |
    launchctl bootout gui/$(id -u)/jp.rewse.{{ item.item }} 2>/dev/null || true
    launchctl bootstrap gui/$(id -u) "{{ ansible_facts['env']['HOME'] }}/Library/LaunchAgents/jp.rewse.{{ item.item }}.plist"
  loop: "{{ restic_agents.results | selectattr('changed') | list }}"
  loop_control:
    label: "{{ item.item }}"
  tags:
    - restic-darwin
    - config
    - restic-darwin_restic
    - restic-darwin_restic_config
