[defaults]
# Run notified handlers even when a later task fails, so a failure in the
# services tier of a host-type play does not drop pending OS restarts.
force_handlers = True
interpreter_python=/usr/bin/python3
# The remote user's home rather than /tmp, where another local account could
# create the directory first and read or replace the files staged in it.
remote_tmp = ~/.ansible/tmp
inventory = inventory
lookup_plugins = plugins/lookup
test_plugins = plugins/test

[ssh_connection]
pipelining = True
