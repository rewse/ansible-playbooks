name: TruffleHog

on:
  schedule:
    - cron: "3 19 * * 0"  # Every Monday at 04:03 JST (19:03 UTC Sun)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Secret Sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: rewse/actions/trufflehog@34ded731c37181d550c0c82419743c53f7ab6540  # v1.1.7
        with:
          extra-args: --results=verified,unknown
