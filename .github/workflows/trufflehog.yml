name: TruffleHog

on:
  schedule:
    - cron: "3 19 * * 0"  # Every Monday at 04:03 JST (19:03 UTC Sun)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Secret Sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: trufflesecurity/trufflehog@e76dff8a7e57d6df0c60ad8cbf5d5cba505a8fc9  # v3.99.2
        with:
          base: ""
          head: main
          # Keep in step with the action version above; Dependabot does not update this input.
          version: 3.99.0@sha256:39ee0643ae620664287bcc95f133f3fc8484590d6ca4e7105d96b90dac4b9f6f
          extra_args: --results=verified,unknown
