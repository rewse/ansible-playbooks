name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa  # v10.3.1

      - name: Setup Aikido Safe Chain
        uses: rewse/actions/setup-safe-chain@0d135e777b83f37d11136115713ee84b9d779b31  # v1.1.5

      # uvx runs through the Safe Chain shim, so hook environments are
      # installed through Safe Chain too. pre-commit-uv builds hook environments
      # with uv, which finds the uv-managed Python that uvx runs on; plain
      # virtualenv looks for it on PATH and fails on the runner.
      - name: Run pre-commit
        env:
          # zizmor runs its online audits, such as impostor-commit, with a token.
          GH_TOKEN: ${{ github.token }}
        run: uvx --with pre-commit-uv==4.3.0 pre-commit@4.6.2 run --all-files --show-diff-on-failure
